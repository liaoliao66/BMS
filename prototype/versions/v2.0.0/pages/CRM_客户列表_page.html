  <script>
    function toggleCargoTag(btn) {
      btn.classList.toggle('on');
    }

    function addCustomCargo() {
      const input = document.getElementById('cargoCustomInput');
      const box = document.getElementById('cargoTagBox');
      if (!input || !box) return;
      const name = (input.value || '').trim();
      if (!name) { showToast('请输入货种名称', 'error'); return; }
      const exists = Array.from(box.querySelectorAll('[data-cargo]')).some(el => el.getAttribute('data-cargo') === name);
      if (exists) {
        const hit = box.querySelector('[data-cargo="' + name + '"]');
        if (hit) hit.classList.add('on');
        input.value = '';
        return;
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cargo-tag on';
      btn.setAttribute('data-cargo', name);
      btn.onclick = function () { toggleCargoTag(btn); };
      btn.textContent = name;
      box.appendChild(btn);
      input.value = '';
    }

    function renumberContacts() {
      const list = document.getElementById('contactList');
      if (!list) return;
      const rows = list.querySelectorAll('.contact-row');
      rows.forEach((row, i) => {
        const label = row.querySelector('.contact-index');
        if (label) label.textContent = '联系人 ' + (i + 1);
        const del = row.querySelector('.contact-del');
        if (!del) return;
        if (rows.length <= 1) {
          del.disabled = true;
          del.className = 'contact-del text-xs text-slate-300 cursor-not-allowed';
          del.title = '至少保留 1 条';
          del.onclick = null;
        } else {
          del.disabled = false;
          del.className = 'contact-del text-xs text-red-400 hover:text-red-600';
          del.title = '删除';
          del.onclick = function () { removeContactRow(del); };
        }
      });
    }

    function addContactRow() {
      const list = document.getElementById('contactList');
      if (!list) return;
      const row = document.createElement('div');
      row.className = 'contact-row p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-3';
      row.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="text-xs text-slate-500 contact-index">联系人</span>
          <button type="button" class="contact-del text-xs text-red-400 hover:text-red-600" title="删除"><i class="fa-solid fa-trash"></i></button>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="crm-field"><label class="crm-label">姓名</label><input placeholder="姓名"></div>
          <div class="crm-field"><label class="crm-label">手机</label><input placeholder="手机号"></div>
          <div class="crm-field"><label class="crm-label">职务</label><input placeholder="如：采购经理"></div>
          <div class="crm-field"><label class="crm-label">备注</label><input placeholder="可选"></div>
        </div>`;
      list.appendChild(row);
      renumberContacts();
    }

    function removeContactRow(btn) {
      const list = document.getElementById('contactList');
      if (!list) return;
      if (list.querySelectorAll('.contact-row').length <= 1) {
        showToast('至少保留 1 个联系人', 'error');
        return;
      }
      const row = btn.closest('.contact-row');
      if (row) row.remove();
      renumberContacts();
    }

    window.toggleCargoTag = toggleCargoTag;
    window.addCustomCargo = addCustomCargo;
    window.addContactRow = addContactRow;
    window.removeContactRow = removeContactRow;

    const CUSTOMER_GROUP_MAP = {
      '宝钢股份有限公司': '战略钢厂',
      '首钢集团有限公司': '战略钢厂',
      '中远海运散货运输有限公司': '船东重点'
    };

    function applyGroupFilter(groupName) {
      const sel = document.getElementById('filterGroup');
      if (sel && groupName) sel.value = groupName;
      const target = (sel && sel.value) || '';
      let shown = 0;
      document.querySelectorAll('.customer-row').forEach(row => {
        const g = row.getAttribute('data-group') || '未分组';
        const ok = !target || g === target || (target === '未分组' && (!g || g === '未分组'));
        row.classList.toggle('hidden', !ok);
        if (ok) shown++;
      });
      const hint = document.getElementById('customerCountHint');
      if (hint) {
        hint.textContent = target
          ? ('筛选「' + target + '」· 本页 ' + shown + ' 条 · 一客户仅属一组')
          : '共 128 条 · 一客户仅属一组';
      }
    }

    window.CRM_MODALS = {
      customerCreate() {
        openModalFromTemplate('tpl-customer-create', {
          title: '新建客户',
          size: 'xl',
          footer: modalFooter('取消', '保存', 'bg-teal-600 hover:bg-teal-700 text-white', "closeModal(); showToast('客户保存成功')")
        });
        setTimeout(renumberContacts, 0);
      },
      customerDetail(name) {
        openModalFromTemplate('tpl-customer-detail', {
          title: '客户详情',
          size: 'xl',
          footer: `<button type="button" data-close-modal class="px-5 py-2.5 border border-slate-200 rounded-xl text-sm hover:bg-white">关闭</button>
            <button type="button" onclick="closeModal(); CRM_MODALS.talkCreate('${name}')" class="px-5 py-2.5 bg-teal-600 text-white rounded-xl text-sm hover:bg-teal-700">写洽谈</button>`
        });
        setTimeout(() => {
          const el = document.getElementById('modal-customer-name');
          if (el) el.textContent = name;
          const gEl = document.getElementById('modal-customer-group');
          if (gEl) gEl.textContent = CUSTOMER_GROUP_MAP[name] || '未分组';
        }, 0);
      },
      talkCreate(customer) {
        openModalFromTemplate('tpl-talk-create', { title: '写洽谈', size: 'md', footer: modalFooter('取消', '保存', 'bg-teal-600 hover:bg-teal-700 text-white', "closeModal(); showToast('洽谈已保存')") });
        setTimeout(() => { const sel = document.getElementById('modal-talk-customer'); if (sel && customer) sel.value = customer; }, 0);
      }
    };
    CRM_MODALS['customer-create'] = () => CRM_MODALS.customerCreate();
    CRM_MODALS['customer-detail'] = () => CRM_MODALS.customerDetail('宝钢股份有限公司');
    CRM_MODALS['talk-create'] = () => CRM_MODALS.talkCreate('宝钢股份有限公司');
    CRM_MODALS['followup-create'] = () => CRM_MODALS.talkCreate('宝钢股份有限公司');

    (function bootGroupFilter() {
      const p = new URLSearchParams(location.search).get('group');
      const sel = document.getElementById('filterGroup');
      if (sel) sel.addEventListener('change', () => applyGroupFilter(sel.value));
      if (p) applyGroupFilter(p);
    })();
  </script>
</body>
</html>
