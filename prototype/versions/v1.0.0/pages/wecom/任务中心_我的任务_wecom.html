<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>我的任务 · 企微</title>
  <link rel="stylesheet" href="../../assets/wecom-common.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body data-module="tasks" data-page="my-tasks" data-title="我的任务">
  <div id="app-root"></div>
  <main id="page-main" class="wecom-main">

    <div class="wecom-panel">
      <div class="wecom-kpi-grid cols-3">
        <div class="wecom-kpi-item">
          <div class="wecom-kpi-label">进行中</div>
          <div class="wecom-kpi-val primary" id="kDoing">0</div>
        </div>
        <div class="wecom-kpi-item">
          <div class="wecom-kpi-label">待填报</div>
          <div class="wecom-kpi-val warn" id="kPending">0</div>
        </div>
        <div class="wecom-kpi-item">
          <div class="wecom-kpi-label">已延期</div>
          <div class="wecom-kpi-val danger" id="kDelay">0</div>
        </div>
      </div>
    </div>

    <div class="wecom-form">
      <div class="wecom-form-row">
        <span class="wecom-form-label">周期</span>
        <select id="periodSelect" class="wecom-select" onchange="renderTasks()">
          <option value="2026-W34">2026-W34（本周）08-24 ~ 08-30</option>
          <option value="2026-W33">2026-W33（上周）08-17 ~ 08-23</option>
        </select>
      </div>
    </div>
    <p class="wecom-tips" id="permHint">周初创建任务（默认进行中），周期内可跟进并标记完成/延期；本期未完成将自动标为「已延期」</p>

    <div class="wecom-seg" id="ownerScopeWrap" style="display:none;margin-bottom:8px">
      <select id="ownerScope" class="wecom-input" style="margin:0 12px 8px;width:calc(100% - 24px)" onchange="onOwnerScopeChange()"></select>
    </div>

    <div class="wecom-seg" id="filters">
      <button type="button" data-f="all" class="wecom-seg-btn on" onclick="filterTasks('all')">全部</button>
      <button type="button" data-f="doing" class="wecom-seg-btn" onclick="filterTasks('doing')">进行中</button>
      <button type="button" data-f="done" class="wecom-seg-btn" onclick="filterTasks('done')">已完成</button>
      <button type="button" data-f="delay" class="wecom-seg-btn" onclick="filterTasks('delay')">已延期</button>
    </div>

    <div class="wecom-cells" id="taskList"></div>
    <p class="wecom-tips" id="footerHint" style="padding-bottom:72px">共 0 条</p>
  </main>

  <button type="button" class="wecom-fab" onclick="openCreate()" aria-label="新建任务"><i class="fa-solid fa-plus"></i></button>

  <!-- 详情 -->
  <div id="modal-view" data-modal>
    <div class="wecom-mask" onclick="BMS.closeModal('modal-view')"></div>
    <div class="wecom-dialog" style="max-width:340px">
      <div class="wecom-dialog-hd">
        <div class="wecom-dialog-title" id="vTitle">—</div>
        <div class="wecom-dialog-sub" id="vMeta">—</div>
      </div>
      <div class="wecom-dialog-bd" id="vBody"></div>
      <div class="wecom-dialog-ft" id="vActions"></div>
    </div>
  </div>

  <!-- 新建 -->
  <div id="modal-create" data-modal>
    <div class="wecom-mask" onclick="BMS.closeModal('modal-create')"></div>
    <div class="wecom-dialog" style="max-width:340px">
      <div class="wecom-dialog-hd"><div class="wecom-dialog-title">新建任务</div></div>
      <div class="wecom-dialog-bd" style="padding:12px 16px">
        <label class="wecom-field-label">任务名称 *</label>
        <input id="cName" class="wecom-input" placeholder="请输入任务名称" />
        <label class="wecom-field-label" style="margin-top:12px">关联计划 *</label>
        <select id="cPlan" class="wecom-input">
          <option>8 月装卸效率提升计划</option>
          <option>夜班协同保障计划</option>
          <option>Q3 桥吊点检专项计划</option>
        </select>
        <label class="wecom-field-label" style="margin-top:12px">起止时间 *</label>
        <div style="display:flex;gap:8px">
          <input id="cStart" type="date" class="wecom-input" value="2026-08-24" />
          <input id="cEnd" type="date" class="wecom-input" value="2026-08-30" />
        </div>
      </div>
      <div class="wecom-dialog-ft">
        <button type="button" class="wecom-dialog-btn" onclick="BMS.closeModal('modal-create')">取消</button>
        <button type="button" class="wecom-dialog-btn primary" onclick="saveCreate()">保存</button>
      </div>
    </div>
  </div>

  <!-- 跟进 -->
  <div id="modal-complete" data-modal>
    <div class="wecom-mask" onclick="BMS.closeModal('modal-complete')"></div>
    <div class="wecom-dialog" style="max-width:340px">
      <div class="wecom-dialog-hd"><div class="wecom-dialog-title">跟进</div></div>
      <div class="wecom-dialog-bd" style="padding:12px 16px">
        <p style="font-size:14px;margin:0 0 12px" id="cpName">—</p>
        <label class="wecom-field-label">标记状态 *</label>
        <div style="display:flex;flex-wrap:wrap;gap:12px;font-size:14px;margin-bottom:8px">
          <label><input type="radio" name="cpStatus" value="进行中" checked onchange="onFollowStatusChange()" /> 进行中</label>
          <label><input type="radio" name="cpStatus" value="已完成" onchange="onFollowStatusChange()" /> 完成</label>
          <label><input type="radio" name="cpStatus" value="已延期" onchange="onFollowStatusChange()" /> 延期</label>
        </div>
        <p style="font-size:12px;color:#94a3b8;margin:0 0 12px">默认进行中；可改为完成或延期</p>
        <label class="wecom-field-label" id="cpSummaryLabel">情况概述（选填）</label>
        <textarea id="cpSummary" class="wecom-input" style="min-height:80px;resize:vertical" placeholder="简述本周跟进情况"></textarea>
        <div id="cpDoneAtWrap" style="display:none">
          <label class="wecom-field-label" style="margin-top:12px">完成时间 *</label>
          <input id="cpDoneAt" type="datetime-local" class="wecom-input" value="2026-08-29T17:30" />
        </div>
      </div>
      <div class="wecom-dialog-ft">
        <button type="button" class="wecom-dialog-btn" onclick="BMS.closeModal('modal-complete')">取消</button>
        <button type="button" class="wecom-dialog-btn primary" onclick="saveComplete()">保存跟进</button>
      </div>
    </div>
  </div>

  <!-- 转派 -->
  <div id="modal-transfer" data-modal>
    <div class="wecom-mask" onclick="BMS.closeModal('modal-transfer')"></div>
    <div class="wecom-dialog" style="max-width:340px">
      <div class="wecom-dialog-hd"><div class="wecom-dialog-title">任务转派</div></div>
      <div class="wecom-dialog-bd" style="padding:12px 16px">
        <label class="wecom-field-label">新责任人 *</label>
        <select id="tfOwner" class="wecom-input"><option>孙伟</option><option>马超</option><option>王芳</option></select>
        <label class="wecom-field-label" style="margin-top:12px">转派原因 *（至少 10 字）</label>
        <textarea id="tfReason" class="wecom-input" style="min-height:72px;resize:vertical" placeholder="说明转派背景"></textarea>
      </div>
      <div class="wecom-dialog-ft">
        <button type="button" class="wecom-dialog-btn" onclick="BMS.closeModal('modal-transfer')">取消</button>
        <button type="button" class="wecom-dialog-btn primary" onclick="saveTransfer()">确认转派</button>
      </div>
    </div>
  </div>

  <script src="../../assets/wecom-common.js"></script>
  <script>
    const SELF = '刘强';
    const DEPT_MEMBERS = ['孙伟', '马超', '王芳'];
    const CURRENT_USER = { name: '刘强', dept: '装卸队', title: '装卸队负责人', role: 'dept_head', subordinates: DEPT_MEMBERS };
    const CURRENT = '2026-W34';
    let currentFilter = 'all';
    let ownerScope = 'all';
    let viewIdx = -1;
    let completeIdx = -1;
    let transferIdx = -1;

    function isDeptHead() {
      return CURRENT_USER.role === 'dept_head' || !!(CURRENT_USER.subordinates && CURRENT_USER.subordinates.length);
    }

    function canViewRow(r) {
      if (r.owner === CURRENT_USER.name) return true;
      if (isDeptHead() && (CURRENT_USER.subordinates || []).includes(r.owner)) return true;
      return false;
    }

    function isSubordinateTask(r) {
      return r.owner !== CURRENT_USER.name && (CURRENT_USER.subordinates || []).includes(r.owner);
    }

    function canFollow(r) {
      return displayStatus(r) === '进行中' && r.owner === CURRENT_USER.name && r.period === CURRENT;
    }

    function canTransfer(r) {
      const s = displayStatus(r);
      if (s === '已完成') return false;
      if (r.owner === CURRENT_USER.name) return true;
      if (r.creator === CURRENT_USER.name) return true;
      if (isDeptHead() && isSubordinateTask(r)) return true;
      return false;
    }

    function initPermissionUi() {
      const hint = document.getElementById('permHint');
      const wrap = document.getElementById('ownerScopeWrap');
      const sel = document.getElementById('ownerScope');
      if (isDeptHead()) {
        if (hint) hint.textContent = '当前：' + CURRENT_USER.name + ' · ' + CURRENT_USER.title + ' · 可查看本人及下级（' + (CURRENT_USER.subordinates || []).join('、') + '）任务';
        if (wrap && sel) {
          wrap.style.display = 'block';
          sel.innerHTML = ['<option value="all">全部（本人+下级）</option>', '<option value="self">仅本人</option>']
            .concat((CURRENT_USER.subordinates || []).map(n => '<option value="' + n + '">' + n + '（下级）</option>')).join('');
        }
      } else if (hint) {
        hint.textContent = '当前：' + CURRENT_USER.name + ' · 仅可查看本人任务';
      }
    }

    function onOwnerScopeChange() {
      ownerScope = document.getElementById('ownerScope').value;
      renderTasks();
    }

    let ROWS = [
      { id: 1, period: '2026-W34', name: '桥吊夜班流程复盘', plan: '8 月装卸效率提升计划', owner: '刘强', creator: '刘强', start: '08-24', end: '08-28', status: '进行中', filled: false, src: '自建', completeSummary: '', delayReason: '' },
      { id: 2, period: '2026-W34', name: '班前会标准化宣贯', plan: '8 月装卸效率提升计划', owner: '刘强', creator: '刘强', start: '08-25', end: '08-30', status: '进行中', filled: false, src: '自建', completeSummary: '', delayReason: '' },
      { id: 3, period: '2026-W34', name: '岸桥对位训练跟进', plan: '夜班协同保障计划', owner: '孙伟', creator: '刘强', start: '08-26', end: '08-29', status: '进行中', filled: false, src: '代建', completeSummary: '', delayReason: '' },
      { id: 9, period: '2026-W34', name: '岸桥对位训练', plan: '8 月装卸效率提升计划', owner: '马超', creator: '马超', start: '08-24', end: '08-28', status: '进行中', filled: false, src: '自建', completeSummary: '', delayReason: '' },
      { id: 10, period: '2026-W34', name: '堆场通道标识检查', plan: '堆场周转优化计划', owner: '王芳', creator: '王芳', start: '08-25', end: '08-30', status: '进行中', filled: false, src: '自建', completeSummary: '', delayReason: '' },
      { id: 4, period: '2026-W34', name: 'Q3 安全隐患现场复核', plan: 'Q3 桥吊点检专项计划', owner: '刘强', creator: '张总', start: '08-24', end: '08-27', status: '进行中', filled: true, src: '督办下达', completeSummary: '', delayReason: '' },
      { id: 12, period: '2026-W34', name: '泊位准点抽查记录', plan: '8 月装卸效率提升计划', owner: '刘强', creator: '刘强', start: '08-24', end: '08-26', status: '已完成', filled: true, src: '自建', completeSummary: '本周抽查 12 个泊位，准点率 91.7%。', delayReason: '' },
      { id: 13, period: '2026-W34', name: '班组工具点检登记', plan: '8 月装卸效率提升计划', owner: '孙伟', creator: '孙伟', start: '08-25', end: '08-28', status: '已完成', filled: true, src: '自建', completeSummary: '点检表已提交，缺件 2 项已报设备部。', delayReason: '' },
      { id: 14, period: '2026-W34', name: '夜班交接清单修订', plan: '夜班协同保障计划', owner: '刘强', creator: '刘强', start: '08-24', end: '08-27', status: '已延期', filled: false, src: '自建', completeSummary: '', delayReason: '试运行反馈尚未收齐，清单修订顺延至下周二。' },
      { id: 15, period: '2026-W34', name: '堆场标识补漆', plan: '堆场周转优化计划', owner: '王芳', creator: '王芳', start: '08-26', end: '08-29', status: '已延期', filled: false, src: '自建', completeSummary: '', delayReason: '雨天无法施工，已协调下周干燥时段补漆。' },
      { id: 5, period: '2026-W33', name: '堆场周转异常复盘', plan: '堆场周转优化计划', owner: '刘强', creator: '刘强', start: '08-17', end: '08-22', status: '已完成', filled: true, src: '自建', completeSummary: '已形成复盘纪要并同步调度。', delayReason: '' },
      { id: 6, period: '2026-W33', name: '夜班交接问题闭环', plan: '夜班协同保障计划', owner: '刘强', creator: '刘强', start: '08-18', end: '08-23', status: '已延期', filled: false, src: '自建', completeSummary: '', delayReason: '交接问题涉及多班组协同，整改方案未在本周内闭环。' },
      { id: 11, period: '2026-W33', name: '班组安全宣贯记录', plan: '8 月装卸效率提升计划', owner: '孙伟', creator: '孙伟', start: '08-18', end: '08-22', status: '已完成', filled: true, src: '自建', completeSummary: '宣贯记录已归档。', delayReason: '' }
    ];

    function displayStatus(r) {
      if (r.status === '已完成') return '已完成';
      if (r.period !== CURRENT && r.status !== '已完成') return '已延期';
      return r.status;
    }

    function stType(s) {
      if (s === '已完成') return 'ok';
      if (s === '已延期') return 'danger';
      return 'info';
    }

    function visibleInPeriod() {
      const p = document.getElementById('periodSelect').value;
      return ROWS.filter(r => r.period === p && canViewRow(r)).filter(r => {
        if (ownerScope === 'all') return true;
        if (ownerScope === 'self') return r.owner === CURRENT_USER.name;
        return r.owner === ownerScope;
      });
    }

    function filteredRows() {
      return visibleInPeriod().filter(r => {
        const s = displayStatus(r);
        if (currentFilter === 'all') return true;
        if (currentFilter === 'doing') return s === '进行中';
        if (currentFilter === 'done') return s === '已完成';
        if (currentFilter === 'delay') return s === '已延期';
        return true;
      });
    }

    function updateKpi() {
      const rows = visibleInPeriod();
      document.getElementById('kDoing').textContent = rows.filter(r => displayStatus(r) === '进行中').length;
      document.getElementById('kPending').textContent = rows.filter(r => !r.filled && displayStatus(r) === '进行中').length;
      document.getElementById('kDelay').textContent = rows.filter(r => displayStatus(r) === '已延期').length;
    }

    function renderTasks() {
      const rows = filteredRows();
      const el = document.getElementById('taskList');
      if (!rows.length) {
        el.innerHTML = WECOM.emptyState({ title: '暂无任务', desc: '当前周期与筛选条件下没有可见任务' });
      } else {
        el.innerHTML = rows.map((r) => {
          const s = displayStatus(r);
          const fillHint = !r.filled && s === '进行中' ? ' · 待填报' : (r.filled ? ' · 已填报' : '');
          const ownerHint = isSubordinateTask(r) ? ' · 下级' + r.owner : (r.owner === CURRENT_USER.name ? ' · 本人' : '');
          return WECOM.cell({
            title: r.name + (isSubordinateTask(r) ? ' · 下级' : ''),
            link: true,
            desc: r.plan + ' · ' + r.start + '~' + r.end + ownerHint + fillHint,
            ft: WECOM.statusBadge(s, stType(s)),
            onclick: 'openView(' + ROWS.indexOf(r) + ')'
          });
        }).join('');
      }
      const scopeText = ownerScope === 'all' ? '本人+下级' : (ownerScope === 'self' ? '仅本人' : ownerScope);
      document.getElementById('footerHint').textContent = '共 ' + rows.length + ' 条 · 范围：' + scopeText;
      updateKpi();
    }

    function filterTasks(f) {
      currentFilter = f;
      document.querySelectorAll('#filters .wecom-seg-btn').forEach(b => b.classList.toggle('on', b.getAttribute('data-f') === f));
      renderTasks();
    }

    function openView(idx) {
      viewIdx = idx;
      const r = ROWS[idx];
      const s = displayStatus(r);
      document.getElementById('vTitle').textContent = r.name;
      document.getElementById('vMeta').textContent = r.plan + ' · ' + s;
      const rows = [
        ['来源', r.src], ['责任人', r.owner + (isSubordinateTask(r) ? '（下级）' : r.owner === CURRENT_USER.name ? '（本人）' : '')], ['起止', r.start + ' ~ ' + r.end],
        ['本周期填报', r.filled ? '已填' : '未填']
      ];
      if (s === '已完成') {
        rows.push(['完成概述', r.completeSummary || '—']);
      } else if (s === '已延期') {
        rows.push(['延期原因', r.delayReason || '本期未完成，系统自动标为已延期']);
      }
      document.getElementById('vBody').innerHTML = rows.map(row => `<div class="wecom-dialog-row"><span class="lbl">${row[0]}</span><span class="val">${row[1]}</span></div>`).join('');
      let actions = '<button type="button" class="wecom-dialog-btn" onclick="BMS.closeModal(\'modal-view\')">关闭</button>';
      if (canFollow(r)) {
        if (!r.filled) actions += '<button type="button" class="wecom-dialog-btn primary" onclick="goFill()">去填报</button>';
        actions += '<button type="button" class="wecom-dialog-btn primary" onclick="openComplete()">跟进</button>';
      }
      if (canTransfer(r)) {
        actions += '<button type="button" class="wecom-dialog-btn" onclick="openTransfer()">转派</button>';
      }
      document.getElementById('vActions').innerHTML = actions;
      BMS.openModal('modal-view');
    }

    function goFill() {
      BMS.closeModal('modal-view');
      location.href = '任务中心_周期填报_wecom.html?task=' + ROWS[viewIdx].id;
    }

    function openCreate() {
      document.getElementById('cName').value = '';
      BMS.openModal('modal-create');
    }

    function saveCreate() {
      const name = document.getElementById('cName').value.trim();
      if (!name) { WECOM.toast('请填写任务名称'); return; }
      ROWS.unshift({
        id: Date.now(), period: document.getElementById('periodSelect').value, name,
        plan: document.getElementById('cPlan').value, owner: CURRENT_USER.name, creator: CURRENT_USER.name,
        start: '08-24', end: '08-30', status: '进行中', filled: false, src: '自建'
      });
      WECOM.toast('任务已保存');
      BMS.closeModal('modal-create');
      filterTasks('all');
    }

    function onFollowStatusChange() {
      const status = document.querySelector('input[name="cpStatus"]:checked')?.value || '进行中';
      const wrap = document.getElementById('cpDoneAtWrap');
      const label = document.getElementById('cpSummaryLabel');
      const ta = document.getElementById('cpSummary');
      if (wrap) wrap.style.display = status === '已完成' ? 'block' : 'none';
      if (label && ta) {
        if (status === '已完成') {
          label.textContent = '完成概述（选填）';
          ta.placeholder = '简述任务完成情况与结果';
        } else if (status === '已延期') {
          label.textContent = '延期原因（选填）';
          ta.placeholder = '说明延期原因（可不填）';
        } else {
          label.textContent = '情况概述（选填）';
          ta.placeholder = '简述本周跟进情况';
        }
      }
    }

    function openComplete() {
      completeIdx = viewIdx;
      document.getElementById('cpName').textContent = ROWS[viewIdx].name;
      document.getElementById('cpSummary').value = '';
      document.querySelectorAll('input[name="cpStatus"]').forEach(el => { el.checked = el.value === '进行中'; });
      onFollowStatusChange();
      BMS.closeModal('modal-view');
      BMS.openModal('modal-complete');
    }

    function saveComplete() {
      const status = document.querySelector('input[name="cpStatus"]:checked')?.value || '进行中';
      const doneAt = document.getElementById('cpDoneAt').value;
      const summary = (document.getElementById('cpSummary').value || '').trim();
      if (status === '已完成' && !doneAt) { WECOM.toast('请填写完成时间'); return; }
      const r = ROWS[completeIdx];
      r.status = status;
      r.filled = true;
      if (status === '已完成') {
        r.completeSummary = summary;
        r.delayReason = '';
        WECOM.toast('跟进已保存，状态：已完成');
      } else if (status === '已延期') {
        r.completeSummary = '';
        r.delayReason = summary || '本期未完成，已标记延期';
        WECOM.toast('跟进已保存，状态：已延期');
      } else {
        WECOM.toast('跟进已保存，状态：进行中');
      }
      BMS.closeModal('modal-complete');
      renderTasks();
    }

    function openTransfer() {
      transferIdx = viewIdx;
      document.getElementById('tfReason').value = '';
      BMS.closeModal('modal-view');
      BMS.openModal('modal-transfer');
    }

    function saveTransfer() {
      if ((document.getElementById('tfReason').value.trim().length || 0) < 10) {
        WECOM.toast('转派原因至少 10 字'); return;
      }
      ROWS[transferIdx].owner = document.getElementById('tfOwner').value;
      WECOM.toast('转派成功');
      BMS.closeModal('modal-transfer');
      renderTasks();
    }

    initPermissionUi();
    renderTasks();
  </script>
