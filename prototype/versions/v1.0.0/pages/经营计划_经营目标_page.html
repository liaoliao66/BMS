<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>经营目标 · 经营管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .btn-cta { background:#0f766e; }
    .btn-cta:hover { background:#0d9488; }
    .row-hover:hover { background:#f8fafc; }
  </style>
</head>
<body class="bg-slate-50" data-page="biz-targets" data-title="经营目标">
  <div id="app-root"></div>
  <div id="page-main">
    <p class="text-xs text-slate-500 mb-4">经营计划域：维护吞吐量、营收等<strong>期间目标值</strong>，供经营总览 KPI 目标环对照。与「目标计划 · 目标管理」（执行目标树）相互独立。</p>

    <div class="flex flex-wrap gap-3 justify-between mb-5">
      <div class="flex flex-wrap gap-2">
        <select class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>2026 年</option><option>2025 年</option></select>
        <select class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>全部周期</option><option>年</option><option>季</option><option>月</option></select>
        <select class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>全部指标</option><option>吞吐量</option><option>散货</option><option>件杂货</option><option>集装箱</option><option>营收</option></select>
      </div>
      <button type="button" onclick="BMS.openModal('modal-target')" class="btn-cta text-white text-sm px-4 py-2 rounded-xl inline-flex items-center gap-2"><i class="fa-solid fa-plus"></i>新增目标值</button>
    </div>

    <div class="bg-white rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500">
          <tr>
            <th class="px-5 py-3 text-left">周期</th>
            <th class="px-4 py-3 text-left">指标</th>
            <th class="px-4 py-3 text-left">目标值</th>
            <th class="px-4 py-3 text-left">单位</th>
            <th class="px-4 py-3 text-left">实际（汇总）</th>
            <th class="px-4 py-3 text-left">完成率</th>
            <th class="px-4 py-3 text-left">维护人</th>
            <th class="px-5 py-3 text-left">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-t row-hover">
            <td class="px-5 py-3">2026 年</td>
            <td class="px-4 py-3">吞吐量汇总</td>
            <td class="px-4 py-3 font-medium">600</td>
            <td class="px-4 py-3 text-slate-500">万吨</td>
            <td class="px-4 py-3">552</td>
            <td class="px-4 py-3 text-teal-700">92%</td>
            <td class="px-4 py-3">经营办</td>
            <td class="px-5 py-3"><button type="button" onclick="BMS.openModal('modal-target')" class="text-teal-700 hover:underline">编辑</button></td>
          </tr>
          <tr class="border-t row-hover">
            <td class="px-5 py-3">2026 年</td>
            <td class="px-4 py-3">散货</td>
            <td class="px-4 py-3 font-medium">530</td>
            <td class="px-4 py-3 text-slate-500">万吨</td>
            <td class="px-4 py-3">486</td>
            <td class="px-4 py-3 text-teal-700">92%</td>
            <td class="px-4 py-3">经营办</td>
            <td class="px-5 py-3"><button type="button" onclick="BMS.openModal('modal-target')" class="text-teal-700 hover:underline">编辑</button></td>
          </tr>
          <tr class="border-t row-hover">
            <td class="px-5 py-3">2026 年</td>
            <td class="px-4 py-3">营收</td>
            <td class="px-4 py-3 font-medium">1,200</td>
            <td class="px-4 py-3 text-slate-500">万元</td>
            <td class="px-4 py-3">986</td>
            <td class="px-4 py-3 text-amber-700">82%</td>
            <td class="px-4 py-3">财务部</td>
            <td class="px-5 py-3"><button type="button" onclick="BMS.openModal('modal-target')" class="text-teal-700 hover:underline">编辑</button></td>
          </tr>
          <tr class="border-t row-hover">
            <td class="px-5 py-3">2026 Q3</td>
            <td class="px-4 py-3">吞吐量汇总</td>
            <td class="px-4 py-3 font-medium">180</td>
            <td class="px-4 py-3 text-slate-500">万吨</td>
            <td class="px-4 py-3">157</td>
            <td class="px-4 py-3 text-teal-700">87%</td>
            <td class="px-4 py-3">经营办</td>
            <td class="px-5 py-3"><button type="button" onclick="BMS.openModal('modal-target')" class="text-teal-700 hover:underline">编辑</button></td>
          </tr>
        </tbody>
      </table>
      <div class="px-5 py-3 border-t text-sm text-slate-500">共 4 条 · 实际值来自作业量 / 营收等业务域汇总</div>
    </div>

    <div id="modal-target" data-modal class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMS.closeModal('modal-target')"></div>
      <div class="relative bg-white rounded-2xl shadow-[0_12px_40px_rgba(0,0,0,0.12)] w-full max-w-lg overflow-hidden flex flex-col">
        <div class="shrink-0 px-6 py-4 border-b flex justify-between items-center">
          <h3 class="text-lg font-semibold">维护经营目标</h3>
          <button type="button" onclick="BMS.closeModal('modal-target')"><i class="fa-solid fa-xmark text-slate-400"></i></button>
        </div>
        <div class="px-6 py-5 space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-sm text-slate-600 mb-1">周期类型 <span class="text-red-500">*</span></label>
              <select class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm"><option>年</option><option>季</option><option>月</option></select>
            </div>
            <div><label class="block text-sm text-slate-600 mb-1">周期值 <span class="text-red-500">*</span></label>
              <input class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" value="2026" placeholder="如 2026 / 2026-Q3 / 2026-08" />
            </div>
          </div>
          <div><label class="block text-sm text-slate-600 mb-1">指标 <span class="text-red-500">*</span></label>
            <select class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm"><option>吞吐量汇总</option><option>散货</option><option>件杂货</option><option>集装箱</option><option>营收</option></select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-sm text-slate-600 mb-1">目标值 <span class="text-red-500">*</span></label><input type="number" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" value="600" /></div>
            <div><label class="block text-sm text-slate-600 mb-1">单位</label><select class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm"><option>万吨</option><option>TEU</option><option>万元</option></select></div>
          </div>
        </div>
        <div class="shrink-0 px-6 py-4 border-t flex gap-3">
          <button type="button" onclick="BMS.toast('经营目标已保存（演示）'); BMS.closeModal('modal-target')" class="btn-cta text-white text-sm px-5 py-2.5 rounded-xl">保存</button>
          <button type="button" onclick="BMS.closeModal('modal-target')" class="text-sm text-slate-500 px-3">取消</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/common.js"></script>
</body>
</html>
