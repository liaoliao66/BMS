<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>专项管理 · 经营目标管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .card-hover { transition: transform .2s, box-shadow .2s; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .btn-cta { background:#0f766e; }
    .btn-cta:hover { background:#0d9488; }
    .btn-cta:active { transform: scale(.95); }
    .row-hover:hover { background:#f8fafc; }
  </style>
</head>
<body class="bg-slate-50" data-page="projects" data-title="专项管理">
  <div id="app-root"></div>
  <div id="page-main">
    <div class="flex flex-wrap gap-3 justify-between mb-5">
      <div class="flex flex-wrap gap-2">
        <select class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>全部部门</option><option>装卸队</option><option>调度中心</option><option>设备部</option></select>
        <select class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm"><option>全部状态</option><option>进行中</option><option>已延期</option></select>
      </div>
      <button type="button" onclick="BMS.openModal('modal-special-form')" class="btn-cta text-white text-sm px-4 py-2 rounded-xl inline-flex items-center gap-2"><i class="fa-solid fa-plus"></i>新建专项</button>
    </div>
    <div class="bg-white rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500"><tr><th class="px-5 py-3 text-left">专项名称</th><th class="px-5 py-3 text-left">归属部门</th><th class="px-5 py-3 text-left">负责人</th><th class="px-5 py-3 text-left">节点达成</th><th class="px-5 py-3 text-left">滞后任务</th><th class="px-5 py-3 text-left">状态</th><th class="px-5 py-3 text-left">操作</th></tr></thead>
        <tbody>
          <tr class="border-t row-hover"><td class="px-5 py-3"><button type="button" class="text-teal-700 hover:underline" onclick="BMS.openModal('modal-special-detail')">桥吊效能提升专项</button></td><td class="px-5 py-3">装卸队</td><td class="px-5 py-3">刘强</td><td class="px-5 py-3">2/4 按期</td><td class="px-5 py-3 text-red-500">2</td><td class="px-5 py-3"><span class="text-xs px-2 py-0.5 rounded-full bg-amber-50 text-amber-700">需关注</span></td><td class="px-5 py-3"><button type="button" onclick="BMS.openModal('modal-special-form')" class="hover:text-teal-700">编辑</button></td></tr>
          <tr class="border-t row-hover"><td class="px-5 py-3"><button type="button" class="text-teal-700 hover:underline" onclick="BMS.openModal('modal-special-detail')">堆场周转优化专项</button></td><td class="px-5 py-3">调度中心</td><td class="px-5 py-3">陈敏</td><td class="px-5 py-3">3/4 按期</td><td class="px-5 py-3">1</td><td class="px-5 py-3"><span class="text-xs px-2 py-0.5 rounded-full bg-sky-50 text-sky-700">进行中</span></td><td class="px-5 py-3"><button type="button" onclick="BMS.openModal('modal-special-form')" class="hover:text-teal-700">编辑</button></td></tr>
          <tr class="border-t row-hover"><td class="px-5 py-3"><button type="button" class="text-teal-700 hover:underline" onclick="BMS.openModal('modal-special-detail')">设备点检达标专项</button></td><td class="px-5 py-3">设备部</td><td class="px-5 py-3">赵磊</td><td class="px-5 py-3">4/5 按期</td><td class="px-5 py-3">0</td><td class="px-5 py-3"><span class="text-xs px-2 py-0.5 rounded-full bg-sky-50 text-sky-700">进行中</span></td><td class="px-5 py-3"><button type="button" onclick="BMS.openModal('modal-special-form')" class="hover:text-teal-700">编辑</button></td></tr>
        </tbody>
      </table>
      <div class="px-5 py-3 border-t text-sm text-slate-500">共 6 条 · 「专项」用于码头运营战役归集，任务可挂接专项</div>
    </div>
    <div id="modal-special-form" data-modal class="fixed inset-0 z-50 hidden items-center justify-center p-4"><div class="absolute inset-0 bg-slate-900/40" onclick="BMS.closeModal('modal-special-form')"></div><div class="relative bg-white rounded-2xl shadow-[0_12px_40px_rgba(0,0,0,0.12)] w-full max-w-xl p-6 space-y-3"><div class="flex justify-between"><h3 class="text-lg font-semibold">新建 / 编辑专项</h3><button onclick="BMS.closeModal('modal-special-form')"><i class="fa-solid fa-xmark text-slate-400"></i></button></div><input id="spName" class="w-full border rounded-xl px-3 py-2.5 text-sm" value="桥吊效能提升专项" /><div class="grid grid-cols-2 gap-3"><select class="border rounded-xl px-3 py-2.5 text-sm"><option>装卸队</option><option>调度中心</option><option>设备部</option></select><select class="border rounded-xl px-3 py-2.5 text-sm"><option>刘强</option><option>陈敏</option><option>赵磊</option></select></div><div class="grid grid-cols-2 gap-3"><input type="date" class="border rounded-xl px-3 py-2.5 text-sm" value="2026-07-01" /><input type="date" class="border rounded-xl px-3 py-2.5 text-sm" value="2026-09-30" /></div><div class="flex gap-2"><button onclick="(function(){if(!document.getElementById('spName').value.trim()){BMS.toast('请填写专项名称','error');return;}BMS.toast('专项已保存');BMS.closeModal('modal-special-form');})()" class="btn-cta text-white px-4 py-2 rounded-xl text-sm">保存</button><button onclick="BMS.closeModal('modal-special-form')" class="text-sm text-slate-500">取消</button></div></div></div>
    <div id="modal-special-detail" data-modal class="fixed inset-0 z-50 hidden items-center justify-center p-4"><div class="absolute inset-0 bg-slate-900/40" onclick="BMS.closeModal('modal-special-detail')"></div><div class="relative bg-white rounded-2xl shadow-[0_12px_40px_rgba(0,0,0,0.12)] w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6"><div class="flex justify-between mb-4"><div><h3 class="text-lg font-semibold">桥吊效能提升专项</h3><p class="text-sm text-slate-500 mt-1">装卸队 · 刘强 · 节点 2/4 · 滞后 2</p></div><button onclick="BMS.closeModal('modal-special-detail')"><i class="fa-solid fa-xmark text-slate-400"></i></button></div><ul class="text-sm space-y-2 mb-4"><li class="border rounded-xl px-3 py-2 flex justify-between"><span>桥吊夜班流程复盘</span><span class="text-amber-600">未更新</span></li><li class="border rounded-xl px-3 py-2 flex justify-between"><span>钢丝绳点检整改</span><span class="text-emerald-600">进行中</span></li></ul><div class="flex gap-2"><button onclick="BMS.closeModal('modal-special-detail');BMS.openModal('modal-special-form')" class="border px-4 py-2 rounded-xl text-sm">编辑</button><button onclick="BMS.closeModal('modal-special-detail')" class="btn-cta text-white px-4 py-2 rounded-xl text-sm">关闭</button></div></div></div>
  </div>
  <script src="../assets/common.js"></script>
</body>
</html>
