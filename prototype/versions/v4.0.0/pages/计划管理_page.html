<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>计划管理 · v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .btn-cta { background:#0f766e; } .btn-cta:hover { background:#0d9488; }
    .grid-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .grid-table th, .grid-table td { border: 1px solid #e8eaed; padding: 8px 10px; vertical-align: middle; }
    .grid-table thead th { background: #f5f6f8; color: #5f6368; font-weight: 500; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
    .grid-table tbody tr:hover { background: #fafbfc; }
    .col-head { display: inline-flex; align-items: center; gap: 4px; }
    .tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 4px; font-size: 12px; line-height: 20px; border: 1px solid #e8eaed; background: #f1f3f4; color: #5f6368; white-space: nowrap; }
    .tag-p0 { background:#fce8e6;color:#c5221f;border-color:#f5c6c4; }
    .tag-p1 { background:#fef7e0;color:#e37400;border-color:#fde293; }
    .tag-p2 { background:#f1f3f4;color:#5f6368;border-color:#e8eaed; }
    .name-link { color: #1a73e8; cursor: pointer; }
    .name-link:hover { text-decoration: underline; }
    .caret-btn { color: #0f766e; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent; padding: 0; cursor: pointer; }
    .cell-edit { cursor: pointer; min-height: 24px; display: inline-flex; align-items: center; gap: 4px; }
    .cell-edit:hover { background: #eef5f4; border-radius: 4px; }
    .inline-input { border: 1px solid #1a73e8; border-radius: 4px; padding: 2px 6px; font-size: 13px; background: #fff; max-width: 100%; min-width: 5rem; }
    .name-wrap { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
    .frac { color: #9aa0a6; font-size: 12px; margin-left: 4px; }
    .pct-num { font-variant-numeric: tabular-nums; }
    .helper-box { max-height: 120px; overflow: auto; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; background: #fff; }
    .helper-box label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .helper-box label:hover { background: #f8fafc; }
    .form-section { border: 1px solid #e8eaed; border-radius: 12px; overflow: hidden; background: #fff; }
    .form-section-hd { padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 600; color: #1e293b; }
    .form-section-bd { padding: 14px; }
    .form-label { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .form-label .req { color: #ef4444; margin-left: 2px; }
    .form-ctrl { width: 100%; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 12px; font-size: 13px; color: #0f172a; background: #fff; }
    .form-ctrl:focus { outline: none; border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15,118,110,0.12); }
    textarea.form-ctrl { resize: vertical; min-height: 72px; line-height: 1.5; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" data-page="plans" data-title="计划管理">
  <div id="app-root"></div>
  <div id="page-main" class="hidden">

    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex flex-wrap gap-2">
        <button type="button" id="btnNew" class="btn-cta text-white text-sm px-3 py-2 rounded-xl"><i class="fa-solid fa-plus mr-1"></i>新建部门计划</button>
        <a id="btnImportPlan" href="计划导入_page.html?mode=plan" class="hidden text-sm px-3 py-2 rounded-xl border border-teal-200 bg-teal-50 text-teal-800"><i class="fa-solid fa-file-import mr-1"></i>导入计划</a>
        <button type="button" id="btnCollapse" class="text-sm px-3 py-2 rounded-xl border border-slate-200 bg-white">一键收起</button>
        <button type="button" id="btnExpand" class="text-sm px-3 py-2 rounded-xl border border-slate-200 bg-white">全部展开</button>
      </div>
      <div class="flex flex-wrap gap-2 items-center text-sm">
        <label id="wrapProblem" class="hidden items-center gap-1.5 text-slate-600 px-2 py-1.5 rounded-xl border border-slate-200 bg-white cursor-pointer">
          <input type="checkbox" id="onlyProblem" class="rounded" /> 仅问题节点
        </label>
        <select id="fDept" class="border border-slate-200 rounded-xl px-3 py-1.5 bg-white"></select>
        <input type="search" id="kw" placeholder="搜索计划名称" class="border border-slate-200 rounded-xl px-3 py-1.5 w-52" />
      </div>
    </div>

    <div class="bg-white overflow-auto border border-[#e8eaed] rounded-lg shadow-[0_1px_2px_rgba(60,64,67,0.08)]">
      <table class="grid-table min-w-[1280px]">
        <thead>
          <tr>
            <th><span class="col-head">序号</span></th>
            <th><span class="col-head">年度 / 计划名称</span></th>
            <th><span class="col-head">优先级</span></th>
            <th><span class="col-head">负责人</span></th>
            <th><span class="col-head">配合人员</span></th>
            <th><span class="col-head">完成进度</span></th>
            <th><span class="col-head">状态</span></th>
            <th><span class="col-head">关联任务</span></th>
            <th><span class="col-head">开始时间</span></th>
            <th><span class="col-head">结束时间</span></th>
            <th><span class="col-head">操作</span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6">
      <div class="absolute inset-0 bg-slate-900/45" onclick="BMSUI.closeModal('modal')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col border border-slate-200 shadow-2xl">
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-start justify-between gap-3 shrink-0">
          <div class="min-w-0">
            <h3 class="text-lg font-semibold text-slate-900 leading-snug" id="modalTitle">新建计划</h3>
            <p id="parentHint" class="text-xs text-slate-500 mt-1 hidden"></p>
          </div>
          <button type="button" onclick="BMSUI.closeModal('modal')" class="w-9 h-9 rounded-xl border border-slate-200 text-slate-400 hover:text-slate-600 shrink-0"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-4 bg-slate-50/50">
          <input type="hidden" id="fParentId" />
          <input type="hidden" id="fMode" value="root" />
          <input type="hidden" id="fRefId" />
          <input type="hidden" id="fEditId" value="" />

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 items-start">
            <div class="space-y-3">
              <div class="form-section">
                <div class="form-section-hd">基本信息</div>
                <div class="form-section-bd space-y-3">
                  <div>
                    <label class="form-label">计划名称 <span class="req">*</span></label>
                    <input id="fName" class="form-ctrl" />
                  </div>
                  <div id="rootFields" class="space-y-3">
                    <div>
                      <label class="form-label">所属部门</label>
                      <select id="fDeptModal" class="form-ctrl"></select>
                    </div>
                    <div>
                      <label class="form-label">所属公司计划</label>
                      <select id="fCompany" class="form-ctrl"></select>
                    </div>
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="form-label">优先级</label>
                      <select id="fPriority" class="form-ctrl">
                        <option value="P0">P0</option><option value="P1" selected>P1</option><option value="P2">P2</option>
                      </select>
                    </div>
                    <div>
                      <label class="form-label">计划状态</label>
                      <select id="fStatus" class="form-ctrl">
                        <option>未开始</option><option selected>进行中</option><option>关注</option><option>已完成</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>

              <div class="form-section">
                <div class="form-section-hd">责任人</div>
                <div class="form-section-bd space-y-3">
                  <div>
                    <label class="form-label">计划负责人 <span class="req">*</span></label>
                    <select id="fOwner" class="form-ctrl"></select>
                  </div>
                  <div>
                    <label class="form-label">配合人员</label>
                    <div id="fHelpers" class="helper-box"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="space-y-3">
              <div class="form-section">
                <div class="form-section-hd">时间与进度</div>
                <div class="form-section-bd space-y-3">
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="form-label">开始日期 <span class="req">*</span></label>
                      <input type="date" id="fStart" class="form-ctrl" />
                    </div>
                    <div>
                      <label class="form-label">结束日期 <span class="req">*</span></label>
                      <input type="date" id="fEnd" class="form-ctrl" />
                    </div>
                  </div>
                  <div>
                    <label class="form-label">完成进度（%）</label>
                    <input type="number" id="fPct" min="0" max="100" value="0" class="form-ctrl" />
                  </div>
                </div>
              </div>

              <div class="form-section">
                <div class="form-section-hd">进展说明</div>
                <div class="form-section-bd">
                  <textarea id="fProgress" rows="5" class="form-ctrl" placeholder="可选"></textarea>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2 shrink-0 bg-slate-50/80">
          <button type="button" onclick="BMSUI.closeModal('modal')" class="text-sm px-4 py-2 rounded-[10px] border border-slate-200 bg-white text-slate-600">取消</button>
          <button type="button" id="btnSave" class="btn-cta text-white px-4 py-2 rounded-[10px] text-sm">保存</button>
        </div>
      </div>
    </div>

    <div id="helpersModal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('helpersModal')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-md overflow-hidden flex flex-col border border-slate-200 shadow-2xl">
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h3 class="text-base font-semibold text-slate-900">修改配合人员</h3>
            <p id="helpersModalHint" class="text-xs text-slate-500 mt-1 truncate"></p>
          </div>
          <button type="button" onclick="BMSUI.closeModal('helpersModal')" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="px-5 py-4">
          <input type="hidden" id="helpersPlanId" />
          <div id="helpersEditBox" class="helper-box" style="max-height:260px"></div>
        </div>
        <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2 bg-slate-50/80">
          <button type="button" onclick="BMSUI.closeModal('helpersModal')" class="text-sm px-4 py-2 rounded-[10px] border border-slate-200 bg-white text-slate-600">取消</button>
          <button type="button" id="btnSaveHelpers" class="btn-cta text-white px-4 py-2 rounded-[10px] text-sm">保存</button>
        </div>
      </div>
    </div>

  </div>
  <script src="../assets/store.js"></script>
  <script src="../assets/common.js"></script>
  <script>
(function () {
  let user;
  let canEdit = false;
  let collapsed = new Set();
  let editCell = null;
  let deptFilter = "";

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }
  function isEditing(id, field) {
    return editCell && editCell.id === id && editCell.field === field;
  }
  function statusTag(st) {
    const map = {
      未开始: "background:#f1f3f4;color:#5f6368",
      进行中: "background:#e8f0fe;color:#1a73e8",
      关注: "background:#fef7e0;color:#e37400",
      延期: "background:#fce8e6;color:#c5221f",
      已完成: "background:#e6f4ea;color:#137333",
    };
    return `<span class="tag" style="${map[st] || ""}">${st}</span>`;
  }
  function prioTag(p) {
    const cls = p === "P0" ? "tag-p0" : p === "P1" ? "tag-p1" : "tag-p2";
    return `<span class="tag ${cls}">${p || "P2"}</span>`;
  }
  function userOpts(selected) {
    return BMS4.USERS.filter((u) => u.role !== "总经理")
      .map((u) => `<option value="${u.id}" ${u.id === selected ? "selected" : ""}>${escapeHtml(u.name)} · ${escapeHtml(u.dept)}</option>`)
      .join("");
  }
  function fillHelpers(selectedIds, ownerId, boxId) {
    const box = document.getElementById(boxId || "fHelpers");
    if (!box) return;
    const sel = new Set(selectedIds || []);
    box.innerHTML = BMS4.USERS.filter((u) => u.role !== "总经理")
      .map((u) => {
        const dis = u.id === ownerId ? "disabled" : "";
        const checked = sel.has(u.id) && u.id !== ownerId ? "checked" : "";
        return `<label><input type="checkbox" value="${u.id}" ${checked} ${dis} /> ${escapeHtml(u.name)} · ${escapeHtml(u.dept)}</label>`;
      })
      .join("");
  }
  function selectedHelpers(boxId) {
    return Array.from(document.querySelectorAll("#" + (boxId || "fHelpers") + " input:checked")).map((el) => el.value);
  }
  function isProblemPlan(p) {
    const st = BMS4.resolvePlanStatus(p);
    if (st === "延期" || st === "关注") return true;
    if (BMS4.isPlanNearDue(p)) return true;
    const under = BMS4.taskItems.filter((t) => t.annualId === p.id);
    return under.some((t) => BMS4.isTaskOverdue(t));
  }

  function cpKey(cpId) {
    return "cp:" + cpId;
  }

  function visiblePool() {
    let list = BMS4.PLAN_ITEMS.slice();
    if (!BMS4.canViewAllPlans(user)) list = list.filter((p) => p.dept === user.dept);
    if (deptFilter) list = list.filter((p) => p.dept === deptFilter);
    const onlyProblem = document.getElementById("onlyProblem") && document.getElementById("onlyProblem").checked;
    const kw = (document.getElementById("kw").value || "").trim();
    let hit = new Set(list.map((p) => p.id));
    if (onlyProblem) hit = new Set(list.filter(isProblemPlan).map((p) => p.id));
    if (kw) {
      const byName = list.filter((p) => (p.name || "").includes(kw)).map((p) => p.id);
      const byCp = BMS4.COMPANY_PLANS.filter((c) => (c.name || "").includes(kw)).map((c) => c.id);
      const next = new Set();
      byName.forEach((id) => next.add(id));
      list.filter((p) => byCp.includes(p.companyPlanId)).forEach((p) => next.add(p.id));
      hit = onlyProblem ? new Set([...hit].filter((id) => next.has(id))) : next;
    }
    if (onlyProblem || kw) {
      [...hit].forEach((id) => {
        let cur = BMS4.planById(id);
        while (cur && cur.parentId) {
          hit.add(cur.parentId);
          cur = BMS4.planById(cur.parentId);
        }
      });
      return list.filter((p) => hit.has(p.id));
    }
    return list;
  }

  /** 一级=公司目标，二级起=部门计划树 */
  function buildRows(pool) {
    const idSet = new Set(pool.map((p) => p.id));
    const rows = [];
    const cpIds = BMS4.COMPANY_PLANS.filter((cp) => pool.some((p) => p.companyPlanId === cp.id)).map((cp) => cp.id);
    const orphans = pool.filter(
      (p) => (!p.parentId || !idSet.has(p.parentId)) && !BMS4.COMPANY_PLANS.some((c) => c.id === p.companyPlanId)
    );
    if (orphans.length) cpIds.push("__none__");

    function walkPlan(node, prefix, depth) {
      const kids = pool.filter((p) => p.parentId === node.id);
      const taskCnt = BMS4.taskItems.filter((t) => t.annualId === node.id).length;
      rows.push({ kind: "plan", plan: node, idx: prefix, depth, childCount: kids.length, taskCnt });
      if (collapsed.has(node.id)) return;
      kids.forEach((k, i) => walkPlan(k, prefix + "." + (i + 1), depth + 1));
    }

    cpIds.forEach((cpId, ci) => {
      const cp =
        cpId === "__none__"
          ? { id: "__none__", name: "未归属公司目标", priority: "P2", status: "—", progress: "", owner: "—" }
          : BMS4.COMPANY_PLANS.find((c) => c.id === cpId);
      const roots =
        cpId === "__none__"
          ? orphans
          : pool.filter((p) => p.companyPlanId === cpId && (!p.parentId || !idSet.has(p.parentId)));
      const key = cpKey(cpId);
      const taskCnt = roots.reduce((n, r) => {
        const ids = BMS4.planDescendantIds(r.id);
        return n + BMS4.taskItems.filter((t) => ids.includes(t.annualId)).length;
      }, 0);
      rows.push({ kind: "company", company: cp, cpId, idx: String(ci + 1), depth: 0, childCount: roots.length, taskCnt });
      if (collapsed.has(key)) return;
      roots.forEach((r, i) => walkPlan(r, String(ci + 1) + "." + (i + 1), 1));
    });
    return rows;
  }

  function caret(id, hasKids) {
    if (!hasKids) return `<span style="width:16px;display:inline-block"></span>`;
    const open = !collapsed.has(id);
    return `<button type="button" class="caret-btn" data-toggle="${id}"><i class="fa-solid fa-caret-${open ? "down" : "right"}"></i></button>`;
  }

  function cellCompanyName(cp, cpId) {
    const nameHtml =
      cpId === "__none__"
        ? `<span class="font-semibold text-slate-800">${escapeHtml(cp.name)}</span>`
        : BMSUI.planNameLink(cp.name, {
            id: cpId,
            kind: "company",
            className: "plan-name-link text-teal-800 hover:underline font-semibold",
          });
    return `<div class="name-wrap">
      <span class="inline-flex items-center gap-2">
        <span class="tag" style="background:#e8f0fe;color:#1a73e8;border-color:#c6dafc">年度</span>
        ${nameHtml}
      </span>
    </div>`;
  }

  function cellName(p) {
    const meta = `<div class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(p.dept)}</div>`;
    const hot = isProblemPlan(p);
    const nameLink = BMSUI.planNameLink(p.name, {
      id: p.id,
      kind: "dept",
      className: "plan-name-link hover:underline font-medium " + (hot ? "text-rose-700" : "text-teal-800"),
    });
    if (canEdit && isEditing(p.id, "name")) {
      return `<input class="inline-input" style="min-width:14rem" data-inline="name" data-id="${p.id}" data-inline-focus value="${escapeAttr(p.name)}" />`;
    }
    return `<div>
      <div class="name-wrap">${nameLink}${
      hot ? '<span class="ml-1 text-[10px] text-rose-500">问题</span>' : ""
    }</div>
      ${meta}
    </div>`;
  }

  function cellOpsCompany(cpId) {
    if (cpId === "__none__") return BMSUI.rowOpsHtml([]);
    const items = [{ label: "查看", attrs: `data-view-cp="${cpId}"` }];
    if (canEdit) items.push({ label: "新建部门计划", attrs: `data-add-under-cp="${cpId}"` });
    return BMSUI.rowOpsHtml(items);
  }

  function cellOpsPlan(p) {
    const items = [{ label: "查看", attrs: `data-view-plan="${p.id}"` }];
    if (canEdit) {
      items.push({ label: "编辑", attrs: `data-edit-plan="${p.id}"` });
      items.push({ label: "新建同级", attrs: `data-add-sibling="${p.id}"` });
      items.push({ label: "新建子计划", attrs: `data-add-child="${p.id}"` });
      items.push({ label: "删除", attrs: `data-del="${p.id}"`, danger: true });
    }
    return BMSUI.rowOpsHtml(items);
  }

  function cellPct(p) {
    const pct = BMS4.clampPct(p.progressPct);
    if (!canEdit) return `<span class="pct-num text-slate-700">${pct}%</span>`;
    if (isEditing(p.id, "progressPct")) {
      return `<span class="inline-flex items-center gap-0.5"><input type="number" min="0" max="100" class="inline-input w-16" data-inline="progressPct" data-id="${p.id}" data-inline-focus value="${pct}" />%</span>`;
    }
    return `<span class="cell-edit pct-num text-slate-700" data-start-edit="progressPct" data-id="${p.id}">${pct}%</span>`;
  }

  function cellStatus(p) {
    const st = BMS4.resolvePlanStatus(p);
    if (!canEdit) return statusTag(st);
    if (st === "延期") return `${statusTag(st)}<div class="text-[10px] text-slate-400 mt-0.5">系统自动</div>`;
    if (isEditing(p.id, "status")) {
      const opts = ["未开始", "进行中", "关注", "已完成"];
      return `<select class="inline-input" data-inline="status" data-id="${p.id}" data-inline-focus>
        ${opts.map((o) => `<option value="${o}" ${o === st ? "selected" : ""}>${o}</option>`).join("")}
      </select>`;
    }
    return `<span class="cell-edit" data-start-edit="status" data-id="${p.id}">${statusTag(st)}</span>`;
  }

  function cellPriority(p) {
    const pr = p.priority || "P2";
    if (!canEdit) return prioTag(pr);
    if (isEditing(p.id, "priority")) {
      return `<select class="inline-input" data-inline="priority" data-id="${p.id}" data-inline-focus>
        ${["P0", "P1", "P2"].map((o) => `<option value="${o}" ${o === pr ? "selected" : ""}>${o}</option>`).join("")}
      </select>`;
    }
    return `<span class="cell-edit" data-start-edit="priority" data-id="${p.id}">${prioTag(pr)}</span>`;
  }

  function cellOwner(p) {
    const owner = BMS4.userById(p.ownerId);
    if (!canEdit) {
      return owner
        ? `<span class="whitespace-nowrap">${escapeHtml(owner.name)}<div class="text-[10px] text-slate-400">${escapeHtml(owner.dept)}</div></span>`
        : "—";
    }
    if (isEditing(p.id, "ownerId")) {
      return `<select class="inline-input" style="min-width:9rem" data-inline="ownerId" data-id="${p.id}" data-inline-focus>${userOpts(p.ownerId)}</select>`;
    }
    const label = owner
      ? `${escapeHtml(owner.name)}<div class="text-[10px] text-slate-400">${escapeHtml(owner.dept)}</div>`
      : '<span class="text-slate-400">—</span>';
    return `<span class="cell-edit whitespace-nowrap" data-start-edit="ownerId" data-id="${p.id}">${label}</span>`;
  }

  function helpersLabel(p) {
    const ids = p.helperIds || [];
    let body;
    if (!ids.length) {
      body = `<span class="text-slate-400">—</span>`;
    } else {
      const names = ids.map((id) => {
        const u = BMS4.userById(id);
        return u ? u.name : id;
      });
      const show = names.slice(0, 2).join("、");
      const more = names.length > 2 ? ` +${names.length - 2}` : "";
      body = `<span class="text-slate-600" title="${escapeAttr(names.join("、"))}">${escapeHtml(show + more)}</span>`;
    }
    if (!canEdit) return body;
    return `<span class="cell-edit" data-edit-helpers="${p.id}" title="修改配合人员">${body}<i class="fa-solid fa-pen text-[10px] text-slate-400 ml-1"></i></span>`;
  }

  function cellDate(p, field) {
    const val = p[field] || "";
    const near = field === "endDate" && BMS4.isPlanNearDue(p);
    if (!canEdit) {
      return `<span class="whitespace-nowrap text-slate-600 text-xs">${escapeHtml(val || "—")}${
        near ? '<div class="text-amber-600 mt-0.5">临期</div>' : ""
      }</span>`;
    }
    if (isEditing(p.id, field)) {
      return `<input type="date" class="inline-input" data-inline="${field}" data-id="${p.id}" data-inline-focus value="${escapeAttr(val)}" />`;
    }
    return `<span class="cell-edit whitespace-nowrap text-slate-600 text-xs" data-start-edit="${field}" data-id="${p.id}">${escapeHtml(val || "—")}${
      near ? '<div class="text-amber-600 mt-0.5">临期</div>' : ""
    }</span>`;
  }

  function renderCompanyRow(row) {
    const cp = row.company;
    const key = cpKey(row.cpId);
    return `<tr class="bg-slate-50/80">
      <td class="text-slate-500 whitespace-nowrap">${row.idx}</td>
      <td>
        <div class="flex items-start gap-1">
          ${caret(key, row.childCount > 0)}
          <div class="min-w-0">
            ${cellCompanyName(cp, row.cpId)}
            ${row.childCount ? `<span class="frac">${row.childCount}项部门计划</span>` : ""}
          </div>
        </div>
      </td>
      <td>${cp.priority ? prioTag(cp.priority) : "—"}</td>
      <td class="whitespace-nowrap text-slate-600">${escapeHtml(cp.owner || "—")}</td>
      <td class="text-slate-400">—</td>
      <td class="text-slate-400">—</td>
      <td>${cp.status && cp.status !== "—" ? statusTag(cp.status) : "—"}</td>
      <td class="text-right text-slate-600">${row.taskCnt}</td>
      <td class="text-slate-400 text-xs whitespace-nowrap">${escapeHtml(cp.startDate || "—")}</td>
      <td class="text-slate-400 text-xs whitespace-nowrap">${escapeHtml(cp.endDate || "—")}</td>
      <td class="whitespace-nowrap">${cellOpsCompany(row.cpId)}</td>
    </tr>`;
  }

  function renderRow(row) {
    if (row.kind === "company") return renderCompanyRow(row);
    const p = row.plan;
    return `<tr>
      <td class="text-slate-500 whitespace-nowrap">${row.idx}</td>
      <td>
        <div class="flex items-start gap-1" style="padding-left:${row.depth * 18}px">
          ${caret(p.id, row.childCount > 0)}
          <div class="min-w-0">
            ${cellName(p)}
            ${row.childCount ? `<span class="frac">${row.childCount}子</span>` : ""}
          </div>
        </div>
      </td>
      <td>${cellPriority(p)}</td>
      <td>${cellOwner(p)}</td>
      <td class="max-w-[8rem]">${helpersLabel(p)}</td>
      <td class="whitespace-nowrap">${cellPct(p)}</td>
      <td>${cellStatus(p)}</td>
      <td class="text-right text-slate-600">${row.taskCnt}</td>
      <td>${cellDate(p, "startDate")}</td>
      <td>${cellDate(p, "endDate")}</td>
      <td class="whitespace-nowrap">${cellOpsPlan(p)}</td>
    </tr>`;
  }

  function bindActiveEditor() {
    const el = document.querySelector("[data-inline]");
    if (!el) return;
    let done = false;
    const finish = (save) => {
      if (done) return;
      done = true;
      if (save) {
        const id = el.getAttribute("data-id");
        const field = el.getAttribute("data-inline");
        const plan = BMS4.planById(id);
        if (plan) {
          if (field === "name") {
            const name = el.value.trim();
            if (!name) BMSUI.toast("名称不能为空", false);
            else if (name !== plan.name) {
              BMS4.updatePlan(id, { name });
              BMSUI.toast("已保存");
            }
          } else if (field === "progressPct") {
            const pct = BMS4.clampPct(el.value);
            const patch = { progressPct: pct };
            if (pct >= 100) patch.status = "已完成";
            BMS4.updatePlan(id, patch);
            BMSUI.toast("已保存");
          } else if (field === "status") {
            const patch = { status: el.value };
            if (el.value === "已完成") patch.progressPct = 100;
            BMS4.updatePlan(id, patch);
            BMSUI.toast("已保存");
          } else if (field === "priority") {
            if (el.value !== plan.priority) {
              BMS4.updatePlan(id, { priority: el.value });
              BMSUI.toast("已保存");
            }
          } else if (field === "ownerId") {
            if (el.value && el.value !== plan.ownerId) {
              const helpers = (plan.helperIds || []).filter((hid) => hid !== el.value);
              BMS4.updatePlan(id, { ownerId: el.value, helperIds: helpers });
              BMSUI.toast("已保存");
            }
          } else if (field === "startDate" || field === "endDate") {
            const val = el.value;
            if (!val) {
              BMSUI.toast("日期不能为空", false);
            } else {
              const startDate = field === "startDate" ? val : plan.startDate;
              const endDate = field === "endDate" ? val : plan.endDate;
              if (startDate && endDate && endDate < startDate) {
                BMSUI.toast("结束日期不能早于开始日期", false);
              } else if (val !== plan[field]) {
                BMS4.updatePlan(id, { [field]: val });
                BMSUI.toast("已保存");
              }
            }
          }
        }
      }
      editCell = null;
      render();
    };
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        finish(true);
      }
      if (e.key === "Escape") finish(false);
    });
    if (el.tagName === "SELECT") {
      el.addEventListener("change", () => finish(true));
      el.addEventListener("blur", () => setTimeout(() => finish(false), 150));
    } else {
      el.addEventListener("blur", () => setTimeout(() => finish(true), 120));
    }
  }

  function render() {
    const pool = visiblePool();
    const rows = buildRows(pool);
    document.getElementById("tbody").innerHTML = rows.length
      ? rows.map(renderRow).join("")
      : `<tr><td colspan="11" class="text-center text-slate-400 py-10">暂无计划，请在公司目标下新建部门计划</td></tr>`;

    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.getAttribute("data-toggle");
        if (collapsed.has(id)) collapsed.delete(id);
        else collapsed.add(id);
        render();
      };
    });
    document.querySelectorAll("[data-start-edit]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        editCell = { id: el.getAttribute("data-id"), field: el.getAttribute("data-start-edit") };
        render();
        requestAnimationFrame(() => {
          const focusEl = document.querySelector("[data-inline-focus]");
          if (focusEl) focusEl.focus();
        });
      };
    });
    document.querySelectorAll("[data-edit-helpers]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        openHelpersModal(el.getAttribute("data-edit-helpers"));
      };
    });
    document.querySelectorAll("[data-view-cp]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        BMSUI.openPlanDetail(btn.getAttribute("data-view-cp"), "company");
      };
    });
    document.querySelectorAll("[data-view-plan]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        BMSUI.openPlanDetail(btn.getAttribute("data-view-plan"), "dept");
      };
    });
    document.querySelectorAll("[data-edit-plan]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openEditPlan(btn.getAttribute("data-edit-plan"));
      };
    });
    document.querySelectorAll("[data-add-under-cp]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openModal({ mode: "underCp", companyPlanId: btn.getAttribute("data-add-under-cp") });
      };
    });
    document.querySelectorAll("[data-add-child]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openModal({ mode: "child", refId: btn.getAttribute("data-add-child") });
      };
    });
    document.querySelectorAll("[data-add-sibling]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openModal({ mode: "sibling", refId: btn.getAttribute("data-add-sibling") });
      };
    });
    document.querySelectorAll("[data-del]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.getAttribute("data-del");
        const r = BMS4.removePlan(id);
        if (!r.ok) return BMSUI.toast(r.reason, false);
        BMSUI.toast("已删除");
        render();
      };
    });
    BMSUI.bindRowOps(document.getElementById("tbody"));
    bindActiveEditor();
  }

  function openHelpersModal(planId) {
    const plan = BMS4.planById(planId);
    if (!plan) return;
    document.getElementById("helpersPlanId").value = planId;
    document.getElementById("helpersModalHint").textContent = plan.name || "";
    fillHelpers(plan.helperIds || [], plan.ownerId, "helpersEditBox");
    BMSUI.openModal("helpersModal");
  }

  function saveHelpersModal() {
    const planId = document.getElementById("helpersPlanId").value;
    const plan = BMS4.planById(planId);
    if (!plan) return BMSUI.toast("计划不存在", false);
    const helperIds = selectedHelpers("helpersEditBox").filter((id) => id !== plan.ownerId);
    BMS4.updatePlan(planId, { helperIds });
    BMSUI.closeModal("helpersModal");
    BMSUI.toast("已保存");
    render();
  }

  function openEditPlan(id) {
    const p = BMS4.planById(id);
    if (!p) return;
    document.getElementById("fMode").value = "edit";
    document.getElementById("fEditId").value = id;
    document.getElementById("fRefId").value = "";
    document.getElementById("fParentId").value = p.parentId || "";
    document.getElementById("modalTitle").textContent = "编辑计划";
    const hint = document.getElementById("parentHint");
    const rootFields = document.getElementById("rootFields");
    hint.classList.remove("hidden");
    hint.textContent = "路径：" + (BMS4.planPathLabel(p.id) || p.name);
    if (p.parentId) {
      rootFields.classList.add("hidden");
    } else {
      rootFields.classList.remove("hidden");
      document.getElementById("fDeptModal").value = p.dept || user.dept;
      if (p.companyPlanId) document.getElementById("fCompany").value = p.companyPlanId;
    }
    document.getElementById("fName").value = p.name || "";
    document.getElementById("fProgress").value = p.progress || "";
    document.getElementById("fStatus").value = BMS4.resolvePlanStatus(p) === "延期" ? p.status || "进行中" : p.status || "进行中";
    document.getElementById("fPriority").value = p.priority || "P1";
    document.getElementById("fPct").value = String(BMS4.clampPct(p.progressPct));
    document.getElementById("fStart").value = p.startDate || "";
    document.getElementById("fEnd").value = p.endDate || "";
    document.getElementById("fOwner").innerHTML = userOpts(p.ownerId || user.id);
    fillHelpers(p.helperIds || [], p.ownerId || user.id);
    document.getElementById("fOwner").onchange = () =>
      fillHelpers(selectedHelpers(), document.getElementById("fOwner").value);
    BMSUI.openModal("modal");
  }

  function openModal(opts) {
    const mode = (opts && opts.mode) || "root";
    const refId = (opts && opts.refId) || "";
    const presetCp = (opts && opts.companyPlanId) || "";
    document.getElementById("fMode").value = mode;
    document.getElementById("fEditId").value = "";
    document.getElementById("fRefId").value = refId;
    document.getElementById("fName").value = "";
    document.getElementById("fProgress").value = "";
    document.getElementById("fStatus").value = "进行中";
    document.getElementById("fPriority").value = "P1";
    document.getElementById("fPct").value = "0";
    document.getElementById("fStart").value = "";
    document.getElementById("fEnd").value = "";
    const hint = document.getElementById("parentHint");
    const rootFields = document.getElementById("rootFields");
    const ref = refId ? BMS4.planById(refId) : null;
    let defaultOwner = user.id;
    let defaultHelpers = [];

    if (mode === "child" && ref) {
      document.getElementById("fParentId").value = ref.id;
      document.getElementById("modalTitle").textContent = "新建子计划";
      hint.classList.remove("hidden");
      hint.textContent = "上级：" + BMS4.planPathLabel(ref.id);
      rootFields.classList.add("hidden");
      document.getElementById("fPriority").value = ref.priority || "P1";
      document.getElementById("fStart").value = ref.startDate || "";
      document.getElementById("fEnd").value = ref.endDate || "";
      defaultOwner = ref.ownerId || user.id;
      defaultHelpers = ref.helperIds || [];
    } else if (mode === "sibling" && ref) {
      document.getElementById("fParentId").value = ref.parentId || "";
      document.getElementById("modalTitle").textContent = "新建同级计划";
      if (ref.parentId) {
        hint.classList.remove("hidden");
        hint.textContent = "与「" + ref.name + "」同级 · 上级：" + BMS4.planPathLabel(ref.parentId);
        rootFields.classList.add("hidden");
        const parent = BMS4.planById(ref.parentId);
        defaultOwner = (parent && parent.ownerId) || ref.ownerId || user.id;
        defaultHelpers = (parent && parent.helperIds) || [];
        document.getElementById("fStart").value = (parent && parent.startDate) || "";
        document.getElementById("fEnd").value = (parent && parent.endDate) || "";
      } else {
        const cp = BMS4.COMPANY_PLANS.find((c) => c.id === ref.companyPlanId);
        hint.classList.remove("hidden");
        hint.textContent = "与「" + ref.name + "」同级 · 归属公司目标：" + (cp ? cp.name : "—");
        rootFields.classList.remove("hidden");
        document.getElementById("fDeptModal").value = ref.dept || user.dept;
        if (ref.companyPlanId) document.getElementById("fCompany").value = ref.companyPlanId;
        defaultOwner = ref.ownerId || user.id;
      }
    } else {
      document.getElementById("fParentId").value = "";
      document.getElementById("modalTitle").textContent = "新建部门计划";
      rootFields.classList.remove("hidden");
      document.getElementById("fDeptModal").value = user.dept;
      if (presetCp) {
        document.getElementById("fCompany").value = presetCp;
        const cp = BMS4.COMPANY_PLANS.find((c) => c.id === presetCp);
        hint.classList.remove("hidden");
        hint.textContent = "归属公司目标：" + (cp ? cp.name : "");
      } else {
        hint.classList.add("hidden");
      }
      defaultOwner = user.id;
    }
    document.getElementById("fOwner").innerHTML = userOpts(defaultOwner);
    fillHelpers(defaultHelpers, defaultOwner);
    document.getElementById("fOwner").onchange = () => fillHelpers(selectedHelpers(), document.getElementById("fOwner").value);
    BMSUI.openModal("modal");
  }

  function savePlan() {
    const name = document.getElementById("fName").value.trim();
    if (!name) return BMSUI.toast("请填写计划名称", false);
    const startDate = document.getElementById("fStart").value;
    const endDate = document.getElementById("fEnd").value;
    if (!startDate || !endDate) return BMSUI.toast("请填写开始与结束日期", false);
    if (endDate < startDate) return BMSUI.toast("结束日期不能早于开始日期", false);
    const ownerId = document.getElementById("fOwner").value;
    if (!ownerId) return BMSUI.toast("请选择计划负责人", false);
    const mode = document.getElementById("fMode").value || "root";
    const editId = document.getElementById("fEditId").value;
    const refId = document.getElementById("fRefId").value;
    const ref = refId ? BMS4.planById(refId) : null;
    const parentId = document.getElementById("fParentId").value || null;
    let status = document.getElementById("fStatus").value;
    let progressPct = BMS4.clampPct(document.getElementById("fPct").value);
    if (status === "已完成") progressPct = 100;
    const payload = {
      name,
      status,
      progress: document.getElementById("fProgress").value.trim(),
      priority: document.getElementById("fPriority").value,
      ownerId,
      helperIds: selectedHelpers().filter((id) => id !== ownerId),
      startDate,
      endDate,
      progressPct,
    };
    if (mode === "edit" && editId) {
      const cur = BMS4.planById(editId);
      if (!cur) return BMSUI.toast("计划不存在", false);
      if (!cur.parentId) {
        payload.dept = document.getElementById("fDeptModal").value || cur.dept || user.dept;
        payload.companyPlanId = document.getElementById("fCompany").value || cur.companyPlanId || "";
      }
      BMS4.updatePlan(editId, payload);
      BMSUI.closeModal("modal");
      BMSUI.toast("已保存");
      render();
      return;
    }
    payload.parentId = parentId;
    if (!parentId) {
      payload.dept = document.getElementById("fDeptModal").value || (ref && ref.dept) || user.dept;
      payload.companyPlanId = document.getElementById("fCompany").value || (ref && ref.companyPlanId) || "";
    }
    const item = BMS4.addPlan(payload);
    if (parentId) collapsed.delete(parentId);
    if (payload.companyPlanId) collapsed.delete(cpKey(payload.companyPlanId));
    BMSUI.closeModal("modal");
    BMSUI.toast(item.status === "延期" ? "已创建（已过结束日，状态自动为延期）" : "已创建，配合人已进入待办");
    render();
    return item;
  }

  document.addEventListener("DOMContentLoaded", () => {
    user = BMS4.getRoleUser();
    canEdit = BMS4.canEditPlans(user);
    document.getElementById("btnNew").classList.toggle("hidden", !canEdit);
    if (BMS4.isPlanAdmin(user)) {
      // 同页同名「计划管理」；管理员多部门筛选与导入入口由权限控制
      const btnImp = document.getElementById("btnImportPlan");
      if (btnImp) btnImp.classList.remove("hidden");
    }

    const fd = document.getElementById("fDept");
    if (BMS4.canViewAllPlans(user)) {
      document.getElementById("wrapProblem").classList.remove("hidden");
      document.getElementById("wrapProblem").classList.add("inline-flex");
      document.getElementById("onlyProblem").onchange = render;
      fd.innerHTML = '<option value="">全部部门</option>' + BMS4.DEPTS.map((d) => `<option value="${d}">${d}</option>`).join("");
      fd.disabled = false;
      fd.onchange = () => {
        deptFilter = fd.value;
        render();
      };
    } else {
      deptFilter = user.dept;
      fd.innerHTML = `<option value="${user.dept}">${user.dept}</option>`;
      fd.disabled = true;
    }

    document.getElementById("fDeptModal").innerHTML = BMS4.DEPTS.map((d) => `<option value="${d}">${d}</option>`).join("");
    document.getElementById("fCompany").innerHTML = BMS4.COMPANY_PLANS.map(
      (c) => `<option value="${c.id}">${c.name}</option>`
    ).join("");

    document.getElementById("btnNew").onclick = () => openModal({ mode: "root" });
    document.getElementById("btnSave").onclick = savePlan;
    document.getElementById("btnSaveHelpers").onclick = saveHelpersModal;
    document.getElementById("btnCollapse").onclick = () => {
      visiblePool().forEach((p) => {
        if (BMS4.planChildren(p.id).length) collapsed.add(p.id);
      });
      BMS4.COMPANY_PLANS.forEach((cp) => collapsed.add(cpKey(cp.id)));
      render();
    };
    document.getElementById("btnExpand").onclick = () => {
      collapsed.clear();
      render();
    };
    document.getElementById("kw").addEventListener("input", render);
    render();
  });
})();
  </script>
</body>
</html>
