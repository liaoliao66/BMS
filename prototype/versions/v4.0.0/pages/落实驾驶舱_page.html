<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>落实驾驶舱 · v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .btn-cta { background:#0f766e; } .btn-cta:hover { background:#0d9488; }
    .grid-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .grid-table th, .grid-table td { border: 1px solid #e8eaed; padding: 8px 10px; vertical-align: middle; }
    .grid-table thead th { background: #f5f6f8; color: #5f6368; font-weight: 500; white-space: nowrap; }
    .grid-table tbody tr:hover { background: #fafbfc; }
    .kpi-panel { background:#fff; border:1px solid #e8eaed; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(60,64,67,0.06); }
    .kpi-hd { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 16px; background:#f8fafc; border-bottom:1px solid #f1f5f9; }
    .kpi-hd .ttl { font-size:13px; font-weight:600; color:#0f172a; display:inline-flex; align-items:center; gap:8px; }
    .kpi-hd .dot { width:8px; height:8px; border-radius:999px; flex-shrink:0; }
    .kpi-hd .dot.plan { background:#0f766e; }
    .kpi-hd .dot.task { background:#0284c7; }
    .kpi-hd .meta { font-size:11px; color:#94a3b8; }
    .kpi-cols { display:grid; grid-template-columns:1fr 1fr; }
    .kpi-cols.cols-3 { grid-template-columns:1fr 1fr 1fr; }
    .kpi-cell { padding:14px 16px; cursor:pointer; border-right:1px solid #f1f5f9; transition:background .15s; min-height:96px; }
    .kpi-cell:last-child { border-right:none; }
    .kpi-cell:hover { background:#fafbfc; }
    .kpi-cell.active { background:#f0fdfa; box-shadow:inset 0 -2px 0 #0f766e; }
    .kpi-cell.active.danger { background:#fff8f7; box-shadow:inset 0 -2px 0 #dc2626; }
    .kpi-cell.active.warn { background:#fffbeb; box-shadow:inset 0 -2px 0 #d97706; }
    .kpi-label { font-size:12px; color:#64748b; line-height:1.2; }
    .kpi-num { font-size:28px; font-weight:600; letter-spacing:-0.02em; line-height:1.15; margin-top:6px; color:#0f172a; font-variant-numeric:tabular-nums; }
    .kpi-num.is-zero { color:#94a3b8; font-weight:500; }
    .kpi-num.is-hot { color:#dc2626; }
    .kpi-num.is-warn { color:#d97706; }
    .kpi-foot { margin-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-height:22px; }
    .kpi-hint { font-size:11px; color:#94a3b8; }
    .kpi-hint.hot { color:#dc2626; }
    .kpi-hint.warn { color:#b45309; }
    .prio-seg { display:inline-flex; border:1px solid #e2e8f0; border-radius:6px; overflow:hidden; background:#fff; }
    .prio-seg button { border:none; background:transparent; font-size:11px; line-height:1; padding:5px 8px; color:#64748b; cursor:pointer; border-right:1px solid #e2e8f0; font-variant-numeric:tabular-nums; }
    .prio-seg button:last-child { border-right:none; }
    .prio-seg button:hover { background:#f8fafc; color:#0f766e; }
    .prio-seg button.active { background:#0f766e; color:#fff; }
    .prio-seg button.hot:not(.active) { color:#dc2626; }
    .prio-seg button.hot.active { background:#dc2626; color:#fff; }
    @media (max-width: 640px) {
      .kpi-cols, .kpi-cols.cols-3 { grid-template-columns:1fr; }
      .kpi-cell { border-right:none; border-bottom:1px solid #f1f5f9; }
      .kpi-cell:last-child { border-bottom:none; }
    }
    .prog-track { height:8px; border-radius:999px; background:#e8eaed; overflow:hidden; }
    .prog-fill { height:100%; background:#34a853; border-radius:999px; }
    .prog-fill.bad { background:#ea4335; }
    .prog-fill.warn { background:#f9ab00; }
    .cell-hot { background:#fce8e6; color:#c5221f; font-weight:600; }
    .cell-warn { background:#fef7e0; }
    .tag { display:inline-flex; align-items:center; padding:1px 8px; border-radius:4px; font-size:12px; line-height:20px; border:1px solid transparent; white-space:nowrap; }
    .tag-p0 { background:#fce8e6;color:#c5221f;border-color:#f5c6c4; }
    .tag-p1 { background:#fef7e0;color:#e37400;border-color:#fde293; }
    .tag-p2 { background:#f1f3f4;color:#5f6368;border-color:#e8eaed; }
    .tag-out { background:#e8f0fe; color:#1a73e8; border-color:#c6dafc; }
    .tag-ex { display:inline-flex; padding:1px 8px; border-radius:4px; font-size:11px; border:1px solid #e8eaed; background:#f1f3f4; color:#5f6368; }
    .tag-ex.hot { background:#fce8e6; color:#c5221f; border-color:#f5c6c4; }
    .tag-ex.warn { background:#fef7e0; color:#e37400; border-color:#fde293; }
    .bucket-tab { border:1px solid #e2e8f0; background:#fff; color:#475569; font-size:12px; padding:4px 10px; border-radius:999px; }
    .bucket-tab.active { background:#0f766e; color:#fff; border-color:#0f766e; }
    .fold-head { cursor:pointer; user-select:none; }
    .fold-head:hover { background:#f8fafc; }
    .rank-row { display:flex; align-items:center; gap:10px; padding:6px 0; }
    .rank-row .nm { width:5.5rem; flex-shrink:0; font-size:12px; color:#334155; }
    .rank-row .track { flex:1; height:8px; background:#eef2f7; border-radius:999px; overflow:hidden; }
    .rank-row .track i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#0d9488,#0f766e); }
    .rank-row .track i.warn { background:linear-gradient(90deg,#f59e0b,#e37400); }
    .rank-row .track i.bad { background:linear-gradient(90deg,#f87171,#c5221f); }
    .rank-row .num { width:2.5rem; text-align:right; font-size:12px; font-weight:600; color:#0f172a; tabular-nums; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" data-page="cockpit" data-title="落实驾驶舱">
  <div id="app-root"></div>
  <div id="page-main" class="hidden">

    <div class="grid lg:grid-cols-2 gap-4 mb-5" id="kpi"></div>

    <div class="grid lg:grid-cols-2 gap-4 mb-5">
      <div class="bg-white border border-[#e8eaed] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(60,64,67,0.06)]">
        <div class="px-4 py-3 border-b flex flex-wrap justify-between items-center gap-2">
          <span class="text-sm font-medium">重点任务</span>
        </div>
        <div class="overflow-auto max-h-[26rem]">
          <table class="grid-table">
            <thead><tr>
              <th>状态</th><th>任务名称</th><th>部门/责任人</th><th>优先级</th><th>截止</th><th>操作</th>
            </tr></thead>
            <tbody id="focusBody"></tbody>
          </table>
        </div>
      </div>
      <div class="bg-white border border-[#e8eaed] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(60,64,67,0.06)]">
        <div class="px-4 py-3 border-b flex flex-wrap justify-between items-center gap-2">
          <span class="text-sm font-medium">我的催办篮子</span>
          <div class="flex flex-wrap gap-1.5" id="urgeBuckets"></div>
        </div>
        <div class="overflow-auto max-h-[26rem]">
          <table class="grid-table">
            <thead><tr>
              <th>催办事项</th><th>对象</th><th>期望回复</th><th>状态</th><th>操作</th>
            </tr></thead>
            <tbody id="urgeBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 会议 / 填报（过程盯控） -->
    <div class="grid lg:grid-cols-2 gap-4 mb-5">
      <div class="bg-white border border-[#e8eaed] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(60,64,67,0.06)]">
        <div class="px-4 py-3 border-b flex flex-wrap justify-between items-center gap-2">
          <span class="text-sm font-medium">周例会</span>
          <div class="flex flex-wrap items-center gap-2 text-sm">
            <select id="fMeetWeek" class="border border-slate-200 rounded-xl px-3 py-1.5 bg-white text-sm"></select>
          </div>
        </div>
        <div class="px-4 py-3 border-b border-slate-50" id="weekMinuteStatus"></div>
        <div class="overflow-auto max-h-[12rem]">
          <table class="grid-table">
            <thead><tr>
              <th>未闭环督办</th><th>责任人</th><th>截止</th><th>状态</th>
            </tr></thead>
            <tbody id="weekMeetBody"></tbody>
          </table>
        </div>
      </div>
      <div class="bg-white border border-[#e8eaed] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(60,64,67,0.06)]">
        <div class="px-4 py-3 border-b flex flex-wrap justify-between items-center gap-2">
          <span class="text-sm font-medium">填报盯控</span>
          <span class="text-[11px] text-slate-400" id="reportGapPeriod"></span>
        </div>
        <div class="px-4 py-2 border-b bg-slate-50/80 flex gap-3 text-xs" id="reportGapSummary"></div>
        <div class="overflow-auto max-h-[14rem]">
          <table class="grid-table">
            <thead><tr>
              <th>类型</th><th>部门/责任人</th><th>缺口</th><th>操作</th>
            </tr></thead>
            <tbody id="reportGapBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 部门贡献：部门计划完成度；公司计划×部门贡献矩阵本期隐藏 -->
    <div class="space-y-4 mb-5">
      <div class="bg-white border border-[#e8eaed] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(60,64,67,0.06)]">
        <div class="px-4 py-3 border-b flex flex-wrap justify-between items-center gap-2">
          <span class="text-sm font-medium">部门计划完成度</span>
        </div>
        <div class="px-4 py-3 grid sm:grid-cols-2 lg:grid-cols-5 gap-x-6 gap-y-2" id="deptPctBody"></div>
      </div>
      <!-- 公司计划 × 部门贡献矩阵：本期隐藏 -->
      <div class="hidden" aria-hidden="true">
        <div class="fold-head px-4 py-3 border-b flex justify-between items-center" id="foldMatrixHead">
          <div>
            <span class="text-sm font-medium">公司计划 × 部门贡献矩阵</span>
            <span class="text-[11px] text-amber-700 ml-2" id="matrixConflictTip"></span>
          </div>
          <i class="fa-solid fa-chevron-down text-slate-400 text-xs" id="foldMatrixIcon"></i>
        </div>
        <div id="foldMatrixBody" class="hidden">
          <div class="overflow-auto px-0">
            <table class="grid-table min-w-[900px]" id="matrixTable"></table>
          </div>
        </div>
      </div>
    </div>

    <!-- 汇总明细弹窗 -->
    <div id="modalKpiDetail" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6">
      <div class="absolute inset-0 bg-slate-900/45" onclick="BMSUI.closeModal('modalKpiDetail')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col border border-slate-200 shadow-2xl">
        <div class="px-5 py-4 border-b flex items-start justify-between gap-3 shrink-0">
          <div>
            <h3 class="text-lg font-semibold text-slate-900" id="kpiDetailTitle">汇总明细</h3>
            <p class="text-xs text-slate-500 mt-1" id="kpiDetailSub"></p>
          </div>
          <button type="button" onclick="BMSUI.closeModal('modalKpiDetail')" class="w-9 h-9 rounded-xl border border-slate-200 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-auto">
          <table class="grid-table min-w-full">
            <thead id="kpiDetailHead"></thead>
            <tbody id="kpiDetailBody"></tbody>
          </table>
        </div>
        <div class="px-5 py-3 border-t bg-slate-50/80 flex justify-end shrink-0">
          <button type="button" onclick="BMSUI.closeModal('modalKpiDetail')" class="text-sm px-4 py-2 rounded-[10px] border border-slate-200 bg-white text-slate-600">关闭</button>
        </div>
      </div>
    </div>

    <!-- 催办弹窗 -->
    <div id="modalUrge" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalUrge')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-md p-6 space-y-3 text-sm shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <h3 class="text-lg font-semibold" id="urgeModalTitle">发起催办</h3>
        <input type="hidden" id="uTarget" />
        <input type="hidden" id="uTaskId" />
        <input type="hidden" id="uPlanId" />
        <input type="hidden" id="uDept" />
        <input type="hidden" id="uCp" />
        <input type="hidden" id="uExType" />
        <input type="hidden" id="uRenewId" />
        <input type="hidden" id="uForce" value="" />
        <div>
          <label class="block text-slate-600 mb-1">催办标题</label>
          <input id="uTitle" class="w-full border rounded-xl px-3 py-2.5" />
        </div>
        <div>
          <label class="block text-slate-600 mb-1">要求说明 <span class="text-red-500">*</span></label>
          <textarea id="uNote" class="w-full border rounded-xl px-3 py-2.5 h-20" placeholder="接收人可见：说明卡点、期望结果与回复要求"></textarea>
        </div>
        <div>
          <label class="block text-slate-600 mb-1">期望回复日 <span class="text-red-500">*</span></label>
          <input type="date" id="uExpect" class="w-full border rounded-xl px-3 py-2.5" value="2026-08-21" />
        </div>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" onclick="BMSUI.closeModal('modalUrge')" class="text-slate-500 px-3">取消</button>
          <button type="button" id="btnUrgeSave" class="btn-cta text-white px-4 py-2 rounded-xl">确认催办</button>
        </div>
      </div>
    </div>

    <!-- 复检弹窗 -->
    <div id="modalRecheck" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalRecheck')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-md p-6 space-y-3 text-sm shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <h3 class="text-lg font-semibold">催办复检</h3>
        <input type="hidden" id="rUrgeId" />
        <div id="rDetail" class="text-slate-600 space-y-2 text-sm bg-slate-50 rounded-xl p-3"></div>
        <div>
          <label class="block text-slate-600 mb-1">退回说明（退回时填写）</label>
          <input id="rRejectNote" class="w-full border rounded-xl px-3 py-2.5" placeholder="复检未通过原因" />
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="BMSUI.closeModal('modalRecheck')" class="text-slate-500 px-3">取消</button>
          <button type="button" id="btnRejectUrge" class="px-4 py-2 rounded-xl border border-rose-200 text-rose-700 bg-rose-50">退回重办</button>
          <button type="button" id="btnCloseUrge" class="btn-cta text-white px-4 py-2 rounded-xl">确认闭环</button>
        </div>
      </div>
    </div>

  </div>
  <script src="../assets/store.js"></script>
  <script src="../assets/common.js"></script>
  <script>
(function () {
  /** kpiFilter: plan_late*|plan_watch*|plan_urge|task_late*|task_near|task_urge|"" */
  let kpiFilter = "";
  let urgeBucket = "overdue"; // overdue | pending | closed
  let matrixOpen = false;
  let meetWeek = "";

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function rateBar(rate) {
    const cls = rate >= 70 ? "" : rate >= 40 ? "warn" : "bad";
    return `<div class="flex items-center gap-2 min-w-[7rem]">
      <div class="prog-track flex-1"><div class="prog-fill ${cls}" style="width:${Math.min(100, rate)}%"></div></div>
      <span class="text-xs">${rate}%</span>
    </div>`;
  }

  function urgeScope(u) {
    if (u.planId && !u.taskId) return "plan";
    if (u.taskId) return "task";
    if (String(u.exceptionType || "").indexOf("计划") === 0) return "plan";
    return "task";
  }

  function countByPrio(list, prioOf) {
    const c = { P0: 0, P1: 0, P2: 0, total: list.length };
    list.forEach((item) => {
      const p = prioOf(item) || "P2";
      if (c[p] != null) c[p]++;
      else c.P2++;
    });
    return c;
  }

  function prioSegHtml(prefix, counts, activeFilter) {
    const btns = ["P0", "P1", "P2"]
      .map((p) => {
        const key = prefix + "_" + p;
        const n = counts[p] || 0;
        const on = activeFilter === key;
        const hot = p === "P0" && n > 0;
        return `<button type="button" class="${hot ? "hot" : ""} ${on ? "active" : ""}" data-kpi="${key}" title="查看 ${p}">${p} ${n}</button>`;
      })
      .join("");
    return `<div class="prio-seg">${btns}</div>`;
  }

  function cellClass(active, tone) {
    let cls = "kpi-cell";
    if (active) cls += " active" + (tone === "danger" ? " danger" : tone === "warn" ? " warn" : "");
    return cls;
  }

  function numClass(n, tone) {
    if (!n) return "kpi-num is-zero";
    if (tone === "danger") return "kpi-num is-hot";
    if (tone === "warn") return "kpi-num is-warn";
    return "kpi-num";
  }

  function prioTag(p) {
    const cls = p === "P0" ? "tag-p0" : p === "P1" ? "tag-p1" : "tag-p2";
    return `<span class="tag ${cls}">${escapeHtml(p || "P2")}</span>`;
  }

  function prioRank(p) {
    return p === "P0" ? 0 : p === "P1" ? 1 : 2;
  }

  function displayTaskStatus(t) {
    if (BMS4.isTaskOverdue(t)) return "延期";
    if (BMS4.isTaskNearDue(t)) return "临期";
    return t.status || "进行中";
  }

  function kpiTitle(key) {
    const map = {
      plan_late: "计划 · 延期",
      plan_late_P0: "计划 · 延期 · P0",
      plan_late_P1: "计划 · 延期 · P1",
      plan_late_P2: "计划 · 延期 · P2",
      plan_watch: "计划 · 关注",
      plan_watch_P0: "计划 · 关注 · P0",
      plan_watch_P1: "计划 · 关注 · P1",
      plan_watch_P2: "计划 · 关注 · P2",
      plan_urge: "计划 · 催办待回复",
      task_late: "任务 · 延期",
      task_late_P0: "任务 · 延期 · P0",
      task_late_P1: "任务 · 延期 · P1",
      task_late_P2: "任务 · 延期 · P2",
      task_near: "任务 · 临期",
      task_urge: "任务 · 催办待回复",
    };
    return map[key] || "汇总明细";
  }

  function plansByStatus(status) {
    return BMS4.PLAN_ITEMS.filter((p) => {
      const st = BMS4.resolvePlanStatus ? BMS4.resolvePlanStatus(p) : p.status;
      return st === status;
    });
  }

  function collectKpiRows(key) {
    if (key === "plan_urge") {
      return BMS4.urges
        .filter((u) => u.status === "待回复" && urgeScope(u) === "plan")
        .map((u) => ({ kind: "urge", u }));
    }
    if (key === "task_urge") {
      return BMS4.urges
        .filter((u) => u.status === "待回复" && urgeScope(u) === "task")
        .map((u) => ({ kind: "urge", u }));
    }
    if (key === "plan_late" || key.indexOf("plan_late_") === 0) {
      let list = plansByStatus("延期");
      if (key.indexOf("plan_late_") === 0) {
        const pr = key.slice("plan_late_".length);
        list = list.filter((p) => (p.priority || "P2") === pr);
      }
      return list.map((p) => ({ kind: "plan", p }));
    }
    if (key === "plan_watch" || key.indexOf("plan_watch_") === 0) {
      let list = plansByStatus("关注");
      if (key.indexOf("plan_watch_") === 0) {
        const pr = key.slice("plan_watch_".length);
        list = list.filter((p) => (p.priority || "P2") === pr);
      }
      return list.map((p) => ({ kind: "plan", p }));
    }
    if (key === "task_late" || key.indexOf("task_late_") === 0) {
      let list = BMS4.taskItems.filter((t) => BMS4.isTaskOverdue(t));
      if (key.indexOf("task_late_") === 0) {
        const pr = key.slice("task_late_".length);
        list = list.filter((t) => (t.priority || "P2") === pr);
      }
      return list.map((t) => ({ kind: "task", t }));
    }
    if (key === "task_near") {
      return BMS4.taskItems.filter((t) => BMS4.isTaskNearDue(t)).map((t) => ({ kind: "task", t }));
    }
    return [];
  }

  function openKpiDetail(key) {
    kpiFilter = key;
    const rows = collectKpiRows(key);
    document.getElementById("kpiDetailTitle").textContent = kpiTitle(key);
    document.getElementById("kpiDetailSub").textContent = "共 " + rows.length + " 条";
    const head = document.getElementById("kpiDetailHead");
    const body = document.getElementById("kpiDetailBody");

    if (!rows.length) {
      head.innerHTML = "<tr><th>说明</th></tr>";
      body.innerHTML = `<tr><td class="text-center text-slate-400 py-10">暂无对应数据</td></tr>`;
      BMSUI.openModal("modalKpiDetail");
      return;
    }

    const kind = rows[0].kind;
    if (kind === "plan") {
      head.innerHTML =
        "<tr><th>状态</th><th>计划名称</th><th>部门/责任人</th><th>优先级</th><th>结束日</th><th>进度</th></tr>";
      body.innerHTML = rows
        .map(({ p }) => {
          const st = BMS4.resolvePlanStatus ? BMS4.resolvePlanStatus(p) : p.status;
          const ou = BMS4.userById(p.ownerId);
          return `<tr>
            <td>${BMSUI.statusBadge(st)}</td>
            <td class="max-w-[16rem]"><button type="button" class="text-teal-700 hover:underline text-left" data-plan-detail="${escapeAttr(
              p.id
            )}">${escapeHtml(p.name)}</button></td>
            <td class="whitespace-nowrap">${escapeHtml(p.dept || "—")}${ou ? " · " + escapeHtml(ou.name) : ""}</td>
            <td>${prioTag(p.priority)}</td>
            <td class="whitespace-nowrap">${escapeHtml(p.endDate || "—")}</td>
            <td>${BMS4.clampPct ? BMS4.clampPct(p.progressPct) : p.progressPct || 0}%</td>
          </tr>`;
        })
        .join("");
    } else if (kind === "task") {
      head.innerHTML =
        "<tr><th>状态</th><th>任务名称</th><th>部门/责任人</th><th>优先级</th><th>截止</th></tr>";
      body.innerHTML = rows
        .map(({ t }) => {
          const ou = BMS4.userById(t.ownerId);
          const end = BMS4.taskEndDate ? BMS4.taskEndDate(t) : t.endDate || t.deadline;
          const st = displayTaskStatus(t);
          return `<tr>
            <td>${BMSUI.statusBadge(st)}</td>
            <td class="max-w-[16rem]">${
              BMSUI.taskNameLink ? BMSUI.taskNameLink(t.name, { id: t.id }) : escapeHtml(t.name)
            }</td>
            <td class="whitespace-nowrap">${escapeHtml(t.dept || "—")}${ou ? " · " + escapeHtml(ou.name) : ""}</td>
            <td>${prioTag(t.priority)}</td>
            <td class="whitespace-nowrap">${escapeHtml(end || "—")}</td>
          </tr>`;
        })
        .join("");
    } else {
      head.innerHTML = "<tr><th>状态</th><th>催办事项</th><th>对象</th><th>期望回复</th></tr>";
      body.innerHTML = rows
        .map(({ u }) => {
          const ou = BMS4.userById(u.targetUserId);
          const overdue = u.expectReplyDate && u.expectReplyDate < BMS4.DEMO_TODAY;
          return `<tr>
            <td>${BMSUI.statusBadge(u.status)}${overdue ? ' <span class="tag tag-p0">超时</span>' : ""}</td>
            <td class="max-w-[16rem]">${escapeHtml(u.title)}</td>
            <td class="whitespace-nowrap">${ou ? escapeHtml(ou.name + " · " + ou.dept) : "—"}</td>
            <td class="whitespace-nowrap ${overdue ? "text-rose-600" : ""}">${escapeHtml(u.expectReplyDate || "—")}</td>
          </tr>`;
        })
        .join("");
    }

    body.querySelectorAll("[data-plan-detail]").forEach((btn) => {
      btn.onclick = () => BMSUI.openPlanDetail(btn.getAttribute("data-plan-detail"), "dept");
    });
    BMSUI.openModal("modalKpiDetail");
  }

  function fillMeetWeekSelect() {
    const sel = document.getElementById("fMeetWeek");
    if (!sel) return;
    const weeks = BMS4.listMeetingWeeks ? BMS4.listMeetingWeeks() : [meetWeek];
    const opts = weeks
      .filter(Boolean)
      .map((w) => `<option value="${escapeAttr(w)}">${escapeHtml(w)}</option>`)
      .join("");
    if (sel.innerHTML !== opts && sel.dataset.opts !== weeks.join("|")) {
      sel.innerHTML = opts;
      sel.dataset.opts = weeks.join("|");
    }
    if (![...sel.options].some((o) => o.value === meetWeek) && weeks.length) {
      meetWeek = weeks[0];
    }
    sel.value = meetWeek;
  }

  function openUrge(opt) {
    document.getElementById("urgeModalTitle").textContent = opt.renewId ? "再次催办" : "发起催办";
    document.getElementById("uTarget").value = opt.targetUserId || "";
    document.getElementById("uTaskId").value = opt.taskId || "";
    document.getElementById("uPlanId").value = opt.planId || "";
    document.getElementById("uDept").value = opt.dept || "";
    document.getElementById("uCp").value = opt.companyPlanId || "";
    document.getElementById("uExType").value = opt.exceptionType || "";
    document.getElementById("uRenewId").value = opt.renewId || "";
    document.getElementById("uForce").value = opt.force ? "1" : "";
    document.getElementById("uTitle").value = opt.title || "请尽快处理落实事项";
    document.getElementById("uNote").value =
      opt.note || (opt.renewId ? "再次催办：请于新期望日前回复" : "请反馈未完成原因、纠偏措施与可兑现节点。");
    document.getElementById("uExpect").value = "2026-08-21";
    BMSUI.openModal("modalUrge");
  }

  function urgePayloadJson(opt) {
    return escapeAttr(JSON.stringify(opt));
  }

  function isTempTask(t) {
    return BMS4.isTempTask ? BMS4.isTempTask(t) : !t.annualId;
  }

  function taskOpen(t) {
    return t.status !== "已完成" && t.status !== "已关闭";
  }

  function listFocusTasks() {
    return BMS4.taskItems
      .filter((t) => {
        if (!taskOpen(t)) return false;
        if (BMS4.isTaskOverdue(t) || BMS4.isTaskNearDue(t)) return true;
        return t.priority === "P0" && t.status === "进行中";
      })
      .sort(
        (a, b) =>
          prioRank(a.priority) - prioRank(b.priority) ||
          String(a.endDate || a.deadline || "").localeCompare(String(b.endDate || b.deadline || ""))
      );
  }

  function render() {
    const planDelayList = plansByStatus("延期");
    const planWatchList = plansByStatus("关注");
    const planDelayC = countByPrio(planDelayList, (p) => p.priority || "P2");
    const planWatchC = countByPrio(planWatchList, (p) => p.priority || "P2");
    const taskLateList = BMS4.taskItems.filter((t) => BMS4.isTaskOverdue(t));
    const taskLateC = countByPrio(taskLateList, (t) => t.priority || "P2");
    const near = BMS4.taskItems.filter((t) => BMS4.isTaskNearDue(t)).length;
    const nearP0 = BMS4.taskItems.filter((t) => BMS4.isTaskNearDue(t) && (t.priority || "P2") === "P0").length;

    const planUrges = BMS4.urges.filter((u) => u.status === "待回复" && urgeScope(u) === "plan");
    const taskUrges = BMS4.urges.filter((u) => u.status === "待回复" && urgeScope(u) === "task");
    const planUrgeOverdue = planUrges.filter((u) => u.expectReplyDate < BMS4.DEMO_TODAY).length;
    const taskUrgeOverdue = taskUrges.filter((u) => u.expectReplyDate < BMS4.DEMO_TODAY).length;
    const pendingUrge = BMS4.urges.filter((u) => u.status === "待回复").length;
    const overdueUrge = BMS4.urges.filter((u) => u.status === "待回复" && u.expectReplyDate < BMS4.DEMO_TODAY).length;
    if (!meetWeek) meetWeek = BMS4.getCurrentWeek ? BMS4.getCurrentWeek() : "2026-W34";
    fillMeetWeekSelect();
    const meetMonth = BMS4.monthFromWeek ? BMS4.monthFromWeek(meetWeek) : String(BMS4.DEMO_TODAY || "").slice(0, 7);
    const weekGaps = BMS4.listDeptReportGaps ? BMS4.listDeptReportGaps("week", meetWeek) : [];
    const monthGaps = BMS4.listDeptReportGaps ? BMS4.listDeptReportGaps("month", meetMonth) : [];

    const planLateOn = kpiFilter === "plan_late" || kpiFilter.indexOf("plan_late_") === 0;
    const planWatchOn = kpiFilter === "plan_watch" || kpiFilter.indexOf("plan_watch_") === 0;
    const taskLateOn = kpiFilter === "task_late" || kpiFilter.indexOf("task_late_") === 0;

    document.getElementById("kpi").innerHTML = `
      <section class="kpi-panel">
        <div class="kpi-hd">
          <div class="ttl"><span class="dot plan"></span>计划</div>
          <div class="meta"></div>
        </div>
        <div class="kpi-cols cols-3">
          <div class="${cellClass(planLateOn, planDelayC.total ? "danger" : "")}" data-kpi="plan_late" title="查看计划延期明细">
            <div class="kpi-label">延期</div>
            <div class="${numClass(planDelayC.total, "danger")}">${planDelayC.total}</div>
            <div class="kpi-foot">${prioSegHtml("plan_late", planDelayC, kpiFilter)}</div>
          </div>
          <div class="${cellClass(planWatchOn, planWatchC.total ? "warn" : "")}" data-kpi="plan_watch" title="查看计划关注明细">
            <div class="kpi-label">关注</div>
            <div class="${numClass(planWatchC.total, "warn")}">${planWatchC.total}</div>
            <div class="kpi-foot">${prioSegHtml("plan_watch", planWatchC, kpiFilter)}</div>
          </div>
          <div class="${cellClass(kpiFilter === "plan_urge", planUrges.length ? "danger" : "")}" data-kpi="plan_urge" title="查看计划类催办">
            <div class="kpi-label">催办待回复</div>
            <div class="${numClass(planUrges.length, "danger")}">${planUrges.length}</div>
            <div class="kpi-foot"><span class="kpi-hint ${planUrgeOverdue ? "hot" : ""}">${
              planUrgeOverdue ? "已超时 " + planUrgeOverdue : "暂无超时"
            }</span></div>
          </div>
        </div>
      </section>
      <section class="kpi-panel">
        <div class="kpi-hd">
          <div class="ttl"><span class="dot task"></span>任务</div>
          <div class="meta"></div>
        </div>
        <div class="kpi-cols cols-3">
          <div class="${cellClass(taskLateOn, taskLateC.total ? "danger" : "")}" data-kpi="task_late" title="查看任务延期明细">
            <div class="kpi-label">延期</div>
            <div class="${numClass(taskLateC.total, "danger")}">${taskLateC.total}</div>
            <div class="kpi-foot">${prioSegHtml("task_late", taskLateC, kpiFilter)}</div>
          </div>
          <div class="${cellClass(kpiFilter === "task_near", near ? "warn" : "")}" data-kpi="task_near" title="查看临期任务">
            <div class="kpi-label">临期</div>
            <div class="${numClass(near, "warn")}">${near}</div>
            <div class="kpi-foot"><span class="kpi-hint ${nearP0 ? "warn" : ""}">${
              nearP0 ? "P0 " + nearP0 + " 项" : "无 P0 临期"
            }</span></div>
          </div>
          <div class="${cellClass(kpiFilter === "task_urge", taskUrges.length ? "danger" : "")}" data-kpi="task_urge" title="查看任务类催办">
            <div class="kpi-label">催办待回复</div>
            <div class="${numClass(taskUrges.length, "danger")}">${taskUrges.length}</div>
            <div class="kpi-foot"><span class="kpi-hint ${taskUrgeOverdue ? "hot" : ""}">${
              taskUrgeOverdue ? "已超时 " + taskUrgeOverdue : "暂无超时"
            }</span></div>
          </div>
        </div>
      </section>`;

    document.querySelectorAll("#kpi [data-kpi]").forEach((el) => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        openKpiDetail(el.getAttribute("data-kpi"));
      };
    });

    const focus = listFocusTasks();
    document.getElementById("focusBody").innerHTML = focus.length
      ? focus
          .map((t) => {
            const ou = BMS4.userById(t.ownerId);
            const end = BMS4.taskEndDate ? BMS4.taskEndDate(t) : t.endDate || t.deadline;
            const st = displayTaskStatus(t);
            return `<tr>
              <td>${BMSUI.statusBadge(st)}</td>
              <td class="max-w-[16rem]">${
                BMSUI.taskNameLink
                  ? BMSUI.taskNameLink(t.name, { id: t.id })
                  : escapeHtml(t.name)
              }${isTempTask(t) ? ' <span class="tag tag-out">临时</span>' : ""}</td>
              <td class="whitespace-nowrap text-slate-600">${escapeHtml(t.dept || "—")}${
                ou ? " · " + escapeHtml(ou.name) : ""
              }</td>
              <td>${prioTag(t.priority)}</td>
              <td class="whitespace-nowrap ${BMS4.isTaskOverdue(t) ? "text-rose-600" : "text-slate-600"}">${escapeHtml(
                end || "—"
              )}</td>
              <td>${
                ou
                  ? `<button type="button" class="text-teal-700 text-sm hover:underline" data-urge="${urgePayloadJson({
                      targetUserId: t.ownerId,
                      title: "催办：" + t.name,
                      taskId: t.id,
                      dept: t.dept || "",
                      companyPlanId: (BMS4.planById(t.annualId) || {}).companyPlanId || "",
                      exceptionType: BMS4.isTaskOverdue(t) ? "任务延期" : BMS4.isTaskNearDue(t) ? "任务临期" : "重点任务",
                    })}">催办</button>`
                  : "—"
              }</td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="6" class="text-center text-slate-400 py-8">暂无延期/临期或 P0 进行中任务</td></tr>`;
    document.querySelectorAll("#focusBody [data-urge]").forEach((btn) => {
      btn.onclick = () => {
        try {
          openUrge(JSON.parse(btn.getAttribute("data-urge")));
        } catch (err) {
          BMSUI.toast("催办参数错误", false);
        }
      };
    });

    const mm = BMS4.getMeetingMinuteByWeek ? BMS4.getMeetingMinuteByWeek(meetWeek) : null;
    const weekMeetsAll = BMS4.superviseItems.filter((m) => m.week === meetWeek && m.status !== "已完成");
    const weekMeets = weekMeetsAll.slice(0, 5);
    document.getElementById("weekMinuteStatus").innerHTML = mm
      ? `<div class="text-xs text-slate-600">${escapeHtml(meetWeek)} · 纪要已录入 · ${escapeHtml(mm.updatedAt || "")}</div>
         <div class="text-[11px] text-slate-400 mt-1 truncate" title="${escapeAttr(mm.summary || "")}">${escapeHtml(
          (mm.summary || "").replace(/\s+/g, " ").slice(0, 64)
        )}${(mm.summary || "").length > 64 ? "…" : ""}</div>`
      : `<div class="text-xs text-amber-700">${escapeHtml(meetWeek)} · 纪要尚未补录</div>`;
    document.getElementById("weekMeetBody").innerHTML = weekMeets.length
      ? weekMeets
          .map((m) => {
            const ou = BMS4.userById(m.ownerId);
            return `<tr>
              <td class="max-w-[12rem]">${escapeHtml(m.title)}</td>
              <td class="whitespace-nowrap">${ou ? escapeHtml(ou.name) : "—"}</td>
              <td class="whitespace-nowrap">${escapeHtml(m.endDate || "—")}</td>
              <td>${BMSUI.statusBadge(m.status)}</td>
            </tr>`;
          })
          .join("") +
        (weekMeetsAll.length > 5
          ? `<tr><td colspan="4" class="text-center text-xs text-slate-400 py-2">另有 ${
              weekMeetsAll.length - 5
            } 条未展示</td></tr>`
          : "")
      : `<tr><td colspan="4" class="text-center text-slate-400 py-6">该周督办均已闭环或尚未下达</td></tr>`;

    // 部门计划完成度：各部门一级计划（parentId 为空）手填进度均值
    const deptRanks = (BMS4.DEPTS || [])
      .map((dept) => {
        const roots = BMS4.PLAN_ITEMS.filter((p) => p.dept === dept && !p.parentId);
        const n = roots.length;
        const pct = n
          ? Math.round(
              roots.reduce((s, p) => s + (BMS4.clampPct ? BMS4.clampPct(p.progressPct) : Number(p.progressPct) || 0), 0) /
                n
            )
          : 0;
        return { dept, pct, n };
      })
      .sort((a, b) => b.pct - a.pct || a.dept.localeCompare(b.dept, "zh"));
    document.getElementById("deptPctBody").innerHTML = deptRanks.length
      ? deptRanks
          .map((r) => {
            const barCls = r.pct >= 60 ? "" : r.pct >= 40 ? "warn" : "bad";
            return `<div class="min-w-0">
              <div class="flex items-baseline justify-between gap-2 mb-1">
                <div class="text-xs text-slate-600 truncate" title="${escapeAttr(r.dept)}">${escapeHtml(r.dept)}</div>
                <div class="text-sm font-semibold tabular-nums text-slate-900 shrink-0">${r.pct}%</div>
              </div>
              <div class="rank-row !p-0 !gap-0">
                <div class="track"><i class="${barCls}" style="width:${Math.min(100, r.pct)}%"></i></div>
              </div>
              <div class="text-[10px] text-slate-400 mt-1">${r.n} 项一级计划</div>
            </div>`;
          })
          .join("")
      : `<div class="text-sm text-slate-400 py-4 text-center sm:col-span-2 lg:col-span-5">暂无部门计划</div>`;

    document.getElementById("reportGapPeriod").textContent = meetWeek + " · " + meetMonth;
    document.getElementById("reportGapSummary").innerHTML = `
      <span class="${weekGaps.length ? "text-rose-600 font-medium" : "text-slate-500"}">周报缺口部门 ${weekGaps.length}</span>
      <span class="text-slate-300">|</span>
      <span class="${monthGaps.length ? "text-amber-700 font-medium" : "text-slate-500"}">月报缺口部门 ${monthGaps.length}</span>`;
    const reportRows = [
      ...weekGaps.map((g) => ({ ...g, typeLabel: "周报", href: "任务周报_page.html", exType: "任务周报缺失" })),
      ...monthGaps.map((g) => ({ ...g, typeLabel: "月报", href: "任务月报_page.html", exType: "任务月报缺失" })),
    ];
    document.getElementById("reportGapBody").innerHTML = reportRows.length
      ? reportRows
          .map((g) => {
            const ou = BMS4.userById(g.ownerId);
            const tip = (g.missingNames || []).join("、");
            return `<tr>
              <td><span class="tag-ex ${g.typeLabel === "周报" ? "hot" : "warn"}">${g.typeLabel}</span></td>
              <td class="whitespace-nowrap">${escapeHtml(g.dept)}${ou ? " · " + escapeHtml(ou.name) : ""}</td>
              <td class="text-rose-600 font-medium" title="${escapeAttr(tip)}">${g.missingCount}/${g.total}</td>
              <td class="whitespace-nowrap">${
                  g.ownerId
                    ? `<button type="button" class="text-teal-700 text-sm hover:underline" data-urge="${urgePayloadJson({
                        targetUserId: g.ownerId,
                        title: "催办：" + g.dept + g.typeLabel + "填报（" + g.periodKey + "）",
                        dept: g.dept,
                        exceptionType: g.exType,
                      })}">催办</button>`
                    : "—"
                }</td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="4" class="text-center text-slate-400 py-6">该周/对应月填报均已齐</td></tr>`;
    document.querySelectorAll("#reportGapBody [data-urge]").forEach((btn) => {
      btn.onclick = () => {
        try {
          openUrge(JSON.parse(btn.getAttribute("data-urge")));
        } catch (err) {
          BMSUI.toast("催办参数错误", false);
        }
      };
    });

    const buckets = [
      ["overdue", "已超时", overdueUrge, true],
      ["pending", "待回复", pendingUrge - overdueUrge, false],
      ["closed", "已闭环", BMS4.urges.filter((u) => u.status === "已闭环").length, false],
    ];
    if (!buckets.find((b) => b[0] === urgeBucket)) urgeBucket = "overdue";
    document.getElementById("urgeBuckets").innerHTML = buckets
      .map(
        ([key, label, n, hot]) =>
          `<button type="button" class="bucket-tab ${urgeBucket === key ? "active" : ""}" data-bucket="${key}">${label} ${n}${
            hot && n ? "" : ""
          }</button>`
      )
      .join("");
    document.querySelectorAll("[data-bucket]").forEach((btn) => {
      btn.onclick = () => {
        urgeBucket = btn.getAttribute("data-bucket");
        render();
      };
    });

    let urgeList = BMS4.urges.slice();
    if (urgeBucket === "overdue") {
      urgeList = urgeList.filter((u) => u.status === "待回复" && u.expectReplyDate < BMS4.DEMO_TODAY);
    } else if (urgeBucket === "pending") {
      urgeList = urgeList.filter((u) => u.status === "待回复" && !(u.expectReplyDate < BMS4.DEMO_TODAY));
    } else {
      urgeList = urgeList.filter((u) => u.status === "已闭环");
    }

    document.getElementById("urgeBody").innerHTML = urgeList.length
      ? urgeList
          .map((u) => {
            const ou = BMS4.userById(u.targetUserId);
            const overdue = u.status === "待回复" && u.expectReplyDate < BMS4.DEMO_TODAY;
            let act = "—";
            if (u.status === "已回复") {
              act = `<button type="button" class="text-teal-700 text-sm hover:underline" data-recheck="${u.id}">复检</button>`;
            } else if (u.status === "待回复") {
              act = overdue
                ? `<button type="button" class="text-rose-600 text-sm hover:underline" data-renew="${u.id}">再次催办</button>`
                : `<span class="text-xs text-slate-400">等待回复</span>`;
            }
            const link =
              u.taskId
                ? `整体计划_任务监督_page.html?task=${encodeURIComponent(u.taskId)}&all=1`
                : u.companyPlanId
                  ? "经营总台账_page.html"
                  : "";
            const titleCell = link
              ? `<a class="truncate block text-teal-800 hover:underline" href="${link}" title="${escapeAttr(u.title)}">${escapeHtml(u.title)}</a>`
              : `<div class="truncate" title="${escapeAttr(u.title)}">${escapeHtml(u.title)}</div>`;
            return `<tr class="${overdue ? "bg-rose-50/40" : ""}">
              <td class="max-w-[12rem]">${titleCell}
                <div class="text-[11px] text-slate-400 truncate">${escapeHtml(u.note || "")}</div></td>
              <td class="whitespace-nowrap">${ou ? escapeHtml(ou.name + " · " + ou.dept) : "—"}</td>
              <td class="${overdue ? "text-rose-600 font-medium" : ""}">${u.expectReplyDate}${overdue ? " · 超时" : ""}</td>
              <td>${BMSUI.statusBadge(u.status)}</td>
              <td>${act}</td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="5" class="text-center text-slate-400 py-8">本桶暂无催办</td></tr>`;

    document.querySelectorAll("[data-recheck]").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-recheck");
        const u = BMS4.getUrge(id);
        if (!u) return;
        document.getElementById("rUrgeId").value = id;
        document.getElementById("rRejectNote").value = "";
        const hist = Array.isArray(u.noteHistory) ? u.noteHistory : [];
        const histHtml = hist.length
          ? `<div class="pt-1 border-t border-slate-200"><div class="text-slate-400 text-xs mb-1">补充记录</div>${hist
              .map(
                (h) =>
                  `<div class="text-xs mb-0.5">[${escapeHtml(h.at || "")}] ${escapeHtml(h.text || "")}</div>`
              )
              .join("")}</div>`
          : "";
        document.getElementById("rDetail").innerHTML = `
          <div><span class="text-slate-400">事项：</span>${escapeHtml(u.title)}</div>
          <div><span class="text-slate-400">期望回复日：</span>${escapeHtml(u.expectReplyDate || "—")}</div>
          <div><div class="text-slate-400 mb-0.5">要求说明：</div><div class="whitespace-pre-wrap">${escapeHtml(u.note || "—")}</div></div>
          ${histHtml}
          <div class="pt-1 border-t border-slate-200">
            <div><span class="text-slate-400">回复原因：</span>${escapeHtml(u.replyReason)}</div>
            <div><span class="text-slate-400">措施：</span>${escapeHtml(u.replyRemedy)}</div>
            <div><span class="text-slate-400">承诺日：</span>${escapeHtml(u.replyPromiseDate)}</div>
          </div>
          <p class="text-xs text-slate-500">确认闭环仅关闭催办，不会自动改任务状态。</p>`;
        BMSUI.openModal("modalRecheck");
      };
    });
    document.querySelectorAll("[data-renew]").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-renew");
        const u = BMS4.getUrge(id);
        if (!u) return;
        openUrge({
          renewId: id,
          targetUserId: u.targetUserId,
          title: u.title,
          taskId: u.taskId,
          planId: u.planId,
          dept: u.dept,
          companyPlanId: u.companyPlanId,
          exceptionType: u.exceptionType || "催办未回复",
          note: "再次催办：请于新期望日前回复",
        });
      };
    });

    // 公司计划 × 部门贡献矩阵本期隐藏，不渲染
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (!BMS4.isAdmin(BMS4.getRoleUser())) {
      document.getElementById("page-main").innerHTML =
        '<div class="bg-white rounded-2xl border p-8 text-slate-500">本页仅管理员可见。部门长/员工请在「我的待办」回复催办。</div>';
      return;
    }

    document.getElementById("fMeetWeek").onchange = () => {
      meetWeek = document.getElementById("fMeetWeek").value;
      render();
    };

    document.getElementById("btnUrgeSave").onclick = () => {
      const renewId = document.getElementById("uRenewId").value;
      const expect = document.getElementById("uExpect").value;
      const note = document.getElementById("uNote").value.trim();
      if (renewId) {
        const r = BMS4.renewUrge(renewId, expect, note || "再次催办");
        if (!r.ok) return BMSUI.toast(r.reason, false);
        BMSUI.closeModal("modalUrge");
        BMSUI.toast("已更新期望回复日");
        urgeBucket = "pending";
        render();
        return;
      }
      const r = BMS4.createUrge({
        targetUserId: document.getElementById("uTarget").value,
        title: document.getElementById("uTitle").value.trim(),
        note,
        expectReplyDate: expect,
        taskId: document.getElementById("uTaskId").value,
        planId: document.getElementById("uPlanId").value,
        dept: document.getElementById("uDept").value,
        companyPlanId: document.getElementById("uCp").value,
        exceptionType: document.getElementById("uExType").value,
        force: document.getElementById("uForce").value === "1",
      });
      if (!r.ok) return BMSUI.toast(r.reason, false);
      BMSUI.closeModal("modalUrge");
      BMSUI.toast("已催办，责任人待办已生成");
      urgeBucket = "pending";
      render();
    };
    document.getElementById("btnCloseUrge").onclick = () => {
      const r = BMS4.closeUrge(document.getElementById("rUrgeId").value);
      if (!r.ok) return BMSUI.toast(r.reason, false);
      BMSUI.closeModal("modalRecheck");
      BMSUI.toast("已闭环");
      urgeBucket = "closed";
      render();
    };
    document.getElementById("btnRejectUrge").onclick = () => {
      const r = BMS4.rejectUrge(
        document.getElementById("rUrgeId").value,
        document.getElementById("rRejectNote").value.trim() || "复检未通过，请补充措施"
      );
      if (!r.ok) return BMSUI.toast(r.reason, false);
      BMSUI.closeModal("modalRecheck");
      BMSUI.toast("已退回，责任人需重新回复");
      urgeBucket = "pending";
      render();
    };
    render();
  });
})();
  </script>
</body>
</html>
