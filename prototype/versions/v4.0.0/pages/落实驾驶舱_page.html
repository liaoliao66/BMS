<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>落实驾驶舱 · v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .btn-cta { background:#0f766e; } .btn-cta:hover { background:#0d9488; }
    .grid-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .grid-table th, .grid-table td { border: 1px solid #e8eaed; padding: 8px 10px; vertical-align: middle; }
    .grid-table thead th { background: #f5f6f8; color: #5f6368; font-weight: 500; white-space: nowrap; }
    .grid-table tbody tr:hover { background: #fafbfc; }
    .kpi-panel { background:#fff; border:1px solid #e8eaed; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(60,64,67,0.06); }
    .kpi-hd { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 16px; background:#f8fafc; border-bottom:1px solid #f1f5f9; }
    .kpi-hd .ttl { font-size:13px; font-weight:600; color:#0f172a; display:inline-flex; align-items:center; gap:8px; }
    .kpi-hd .dot { width:8px; height:8px; border-radius:999px; flex-shrink:0; }
    .kpi-hd .dot.plan { background:#0f766e; }
    .kpi-hd .dot.task { background:#0284c7; }
    .kpi-hd .meta { font-size:11px; color:#94a3b8; }
    .kpi-cols { display:grid; grid-template-columns:1fr 1fr; }
    .kpi-cols.cols-3 { grid-template-columns:1fr 1fr 1fr; }
    .kpi-cell { padding:14px 16px; cursor:pointer; border-right:1px solid #f1f5f9; transition:background .15s; min-height:96px; }
    .kpi-cell:last-child { border-right:none; }
    .kpi-cell:hover { background:#fafbfc; }
    .kpi-cell.active { background:#f0fdfa; box-shadow:inset 0 -2px 0 #0f766e; }
    .kpi-cell.active.danger { background:#fff8f7; box-shadow:inset 0 -2px 0 #dc2626; }
    .kpi-cell.active.warn { background:#fffbeb; box-shadow:inset 0 -2px 0 #d97706; }
    .kpi-label { font-size:12px; color:#64748b; line-height:1.2; }
    .kpi-num { font-size:28px; font-weight:600; letter-spacing:-0.02em; line-height:1.15; margin-top:6px; color:#0f172a; font-variant-numeric:tabular-nums; }
    .kpi-num.is-zero { color:#94a3b8; font-weight:500; }
    .kpi-num.is-hot { color:#dc2626; }
    .kpi-num.is-warn { color:#d97706; }
    .kpi-foot { margin-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-height:22px; }
    .kpi-hint { font-size:11px; color:#94a3b8; }
    .kpi-hint.hot { color:#dc2626; }
    .kpi-hint.warn { color:#b45309; }
    .prio-seg { display:inline-flex; border:1px solid #e2e8f0; border-radius:6px; overflow:hidden; background:#fff; }
    .prio-seg button { border:none; background:transparent; font-size:11px; line-height:1; padding:5px 8px; color:#64748b; cursor:pointer; border-right:1px solid #e2e8f0; font-variant-numeric:tabular-nums; }
    .prio-seg button:last-child { border-right:none; }
    .prio-seg button:hover { background:#f8fafc; color:#0f766e; }
    .prio-seg button.active { background:#0f766e; color:#fff; }
    .prio-seg button.hot:not(.active) { color:#dc2626; }
    .prio-seg button.hot.active { background:#dc2626; color:#fff; }
    @media (max-width: 640px) {
      .kpi-cols, .kpi-cols.cols-3 { grid-template-columns:1fr; }
      .kpi-cell { border-right:none; border-bottom:1px solid #f1f5f9; }
      .kpi-cell:last-child { border-bottom:none; }
    }
    .prog-track { height:8px; border-radius:999px; background:#e8eaed; overflow:hidden; }
    .prog-fill { height:100%; background:#34a853; border-radius:999px; }
    .prog-fill.bad { background:#ea4335; }
    .prog-fill.warn { background:#f9ab00; }
    .cell-hot { background:#fce8e6; color:#c5221f; font-weight:600; }
    .cell-warn { background:#fef7e0; }
    .tag { display:inline-flex; align-items:center; padding:1px 8px; border-radius:4px; font-size:12px; line-height:20px; border:1px solid transparent; white-space:nowrap; }
    .tag-out { background:#e8f0fe; color:#1a73e8; border-color:#c6dafc; }
    .tag-ex { display:inline-flex; padding:1px 8px; border-radius:4px; font-size:11px; border:1px solid #e8eaed; background:#f1f3f4; color:#5f6368; }
    .tag-ex.hot { background:#fce8e6; color:#c5221f; border-color:#f5c6c4; }
    .tag-ex.warn { background:#fef7e0; color:#e37400; border-color:#fde293; }
    .bucket-tab { border:1px solid #e2e8f0; background:#fff; color:#475569; font-size:12px; padding:4px 10px; border-radius:999px; }
    .bucket-tab.active { background:#0f766e; color:#fff; border-color:#0f766e; }
    .fold-head { cursor:pointer; user-select:none; }
    .fold-head:hover { background:#f8fafc; }
    .rank-row { display:flex; align-items:center; gap:10px; padding:6px 0; }
    .rank-row .nm { width:5.5rem; flex-shrink:0; font-size:12px; color:#334155; }
    .rank-row .track { flex:1; height:8px; background:#eef2f7; border-radius:999px; overflow:hidden; }
    .rank-row .track i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#0d9488,#0f766e); }
    .rank-row .track i.warn { background:linear-gradient(90deg,#f59e0b,#e37400); }
    .rank-row .track i.bad { background:linear-gradient(90deg,#f87171,#c5221f); }
    .rank-row .num { width:2.5rem; text-align:right; font-size:12px; font-weight:600; color:#0f172a; tabular-nums; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" data-page="cockpit" data-title="落实驾驶舱">

  <script>
(function () {
  /** kpiFilter: plan_late | plan_late_P0|P1|P2 | plan_urge | task_late | task_late_P0|P1|P2 | task_near | task_urge | "" */
  let kpiFilter = "";
  let urgeBucket = "overdue"; // overdue | pending | recheck | closed
  let matrixOpen = false;
  let exOpen = false;

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function exTag(type) {
    const hot = ["任务延期", "催办未回复", "计划卡点"].includes(type);
    const warn = ["任务临期", "计划关注", "任务周报缺失", "任务月报缺失"].includes(type);
    return `<span class="tag-ex ${hot ? "hot" : warn ? "warn" : ""}">${type}</span>`;
  }
  function rateBar(rate) {
    const cls = rate >= 70 ? "" : rate >= 40 ? "warn" : "bad";
    return `<div class="flex items-center gap-2 min-w-[7rem]">
      <div class="prog-track flex-1"><div class="prog-fill ${cls}" style="width:${Math.min(100, rate)}%"></div></div>
      <span class="text-xs">${rate}%</span>
    </div>`;
  }

  function drillHref(e) {
    if (e.taskId) return "整体计划_任务监督_page.html?task=" + encodeURIComponent(e.taskId) + "&all=1";
    if (e.planId) return null; // 计划类例外用弹窗，见 titleHtml
    if (e.type === "任务周报缺失") return "任务周报_page.html";
    if (e.type === "任务月报缺失") return "任务月报_page.html";
    if (e.companyPlanId) return "经营总台账_page.html";
    if (e.urgeId) return null;
    return "整体计划_任务监督_page.html?all=1";
  }

  function urgeScope(u) {
    if (u.planId && !u.taskId) return "plan";
    if (u.taskId) return "task";
    if (String(u.exceptionType || "").indexOf("计划") === 0) return "plan";
    return "task";
  }

  function matchKpi(e) {
    if (!kpiFilter) return true;
    if (kpiFilter === "plan_late") return e.type === "计划卡点" || e.type === "计划关注";
    if (kpiFilter.indexOf("plan_late_") === 0) {
      const p = kpiFilter.slice("plan_late_".length);
      return (e.type === "计划卡点" || e.type === "计划关注") && (e.priority || "P2") === p;
    }
    if (kpiFilter === "plan_urge") return e.type === "催办未回复" && e.urgeScope === "plan";
    if (kpiFilter === "task_late") return e.type === "任务延期";
    if (kpiFilter.indexOf("task_late_") === 0) {
      const p = kpiFilter.slice("task_late_".length);
      return e.type === "任务延期" && (e.priority || "P2") === p;
    }
    if (kpiFilter === "task_near") return e.type === "任务临期";
    if (kpiFilter === "task_urge") return e.type === "催办未回复" && e.urgeScope !== "plan";
    return true;
  }

  function countByPrio(list, prioOf) {
    const c = { P0: 0, P1: 0, P2: 0, total: list.length };
    list.forEach((item) => {
      const p = prioOf(item) || "P2";
      if (c[p] != null) c[p]++;
      else c.P2++;
    });
    return c;
  }

  function prioSegHtml(prefix, counts, activeFilter) {
    const btns = ["P0", "P1", "P2"]
      .map((p) => {
        const key = prefix + "_" + p;
        const n = counts[p] || 0;
        const on = activeFilter === key;
        const hot = p === "P0" && n > 0;
        return `<button type="button" class="${hot ? "hot" : ""} ${on ? "active" : ""}" data-kpi="${key}" title="按 ${p} 筛选">${p} ${n}</button>`;
      })
      .join("");
    return `<div class="prio-seg">${btns}</div>`;
  }

  function cellClass(active, tone) {
    let cls = "kpi-cell";
    if (active) cls += " active" + (tone === "danger" ? " danger" : tone === "warn" ? " warn" : "");
    return cls;
  }

  function numClass(n, tone) {
    if (!n) return "kpi-num is-zero";
    if (tone === "danger") return "kpi-num is-hot";
    if (tone === "warn") return "kpi-num is-warn";
    return "kpi-num";
  }

  function setKpiFilter(key) {
    kpiFilter = kpiFilter === key ? "" : key;
    if (kpiFilter) exOpen = true;
    if (kpiFilter === "plan_urge" || kpiFilter === "task_urge") {
      urgeBucket = "overdue";
    }
    render();
  }

  function openUrge(opt) {
    document.getElementById("urgeModalTitle").textContent = opt.renewId ? "再次催办" : "发起催办";
    document.getElementById("uTarget").value = opt.targetUserId || "";
    document.getElementById("uTaskId").value = opt.taskId || "";
    document.getElementById("uPlanId").value = opt.planId || "";
    document.getElementById("uDept").value = opt.dept || "";
    document.getElementById("uCp").value = opt.companyPlanId || "";
    document.getElementById("uExType").value = opt.exceptionType || "";
    document.getElementById("uRenewId").value = opt.renewId || "";
    document.getElementById("uForce").value = opt.force ? "1" : "";
    document.getElementById("uTitle").value = opt.title || "请尽快处理落实事项";
    document.getElementById("uNote").value = opt.note || "";
    document.getElementById("uExpect").value = "2026-08-21";
    BMSUI.openModal("modalUrge");
  }

  function urgePayloadJson(opt) {
    return escapeAttr(JSON.stringify(opt));
  }

  function isTempTask(t) {
    return BMS4.isTempTask ? BMS4.isTempTask(t) : !t.annualId;
  }

  function taskOpen(t) {
    return t.status !== "已完成" && t.status !== "已关闭";
  }

  function focusLight(t) {
    if (BMS4.isTaskOverdue(t)) return { label: "红灯", cls: "background:#fce8e6;color:#c5221f;border-color:#f5c6c4", rank: 3 };
    if (BMS4.isTaskNearDue(t)) return { label: "黄灯", cls: "background:#fef7e0;color:#e37400;border-color:#fde293", rank: 2 };
    return { label: "P0盯控", cls: "background:#e8f0fe;color:#1a73e8;border-color:#c6dafc", rank: 1 };
  }

  function listFocusTasks() {
    return BMS4.taskItems
      .filter((t) => {
        if (!taskOpen(t)) return false;
        if (BMS4.isTaskOverdue(t) || BMS4.isTaskNearDue(t)) return true;
        return t.priority === "P0" && t.status === "进行中";
      })
      .map((t) => ({ t, light: focusLight(t) }))
      .sort((a, b) => b.light.rank - a.light.rank || String(a.t.endDate || "").localeCompare(String(b.t.endDate || "")));
  }

  function render() {
    document.getElementById("asOf").textContent = BMS4.DEMO_TODAY;
    const allEx = BMS4.getExceptions();
    const planDelayList = BMS4.PLAN_ITEMS.filter((p) => {
      const st = BMS4.resolvePlanStatus ? BMS4.resolvePlanStatus(p) : p.status;
      return st === "延期";
    });
    const planWatch = BMS4.PLAN_ITEMS.filter((p) => {
      const st = BMS4.resolvePlanStatus ? BMS4.resolvePlanStatus(p) : p.status;
      return st === "关注";
    }).length;
    const planDelayC = countByPrio(planDelayList, (p) => p.priority || "P2");
    const taskLateList = BMS4.taskItems.filter((t) => BMS4.isTaskOverdue(t));
    const taskLateC = countByPrio(taskLateList, (t) => t.priority || "P2");
    const near = BMS4.taskItems.filter((t) => BMS4.isTaskNearDue(t)).length;
    const nearP0 = BMS4.taskItems.filter((t) => BMS4.isTaskNearDue(t) && (t.priority || "P2") === "P0").length;

    const planUrges = BMS4.urges.filter((u) => u.status === "待回复" && urgeScope(u) === "plan");
    const taskUrges = BMS4.urges.filter((u) => u.status === "待回复" && urgeScope(u) === "task");
    const planUrgeOverdue = planUrges.filter((u) => u.expectReplyDate < BMS4.DEMO_TODAY).length;
    const taskUrgeOverdue = taskUrges.filter((u) => u.expectReplyDate < BMS4.DEMO_TODAY).length;
    const pendingUrge = BMS4.urges.filter((u) => u.status === "待回复").length;
    const overdueUrge = BMS4.urges.filter((u) => u.status === "待回复" && u.expectReplyDate < BMS4.DEMO_TODAY).length;
    const recheckUrge = BMS4.urges.filter((u) => u.status === "已回复").length;
    const weekKey = BMS4.getCurrentWeek ? BMS4.getCurrentWeek() : "2026-W34";

    const planLateOn = kpiFilter === "plan_late" || kpiFilter.indexOf("plan_late_") === 0;
    const taskLateOn = kpiFilter === "task_late" || kpiFilter.indexOf("task_late_") === 0;

    document.getElementById("kpi").innerHTML = `
      <section class="kpi-panel">
        <div class="kpi-hd">
          <div class="ttl"><span class="dot plan"></span>计划</div>
          <div class="meta">先看偏航 · 关注 ${planWatch}</div>
        </div>
        <div class="kpi-cols">
          <div class="${cellClass(planLateOn, planDelayC.total ? "danger" : "")}" data-kpi="plan_late" title="筛选计划延期/关注">
            <div class="kpi-label">延期</div>
            <div class="${numClass(planDelayC.total, "danger")}">${planDelayC.total}</div>
            <div class="kpi-foot">${prioSegHtml("plan_late", planDelayC, kpiFilter)}</div>
          </div>
          <div class="${cellClass(kpiFilter === "plan_urge", planUrges.length ? "danger" : "")}" data-kpi="plan_urge" title="筛选计划类催办">
            <div class="kpi-label">催办待回复</div>
            <div class="${numClass(planUrges.length, "danger")}">${planUrges.length}</div>
            <div class="kpi-foot"><span class="kpi-hint ${planUrgeOverdue ? "hot" : ""}">${
              planUrgeOverdue ? "已超时 " + planUrgeOverdue : "暂无超时"
            }</span></div>
          </div>
        </div>
      </section>
      <section class="kpi-panel">
        <div class="kpi-hd">
          <div class="ttl"><span class="dot task"></span>任务</div>
          <div class="meta">再看执行</div>
        </div>
        <div class="kpi-cols cols-3">
          <div class="${cellClass(taskLateOn, taskLateC.total ? "danger" : "")}" data-kpi="task_late" title="筛选任务延期">
            <div class="kpi-label">延期</div>
            <div class="${numClass(taskLateC.total, "danger")}">${taskLateC.total}</div>
            <div class="kpi-foot">${prioSegHtml("task_late", taskLateC, kpiFilter)}</div>
          </div>
          <div class="${cellClass(kpiFilter === "task_near", near ? "warn" : "")}" data-kpi="task_near" title="筛选临期任务">
            <div class="kpi-label">临期 · 3天内</div>
            <div class="${numClass(near, "warn")}">${near}</div>
            <div class="kpi-foot"><span class="kpi-hint ${nearP0 ? "warn" : ""}">${
              nearP0 ? "P0 " + nearP0 + " 项" : "无 P0 临期"
            }</span></div>
          </div>
          <div class="${cellClass(kpiFilter === "task_urge", taskUrges.length ? "danger" : "")}" data-kpi="task_urge" title="筛选任务类催办">
            <div class="kpi-label">催办待回复</div>
            <div class="${numClass(taskUrges.length, "danger")}">${taskUrges.length}</div>
            <div class="kpi-foot"><span class="kpi-hint ${taskUrgeOverdue ? "hot" : ""}">${
              taskUrgeOverdue ? "已超时 " + taskUrgeOverdue : "暂无超时"
            }</span></div>
          </div>
        </div>
      </section>`;

    document.querySelectorAll("#kpi [data-kpi]").forEach((el) => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        setKpiFilter(el.getAttribute("data-kpi"));
      };
    });

    const focus = listFocusTasks();
    document.getElementById("focusBody").innerHTML = focus.length
      ? focus
          .map(({ t, light }) => {
            const ou = BMS4.userById(t.ownerId);
            const end = BMS4.taskEndDate ? BMS4.taskEndDate(t) : t.endDate || t.deadline;
            return `<tr>
              <td><span class="tag" style="${light.cls}">${light.label}</span></td>
              <td class="max-w-[16rem]">${
                BMSUI.taskNameLink
                  ? BMSUI.taskNameLink(t.name, { id: t.id })
                  : escapeHtml(t.name)
              }${isTempTask(t) ? ' <span class="tag tag-out">临时</span>' : ""}</td>
              <td class="whitespace-nowrap text-slate-600">${escapeHtml(t.dept || "—")}${
                ou ? " · " + escapeHtml(ou.name) : ""
              }</td>
              <td>${escapeHtml(t.priority || "—")}</td>
              <td class="whitespace-nowrap ${BMS4.isTaskOverdue(t) ? "text-rose-600" : "text-slate-600"}">${escapeHtml(
                end || "—"
              )}</td>
              <td>${
                ou
                  ? `<button type="button" class="text-teal-700 text-sm hover:underline" data-urge="${urgePayloadJson({
                      targetUserId: t.ownerId,
                      title: "催办：" + t.name,
                      taskId: t.id,
                      dept: t.dept || "",
                      companyPlanId: (BMS4.planById(t.annualId) || {}).companyPlanId || "",
                      exceptionType: BMS4.isTaskOverdue(t) ? "任务延期" : BMS4.isTaskNearDue(t) ? "任务临期" : "重点任务",
                    })}">催办</button>`
                  : "—"
              }</td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="6" class="text-center text-slate-400 py-8">暂无红黄灯/P0 盯控任务</td></tr>`;
    document.querySelectorAll("#focusBody [data-urge]").forEach((btn) => {
      btn.onclick = () => {
        try {
          openUrge(JSON.parse(btn.getAttribute("data-urge")));
        } catch (err) {
          BMSUI.toast("催办参数错误", false);
        }
      };
    });

    document.getElementById("weekMeetLabel").textContent = weekKey;
    const mm = BMS4.getMeetingMinuteByWeek ? BMS4.getMeetingMinuteByWeek(weekKey) : null;
    const weekMeetsAll = BMS4.superviseItems.filter((m) => m.week === weekKey && m.status !== "已完成");
    const weekMeets = weekMeetsAll.slice(0, 5);
    document.getElementById("weekMinuteStatus").innerHTML = mm
      ? `<div class="text-xs text-slate-600">纪要已录入 · ${escapeHtml(mm.updatedAt || "")}</div>
         <div class="text-[11px] text-slate-400 mt-1 truncate" title="${escapeAttr(mm.summary || "")}">${escapeHtml(
          (mm.summary || "").replace(/\s+/g, " ").slice(0, 64)
        )}${(mm.summary || "").length > 64 ? "…" : ""}</div>`
      : `<div class="text-xs text-amber-700">本周纪要尚未补录 · <a class="underline" href="会议纪要_page.html">去补录</a></div>`;
    document.getElementById("weekMeetBody").innerHTML = weekMeets.length
      ? weekMeets
          .map((m) => {
            const ou = BMS4.userById(m.ownerId);
            return `<tr>
              <td class="max-w-[12rem]"><a class="text-teal-700 hover:underline" href="任务督办_page.html">${escapeHtml(
                m.title
              )}</a></td>
              <td class="whitespace-nowrap">${ou ? escapeHtml(ou.name) : "—"}</td>
              <td class="whitespace-nowrap">${escapeHtml(m.endDate || "—")}</td>
              <td>${BMSUI.statusBadge(m.status)}</td>
            </tr>`;
          })
          .join("") +
        (weekMeetsAll.length > 5
          ? `<tr><td colspan="4" class="text-center text-xs text-slate-400 py-2"><a class="text-teal-700 hover:underline" href="任务督办_page.html">另有 ${
              weekMeetsAll.length - 5
            } 条 · 查看全部</a></td></tr>`
          : "")
      : `<tr><td colspan="4" class="text-center text-slate-400 py-6">本周督办均已闭环或尚未下达</td></tr>`;

    // 部门计划完成度：各部门一级计划（parentId 为空）手填进度均值
    const deptRanks = (BMS4.DEPTS || [])
      .map((dept) => {
        const roots = BMS4.PLAN_ITEMS.filter((p) => p.dept === dept && !p.parentId);
        const n = roots.length;
        const pct = n
          ? Math.round(
              roots.reduce((s, p) => s + (BMS4.clampPct ? BMS4.clampPct(p.progressPct) : Number(p.progressPct) || 0), 0) /
                n
            )
          : 0;
        return { dept, pct, n };
      })
      .sort((a, b) => b.pct - a.pct || a.dept.localeCompare(b.dept, "zh"));
    document.getElementById("deptPctBody").innerHTML = deptRanks.length
      ? deptRanks
          .map((r) => {
            const barCls = r.pct >= 60 ? "" : r.pct >= 40 ? "warn" : "bad";
            return `<div class="rank-row">
              <div class="nm" title="${escapeAttr(r.dept)}">${escapeHtml(r.dept)}</div>
              <div class="track"><i class="${barCls}" style="width:${Math.min(100, r.pct)}%"></i></div>
              <div class="num">${r.pct}%</div>
              <div class="text-[10px] text-slate-400 w-10 text-right">${r.n}项</div>
            </div>`;
          })
          .join("")
      : `<div class="text-sm text-slate-400 py-4 text-center">暂无部门计划</div>`;

    const typeSel = document.getElementById("fExType").value;
    const showAll = document.getElementById("exShowAll").checked;
    let filtered = allEx.filter(matchKpi);
    if (typeSel) filtered = filtered.filter((e) => e.type === typeSel);
    const shown = showAll ? filtered : filtered.slice(0, 10);
    document.getElementById("exCount").textContent =
      "共 " + filtered.length + " 条" + (!showAll && filtered.length > 10 ? " · 显示 Top 10" : "");
    document.getElementById("btnClearFilter").classList.toggle("hidden", !kpiFilter && !typeSel);
    document.getElementById("foldExBody").classList.toggle("hidden", !exOpen);
    document.getElementById("foldExIcon").className =
      "fa-solid text-slate-400 text-xs " + (exOpen ? "fa-chevron-up" : "fa-chevron-down");

    document.getElementById("exBody").innerHTML = shown.length
      ? shown
          .map((e) => {
            const ou = BMS4.userById(e.ownerId);
            const canUrge = !!e.ownerId;
            const href = drillHref(e);
            let titleHtml;
            if (e.planId && !e.taskId) {
              titleHtml = `<button type="button" class="font-medium text-teal-800 hover:underline truncate block text-left w-full" title="${escapeAttr(
                e.title
              )}" data-plan-detail="${escapeAttr(e.planId)}" data-plan-kind="dept" onclick="BMSUI.openPlanDetail(this.getAttribute('data-plan-detail'),'dept')">${escapeHtml(
                e.title
              )}</button>`;
            } else if (href) {
              titleHtml = `<a class="font-medium text-teal-800 hover:underline truncate block" href="${href}" title="${escapeAttr(e.title)}">${escapeHtml(e.title)}</a>`;
            } else {
              titleHtml = `<div class="font-medium text-slate-800 truncate" title="${escapeAttr(e.title)}">${escapeHtml(e.title)}</div>`;
            }
            const missOwner = !e.ownerId
              ? `<div class="text-[10px] text-rose-500">缺主责</div>`
              : "";
            return `<tr>
              <td>${exTag(e.type)}</td>
              <td class="max-w-[14rem]">${titleHtml}
                <div class="text-[11px] text-slate-400">${escapeHtml(e.priority || "")}</div>${missOwner}</td>
              <td class="whitespace-nowrap">${escapeHtml(e.dept)}${ou ? " · " + escapeHtml(ou.name) : ""}</td>
              <td class="text-center ${e.lagDays ? "text-rose-600" : "text-slate-500"}">${
                e.type === "任务临期" ? "剩" + e.lagDays + "天" : e.lagDays || "—"
              }</td>
              <td>${
                canUrge
                  ? `<button type="button" class="text-teal-700 text-sm hover:underline" data-urge="${urgePayloadJson({
                      targetUserId: e.ownerId,
                      title: "催办：" + e.title,
                      taskId: e.taskId || "",
                      planId: e.planId || "",
                      dept: e.dept,
                      companyPlanId: e.companyPlanId || "",
                      exceptionType: e.type,
                    })}">催办</button>`
                  : "—"
              }</td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="5" class="text-center text-slate-400 py-8">${
          kpiFilter || typeSel ? "当前筛选下无例外" : "今日无例外，全部按期"
        }</td></tr>`;

    document.querySelectorAll("#exBody [data-urge]").forEach((btn) => {
      btn.onclick = () => {
        try {
          openUrge(JSON.parse(btn.getAttribute("data-urge")));
        } catch (err) {
          BMSUI.toast("催办参数错误", false);
        }
      };
    });

    const buckets = [
      ["overdue", "已超时", overdueUrge, true],
      ["pending", "待回复", pendingUrge - overdueUrge, false],
      ["recheck", "待复检", recheckUrge, false],
      ["closed", "已闭环", BMS4.urges.filter((u) => u.status === "已闭环").length, false],
    ];
    if (!buckets.find((b) => b[0] === urgeBucket)) urgeBucket = "overdue";
    document.getElementById("urgeBuckets").innerHTML = buckets
      .map(
        ([key, label, n, hot]) =>
          `<button type="button" class="bucket-tab ${urgeBucket === key ? "active" : ""}" data-bucket="${key}">${label} ${n}${
            hot && n ? "" : ""
          }</button>`
      )
      .join("");
    document.querySelectorAll("[data-bucket]").forEach((btn) => {
      btn.onclick = () => {
        urgeBucket = btn.getAttribute("data-bucket");
        render();
      };
    });

    let urgeList = BMS4.urges.slice();
    if (kpiFilter === "plan_urge") urgeList = urgeList.filter((u) => urgeScope(u) === "plan");
    if (kpiFilter === "task_urge") urgeList = urgeList.filter((u) => urgeScope(u) === "task");
    if (urgeBucket === "overdue") {
      urgeList = urgeList.filter((u) => u.status === "待回复" && u.expectReplyDate < BMS4.DEMO_TODAY);
    } else if (urgeBucket === "pending") {
      urgeList = urgeList.filter((u) => u.status === "待回复" && !(u.expectReplyDate < BMS4.DEMO_TODAY));
    } else if (urgeBucket === "recheck") {
      urgeList = urgeList.filter((u) => u.status === "已回复");
    } else {
      urgeList = urgeList.filter((u) => u.status === "已闭环");
    }

    document.getElementById("urgeBody").innerHTML = urgeList.length
      ? urgeList
          .map((u) => {
            const ou = BMS4.userById(u.targetUserId);
            const overdue = u.status === "待回复" && u.expectReplyDate < BMS4.DEMO_TODAY;
            let act = "—";
            if (u.status === "已回复") {
              act = `<button type="button" class="text-teal-700 text-sm hover:underline" data-recheck="${u.id}">复检</button>`;
            } else if (u.status === "待回复") {
              act = overdue
                ? `<button type="button" class="text-rose-600 text-sm hover:underline" data-renew="${u.id}">再次催办</button>`
                : `<span class="text-xs text-slate-400">等待回复</span>`;
            }
            const link =
              u.taskId
                ? `整体计划_任务监督_page.html?task=${encodeURIComponent(u.taskId)}&all=1`
                : u.companyPlanId
                  ? "经营总台账_page.html"
                  : "";
            const titleCell = link
              ? `<a class="truncate block text-teal-800 hover:underline" href="${link}" title="${escapeAttr(u.title)}">${escapeHtml(u.title)}</a>`
              : `<div class="truncate" title="${escapeAttr(u.title)}">${escapeHtml(u.title)}</div>`;
            return `<tr class="${overdue ? "bg-rose-50/40" : ""}">
              <td class="max-w-[12rem]">${titleCell}
                <div class="text-[11px] text-slate-400 truncate">${escapeHtml(u.note || "")}</div></td>
              <td class="whitespace-nowrap">${ou ? escapeHtml(ou.name + " · " + ou.dept) : "—"}</td>
              <td class="${overdue ? "text-rose-600 font-medium" : ""}">${u.expectReplyDate}${overdue ? " · 超时" : ""}</td>
              <td>${BMSUI.statusBadge(u.status)}</td>
              <td>${act}</td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="5" class="text-center text-slate-400 py-8">本桶暂无催办</td></tr>`;

    document.querySelectorAll("[data-recheck]").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-recheck");
        const u = BMS4.getUrge(id);
        if (!u) return;
        document.getElementById("rUrgeId").value = id;
        document.getElementById("rRejectNote").value = "";
        document.getElementById("rDetail").innerHTML = `
          <div><span class="text-slate-400">事项：</span>${escapeHtml(u.title)}</div>
          <div><span class="text-slate-400">原因：</span>${escapeHtml(u.replyReason)}</div>
          <div><span class="text-slate-400">措施：</span>${escapeHtml(u.replyRemedy)}</div>
          <div><span class="text-slate-400">承诺日：</span>${escapeHtml(u.replyPromiseDate)}</div>`;
        BMSUI.openModal("modalRecheck");
      };
    });
    document.querySelectorAll("[data-renew]").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-renew");
        const u = BMS4.getUrge(id);
        if (!u) return;
        openUrge({
          renewId: id,
          targetUserId: u.targetUserId,
          title: u.title,
          taskId: u.taskId,
          planId: u.planId,
          dept: u.dept,
          companyPlanId: u.companyPlanId,
          exceptionType: u.exceptionType || "催办未回复",
          note: "再次催办：请于新期望日前回复",
        });
      };
    });

    // 矩阵
    const matrix = BMS4.companyPlanDeptMatrix();
    let conflictN = 0;
    matrix.forEach((row) => {
      const hand = BMS4.clampPct(row.companyPlan.progressPct);
      if (row.lateTotal > 0 && hand >= 45) conflictN++;
    });
    document.getElementById("matrixConflictTip").textContent = conflictN
      ? `⚠ ${conflictN} 个目标进度与延期冲突`
      : "";
    document.getElementById("foldMatrixBody").classList.toggle("hidden", !matrixOpen);
    document.getElementById("foldMatrixIcon").className =
      "fa-solid text-slate-400 text-xs " + (matrixOpen ? "fa-chevron-up" : "fa-chevron-down");

    let html = `<thead><tr><th>公司计划</th><th>任务完成率<br/><span class="text-[10px] font-normal text-slate-400">非手填进度</span></th><th>手填进度</th>`;
    BMS4.DEPTS.forEach((d) => {
      html += `<th>${d}</th>`;
    });
    html += `<th>延期合计</th></tr></thead><tbody>`;
    matrix.forEach((row) => {
      const hand = BMS4.clampPct(row.companyPlan.progressPct);
      const conflict = row.lateTotal > 0 && hand >= 45;
      html += `<tr class="${conflict ? "cell-warn" : ""}">
        <td class="font-medium max-w-[14rem]">
          ${BMSUI.planNameLink(row.companyPlan.name, { id: row.companyPlan.id, kind: "company", className: "hover:underline text-teal-800" })}
          <div class="text-[11px] text-slate-400">${escapeHtml(row.companyPlan.priority || "")} · ${escapeHtml(row.companyPlan.status)}</div>
          ${conflict ? `<div class="text-[10px] text-amber-700 mt-0.5">手填 ${hand}% 偏高，下属仍有延期</div>` : ""}
        </td>
        <td>${rateBar(row.avgRate)}</td>
        <td class="tabular-nums font-medium ${conflict ? "text-amber-700" : ""}">${hand}%</td>`;
      row.cells.forEach((c) => {
        if (!c.planNodes && !c.taskTotal) {
          html += `<td class="text-slate-300 text-center">—</td>`;
          return;
        }
        const hot = c.late > 0;
        html += `<td class="${hot ? "cell-hot" : ""}">
          <div>${c.taskRate}% · 延期${c.late}</div>
          <div class="text-[11px] ${c.weekFilled ? "text-slate-500" : "text-amber-600"}">节点${c.planNodes} · 任务周报${c.weekFilled ? "已填" : "未填"}</div>
          ${
            c.ownerId && c.late
              ? `<button type="button" class="text-teal-700 text-xs hover:underline mt-1" data-urge="${urgePayloadJson({
                  targetUserId: c.ownerId,
                  title: "催办：" + row.companyPlan.name + " · " + c.dept,
                  dept: c.dept,
                  companyPlanId: row.companyPlan.id,
                  exceptionType: "任务延期",
                })}">催办部门长</button>`
              : ""
          }
        </td>`;
      });
      html += `<td class="text-center ${row.lateTotal ? "text-rose-600 font-medium" : ""}">${row.lateTotal}</td></tr>`;
    });
    html += `</tbody>`;
    document.getElementById("matrixTable").innerHTML = html;
    document.querySelectorAll("#matrixTable [data-urge]").forEach((btn) => {
      btn.onclick = () => {
        try {
          openUrge(JSON.parse(btn.getAttribute("data-urge")));
        } catch (e) {
          BMSUI.toast("催办参数错误", false);
        }
      };
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (BMS4.getRoleUser().role !== "总经理") {
      document.getElementById("page-main").innerHTML =
        '<div class="bg-white rounded-2xl border p-8 text-slate-500">本页仅总经理可见。部门长/员工请在「我的待办」回复催办。</div>';
      return;
    }

    document.getElementById("foldMatrixHead").onclick = () => {
      matrixOpen = !matrixOpen;
      render();
    };
    document.getElementById("foldExHead").onclick = (ev) => {
      if (ev.target.closest("select,input,button,a,label")) return;
      exOpen = !exOpen;
      render();
    };
    document.getElementById("fExType").onchange = render;
    document.getElementById("exShowAll").onchange = render;
    document.getElementById("btnClearFilter").onclick = () => {
      kpiFilter = "";
      document.getElementById("fExType").value = "";
      render();
    };

    document.getElementById("btnUrgeSave").onclick = () => {
      const renewId = document.getElementById("uRenewId").value;
      const expect = document.getElementById("uExpect").value;
      const note = document.getElementById("uNote").value.trim();
      if (renewId) {
        const r = BMS4.renewUrge(renewId, expect, note || "再次催办");
        if (!r.ok) return BMSUI.toast(r.reason, false);
        BMSUI.closeModal("modalUrge");
        BMSUI.toast("已更新期望回复日");
        urgeBucket = "pending";
        render();
        return;
      }
      const r = BMS4.createUrge({
        targetUserId: document.getElementById("uTarget").value,
        title: document.getElementById("uTitle").value.trim(),
        note,
        expectReplyDate: expect,
        taskId: document.getElementById("uTaskId").value,
        planId: document.getElementById("uPlanId").value,
        dept: document.getElementById("uDept").value,
        companyPlanId: document.getElementById("uCp").value,
        exceptionType: document.getElementById("uExType").value,
        force: document.getElementById("uForce").value === "1",
      });
      if (!r.ok) return BMSUI.toast(r.reason, false);
      BMSUI.closeModal("modalUrge");
      BMSUI.toast("已催办，责任人待办已生成");
      urgeBucket = "pending";
      render();
    };
    document.getElementById("btnCloseUrge").onclick = () => {
      BMS4.closeUrge(document.getElementById("rUrgeId").value);
      BMSUI.closeModal("modalRecheck");
      BMSUI.toast("已闭环");
      urgeBucket = "closed";
      render();
    };
    document.getElementById("btnRejectUrge").onclick = () => {
      const r = BMS4.rejectUrge(
        document.getElementById("rUrgeId").value,
        document.getElementById("rRejectNote").value.trim() || "复检未通过，请补充措施"
      );
      if (!r.ok) return BMSUI.toast(r.reason, false);
      BMSUI.closeModal("modalRecheck");
      BMSUI.toast("已退回，责任人需重新回复");
      urgeBucket = "pending";
      render();
    };
    render();
  });
})();
  </script>
</body>
</html>
