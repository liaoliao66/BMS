<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>部门台账 · v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .btn-cta { background:#0f766e; } .btn-cta:hover { background:#0d9488; }
    .grid-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .grid-table th, .grid-table td { border: 1px solid #e8eaed; padding: 8px 10px; vertical-align: middle; }
    .grid-table thead th { background: #f5f6f8; color: #5f6368; font-weight: 500; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
    .grid-table tbody tr:hover { background: #fafbfc; }
    .row-hot td { background: #fff8f7; }
    .tag { display: inline-flex; padding: 1px 8px; border-radius: 4px; font-size: 12px; border: 1px solid #e8eaed; background: #f1f3f4; color: #5f6368; }
    .caret-btn { color: #0f766e; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent; padding: 0; cursor: pointer; }
    .kpi { background:#fff; border:1px solid #e8eaed; border-radius:1rem; padding:1rem; cursor:pointer; transition: border-color .15s, box-shadow .15s; }
    .kpi:hover { border-color:#99f6e4; }
    .kpi.active { border-color:#0f766e; box-shadow:0 0 0 2px rgba(15,118,110,.15); }
    .col-name { min-width: 18rem; max-width: 26rem; }
    .fold-head { cursor:pointer; user-select:none; }
    .fold-head:hover { background:#f8fafc; }
    .chip { display:inline-flex; padding:1px 8px; border-radius:999px; font-size:11px; background:#eef2f7; color:#64748b; border:1px solid #e2e8f0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" data-page="dept" data-title="部门台账">
  <div id="app-root"></div>
  <div id="page-main" class="hidden">

    <div class="flex flex-wrap justify-between gap-3 mb-4 items-start">
      <p class="text-xs text-slate-500 max-w-3xl" id="desc">部门日清台：先看本部门例外 → 处理计划/任务 → 补齐任务周报。编辑仍在计划管理 / 任务管理。</p>
      <div class="flex flex-wrap gap-2 text-sm">
        <a href="计划管理_page.html" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-teal-700">计划管理</a>
        <a href="任务管理_page.html" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-teal-700">任务管理</a>
        <a href="任务周报_page.html" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-teal-700">任务周报</a>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4" id="kpi"></div>

    <!-- A：例外区 -->
    <div class="bg-white border border-[#e8eaed] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(60,64,67,0.06)] mb-4">
      <div class="px-4 py-3 border-b flex flex-wrap justify-between items-center gap-2">
        <div>
          <span class="text-sm font-medium">本部门例外</span>
          <span class="text-xs text-slate-400 ml-2" id="exCount"></span>
        </div>
        <div class="flex flex-wrap gap-2 items-center text-xs">
          <select id="fCp" class="border border-slate-200 rounded-lg px-2 py-1 bg-white"></select>
          <button type="button" id="btnClearFilter" class="text-teal-700 hover:underline hidden">清除筛选</button>
        </div>
      </div>
      <div class="overflow-auto max-h-[18rem]">
        <table class="grid-table w-full">
          <thead><tr>
            <th>类型</th><th>事项</th><th>责任人</th><th>期限</th><th>操作</th>
          </tr></thead>
          <tbody id="exBody"></tbody>
        </table>
      </div>
    </div>

    <!-- D：计划树（默认可折叠，默认一级） -->
    <div class="bg-white border border-[#e8eaed] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(60,64,67,0.06)] mb-4">
      <div class="fold-head px-4 py-3 border-b flex flex-wrap justify-between items-center gap-2" id="foldPlanHead">
        <div class="flex items-center gap-2">
          <span class="text-sm font-medium">本部门计划树</span>
          <span class="text-xs text-slate-400" id="planCount"></span>
          <a href="计划管理_page.html" class="text-xs text-teal-700 hover:underline" onclick="event.stopPropagation()">前往计划管理</a>
        </div>
        <div class="flex items-center gap-2" onclick="event.stopPropagation()">
          <button type="button" id="btnPlanL1" class="text-xs px-2 py-1 rounded-lg border border-slate-200 bg-white">收起至一级</button>
          <button type="button" id="btnPlanExpand" class="text-xs px-2 py-1 rounded-lg border border-slate-200 bg-white">全部展开</button>
          <i class="fa-solid fa-chevron-up text-slate-400 text-xs" id="foldPlanIcon"></i>
        </div>
      </div>
      <div id="foldPlanBody" class="overflow-auto">
        <table class="grid-table min-w-[1100px]">
          <thead><tr>
            <th>序号</th>
            <th class="col-name">计划名称</th>
            <th>公司目标</th>
            <th>优先级</th>
            <th>负责人</th>
            <th>开始</th>
            <th>结束</th>
            <th>进度</th>
            <th>状态</th>
            <th>操作</th>
          </tr></thead>
          <tbody id="planBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 任务列表 -->
    <div class="bg-white border border-[#e8eaed] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(60,64,67,0.06)] mb-4">
      <div class="fold-head px-4 py-3 border-b flex flex-wrap justify-between items-center gap-2" id="foldTaskHead">
        <div class="flex items-center gap-2">
          <span class="text-sm font-medium">本部门任务</span>
          <span class="text-xs text-slate-400" id="taskCount"></span>
        </div>
        <div class="flex items-center gap-2" onclick="event.stopPropagation()">
          <label class="inline-flex items-center gap-1 text-xs text-slate-600 cursor-pointer">
            <input type="checkbox" id="onlyProblemTask" class="rounded" /> 仅问题
          </label>
          <i class="fa-solid fa-chevron-up text-slate-400 text-xs" id="foldTaskIcon"></i>
        </div>
      </div>
      <div id="foldTaskBody" class="overflow-auto">
        <table class="grid-table min-w-[960px]">
          <thead><tr>
            <th>任务</th><th>责任人</th><th>截止日</th><th>状态</th><th>耗时</th><th>来源</th><th>操作</th>
          </tr></thead>
          <tbody id="taskBody"></tbody>
        </table>
      </div>
    </div>

    <!-- P2：人员负荷 -->
    <div class="bg-white border border-[#e8eaed] rounded-xl overflow-hidden shadow-[0_1px_2px_rgba(60,64,67,0.06)] mb-5">
      <div class="fold-head px-4 py-3 border-b flex justify-between items-center" id="foldLoadHead">
        <div>
          <span class="text-sm font-medium">人员负荷一瞥</span>
          <span class="text-[11px] text-slate-400 ml-2">未完成任务数（进行中/延期/未开始）</span>
        </div>
        <i class="fa-solid fa-chevron-down text-slate-400 text-xs" id="foldLoadIcon"></i>
      </div>
      <div id="foldLoadBody" class="hidden overflow-auto">
        <table class="grid-table w-full">
          <thead><tr>
            <th>人员</th><th class="text-right">未完成</th><th class="text-right">其中延期</th><th class="text-right">临期</th>
          </tr></thead>
          <tbody id="loadBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 催办弹窗 -->
    <div id="modalUrge" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalUrge')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-md p-6 space-y-3 text-sm shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <h3 class="text-lg font-semibold">催办责任人</h3>
        <input type="hidden" id="uTarget" />
        <input type="hidden" id="uTaskId" />
        <input type="hidden" id="uPlanId" />
        <div>
          <label class="block text-slate-600 mb-1">催办标题</label>
          <input id="uTitle" class="w-full border rounded-xl px-3 py-2.5" />
        </div>
        <div>
          <label class="block text-slate-600 mb-1">期望回复日 <span class="text-red-500">*</span></label>
          <input type="date" id="uExpect" class="w-full border rounded-xl px-3 py-2.5" value="2026-08-21" />
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="BMSUI.closeModal('modalUrge')" class="text-slate-500 px-3">取消</button>
          <button type="button" id="btnUrgeSave" class="btn-cta text-white px-4 py-2 rounded-xl">确认催办</button>
        </div>
      </div>
    </div>

  </div>
  <script src="../assets/store.js"></script>
  <script src="../assets/common.js"></script>
  <script>
(function () {
  let user;
  let kpiFilter = ""; // latePlan | lateTask | near | report | mismatch | ""
  let cpFilter = "";
  let collapsed = new Set();
  let planOpen = true;
  let taskOpen = true;
  let loadOpen = false;

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function prioTag(p) {
    const map = { P0: "background:#fce8e6;color:#c5221f", P1: "background:#fef7e0;color:#e37400", P2: "background:#f1f3f4;color:#5f6368" };
    return `<span class="tag" style="${map[p] || map.P2}">${p || "P2"}</span>`;
  }
  function cpName(id) {
    const cp = BMS4.COMPANY_PLANS.find((c) => c.id === id);
    return cp ? cp.name : "—";
  }
  function planStatus(p) {
    return BMS4.resolvePlanStatus ? BMS4.resolvePlanStatus(p) : p.status;
  }
  function isProblemPlan(p) {
    const st = planStatus(p);
    if (st === "延期" || st === "关注") return true;
    if (BMS4.isPlanNearDue && BMS4.isPlanNearDue(p)) return true;
    return false;
  }
  function isProblemTask(t) {
    return BMS4.isTaskOverdue(t) || BMS4.isTaskNearDue(t);
  }
  function weekGapCount() {
    const week = "2026-W34";
    return BMS4.COMPANY_PLANS.filter(
      (cp) =>
        !BMS4.periodReports.some(
          (r) =>
            r.userId === user.id &&
            r.periodType === "week" &&
            r.periodKey === week &&
            r.companyPlanId === cp.id &&
            (r.planText || "").trim() &&
            (r.doneText || "").trim()
        )
    ).length;
  }
  function collapseToLevel1(plans) {
    collapsed.clear();
    plans.forEach((p) => {
      const kids = plans.filter((c) => c.parentId === p.id);
      if (kids.length) collapsed.add(p.id);
    });
  }

  function openUrge(opt) {
    document.getElementById("uTarget").value = opt.targetUserId || "";
    document.getElementById("uTaskId").value = opt.taskId || "";
    document.getElementById("uPlanId").value = opt.planId || "";
    document.getElementById("uTitle").value = opt.title || "请尽快处理";
    document.getElementById("uExpect").value = "2026-08-21";
    BMSUI.openModal("modalUrge");
  }

  function buildExceptions(plans, tasks) {
    const list = [];
    plans.forEach((p) => {
      const st = planStatus(p);
      if (st === "延期" || st === "关注" || (BMS4.isPlanNearDue && BMS4.isPlanNearDue(p))) {
        list.push({
          kind: st === "延期" ? "计划延期" : st === "关注" ? "计划关注" : "计划临期",
          hot: st === "延期",
          title: p.name,
          ownerId: p.ownerId,
          due: p.endDate || "",
          planId: p.id,
          taskId: "",
          companyPlanId: p.companyPlanId || "",
          filterKey: st === "延期" ? "latePlan" : "near",
        });
      }
      const under = tasks.filter((t) => t.annualId === p.id);
      const lateN = under.filter((t) => BMS4.isTaskOverdue(t)).length;
      const pct = BMS4.clampPct ? BMS4.clampPct(p.progressPct) : Number(p.progressPct) || 0;
      if (lateN > 0 && pct >= 45 && st !== "延期") {
        list.push({
          kind: "计划任务不一致",
          hot: false,
          title: p.name + "（进度 " + pct + "%，下属延期 " + lateN + "）",
          ownerId: p.ownerId,
          due: p.endDate || "",
          planId: p.id,
          taskId: "",
          companyPlanId: p.companyPlanId || "",
          filterKey: "mismatch",
        });
      }
    });
    tasks.forEach((t) => {
      if (BMS4.isTaskOverdue(t)) {
        list.push({
          kind: "任务延期",
          hot: true,
          title: t.name,
          ownerId: t.ownerId,
          due: t.deadline || "",
          planId: t.annualId || "",
          taskId: t.id,
          companyPlanId: "",
          filterKey: "lateTask",
        });
      } else if (BMS4.isTaskNearDue(t)) {
        list.push({
          kind: "任务临期",
          hot: false,
          title: t.name,
          ownerId: t.ownerId,
          due: t.deadline || "",
          planId: t.annualId || "",
          taskId: t.id,
          companyPlanId: "",
          filterKey: "near",
        });
      }
      if (!t.ownerId) {
        list.push({
          kind: "缺主责",
          hot: true,
          title: t.name,
          ownerId: "",
          due: t.deadline || "",
          planId: t.annualId || "",
          taskId: t.id,
          companyPlanId: "",
          filterKey: "lateTask",
        });
      }
    });
    const gap = weekGapCount();
    if (gap > 0) {
      list.push({
        kind: "任务周报缺口",
        hot: false,
        title: "本周任务周报未填齐（缺口 " + gap + "/" + BMS4.COMPANY_PLANS.length + "）",
        ownerId: user.id,
        due: "2026-08-17",
        planId: "",
        taskId: "",
        companyPlanId: "",
        filterKey: "report",
        href: "任务周报_page.html",
      });
    }
    return list;
  }

  function buildPlanRows(plans) {
    const idSet = new Set(plans.map((p) => p.id));
    const roots = plans.filter((p) => !p.parentId || !idSet.has(p.parentId));
    const rows = [];
    function walk(p, depth, path) {
      const kids = plans.filter((c) => c.parentId === p.id);
      const hasKids = kids.length > 0;
      const isCol = collapsed.has(p.id);
      rows.push({ p, depth, path, hasKids, isCol });
      if (hasKids && !isCol) kids.forEach((c, i) => walk(c, depth + 1, path + "." + (i + 1)));
    }
    roots.forEach((r, i) => walk(r, 0, String(i + 1)));
    return rows;
  }

  function render() {
    let plans = BMS4.plansForDept(user.dept);
    let tasks = BMS4.tasksForDept(user.dept);
    if (cpFilter) {
      plans = plans.filter((p) => p.companyPlanId === cpFilter);
      const planIds = new Set(plans.map((p) => p.id));
      tasks = tasks.filter((t) => planIds.has(t.annualId));
    }

    const latePlans = plans.filter((p) => planStatus(p) === "延期").length;
    const lateTasks = tasks.filter((t) => BMS4.isTaskOverdue(t)).length;
    const nearTasks = tasks.filter((t) => BMS4.isTaskNearDue(t)).length;
    const reportGap = weekGapCount();
    const openTasks = tasks.filter((t) => t.status !== "已完成" && t.status !== "已关闭");

    const kpis = [
      ["计划延期", latePlans, "text-rose-600", "latePlan"],
      ["任务延期", lateTasks, "text-rose-600", "lateTask"],
      ["任务临期", nearTasks, "text-amber-600", "near"],
      ["周报缺口", reportGap, reportGap ? "text-amber-600" : "", "report"],
      ["未完成任务", openTasks.length, "", ""],
    ];
    document.getElementById("kpi").innerHTML = kpis
      .map(
        ([k, v, cls, key]) =>
          `<div class="kpi ${kpiFilter === key && key ? "active" : ""}" data-kpi="${key}" ${key ? 'title="点击筛选例外"' : ""}>
            <div class="text-xs text-slate-500">${k}</div>
            <div class="text-2xl font-semibold mt-1 ${cls}">${v}</div>
          </div>`
      )
      .join("");
    document.querySelectorAll("[data-kpi]").forEach((el) => {
      el.onclick = () => {
        const key = el.getAttribute("data-kpi");
        if (!key) return;
        kpiFilter = kpiFilter === key ? "" : key;
        render();
      };
    });
    document.getElementById("btnClearFilter").classList.toggle("hidden", !kpiFilter && !cpFilter);

    let ex = buildExceptions(plans, tasks);
    if (kpiFilter) ex = ex.filter((e) => e.filterKey === kpiFilter || (kpiFilter === "near" && (e.filterKey === "near" || e.kind === "计划临期")));
    document.getElementById("exCount").textContent = "共 " + ex.length + " 条";
    document.getElementById("exBody").innerHTML = ex.length
      ? ex
          .map((e) => {
            const ou = e.ownerId ? BMS4.userById(e.ownerId) : null;
            const href =
              e.href ||
              (e.taskId
                ? "任务管理_page.html?task=" + encodeURIComponent(e.taskId)
                : e.planId
                  ? "计划管理_page.html?plan=" + encodeURIComponent(e.planId)
                  : "#");
            const canUrge = e.ownerId && e.ownerId !== user.id;
            return `<tr class="${e.hot ? "row-hot" : ""}">
              <td><span class="chip">${escapeHtml(e.kind)}</span></td>
              <td class="max-w-[16rem]"><a class="text-teal-800 hover:underline font-medium" href="${href}">${escapeHtml(e.title)}</a></td>
              <td class="whitespace-nowrap">${ou ? escapeHtml(ou.name) : e.ownerId === user.id ? "我" : '<span class="text-rose-500">缺主责</span>'}</td>
              <td class="whitespace-nowrap ${e.hot ? "text-rose-600" : "text-slate-600"}">${escapeHtml(e.due || "—")}</td>
              <td class="whitespace-nowrap space-x-2">
                <a class="text-teal-700 text-sm hover:underline" href="${href}">处理</a>
                ${
                  canUrge
                    ? `<button type="button" class="text-teal-700 text-sm hover:underline" data-urge-owner="${e.ownerId}" data-urge-title="${escapeHtml(
                        "催办：" + e.title
                      )}" data-urge-task="${e.taskId || ""}" data-urge-plan="${e.planId || ""}">催办</button>`
                    : ""
                }
              </td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="5" class="text-center text-slate-400 py-8">${
          kpiFilter || cpFilter ? "当前筛选下无例外" : "今日无例外，部门运行平稳"
        }</td></tr>`;

    document.querySelectorAll("[data-urge-owner]").forEach((btn) => {
      btn.onclick = () =>
        openUrge({
          targetUserId: btn.getAttribute("data-urge-owner"),
          title: btn.getAttribute("data-urge-title"),
          taskId: btn.getAttribute("data-urge-task"),
          planId: btn.getAttribute("data-urge-plan"),
        });
    });

    // 计划树
    document.getElementById("foldPlanBody").classList.toggle("hidden", !planOpen);
    document.getElementById("foldPlanIcon").className =
      "fa-solid text-slate-400 text-xs " + (planOpen ? "fa-chevron-up" : "fa-chevron-down");
    const planRows = buildPlanRows(plans);
    document.getElementById("planCount").textContent = plans.length + " 个节点 · 展示 " + planRows.length;
    document.getElementById("planBody").innerHTML = planRows.length
      ? planRows
          .map((row) => {
            const p = row.p;
            const st = planStatus(p);
            const hot = isProblemPlan(p);
            const owner = BMS4.userById(p.ownerId);
            const pct = BMS4.clampPct ? BMS4.clampPct(p.progressPct) : Number(p.progressPct) || 0;
            const pad = row.depth * 16;
            const caret = row.hasKids
              ? `<button type="button" class="caret-btn" data-toggle="${p.id}"><i class="fa-solid fa-caret-${row.isCol ? "right" : "down"}"></i></button>`
              : `<span style="display:inline-block;width:16px"></span>`;
            return `<tr class="${hot ? "row-hot" : ""}">
              <td class="text-slate-400 text-xs">${row.path}</td>
              <td class="col-name">
                <div style="padding-left:${pad}px" class="flex items-center gap-1">
                  ${caret}
                  <span class="font-medium leading-snug ${hot ? "text-rose-700" : ""}">${escapeHtml(p.name)}</span>
                </div>
              </td>
              <td class="max-w-[10rem] text-xs text-slate-600 truncate" title="${escapeHtml(cpName(p.companyPlanId))}">${escapeHtml(cpName(p.companyPlanId))}</td>
              <td>${prioTag(p.priority)}</td>
              <td class="whitespace-nowrap">${owner ? escapeHtml(owner.name) : "—"}</td>
              <td class="text-xs whitespace-nowrap">${escapeHtml(p.startDate || "—")}</td>
              <td class="text-xs whitespace-nowrap">${escapeHtml(p.endDate || "—")}</td>
              <td class="font-medium tabular-nums">${pct}%</td>
              <td>${BMSUI.statusBadge(st)}</td>
              <td class="whitespace-nowrap space-x-2">
                <a class="text-teal-700 text-sm hover:underline" href="计划管理_page.html?plan=${encodeURIComponent(p.id)}">编辑</a>
                ${
                  p.ownerId && p.ownerId !== user.id && hot
                    ? `<button type="button" class="text-teal-700 text-sm hover:underline" data-urge-owner="${p.ownerId}" data-urge-title="催办：${escapeHtml(
                        p.name
                      )}" data-urge-plan="${p.id}">催办</button>`
                    : ""
                }
              </td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="10" class="text-center text-slate-400 py-8">暂无计划 · <a class="text-teal-700 hover:underline" href="计划管理_page.html">去计划管理拆解</a></td></tr>`;

    document.querySelectorAll("#planBody [data-toggle]").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-toggle");
        if (collapsed.has(id)) collapsed.delete(id);
        else collapsed.add(id);
        render();
      };
    });
    document.querySelectorAll("#planBody [data-urge-owner]").forEach((btn) => {
      btn.onclick = () =>
        openUrge({
          targetUserId: btn.getAttribute("data-urge-owner"),
          title: btn.getAttribute("data-urge-title"),
          planId: btn.getAttribute("data-urge-plan"),
        });
    });

    // 任务
    document.getElementById("foldTaskBody").classList.toggle("hidden", !taskOpen);
    document.getElementById("foldTaskIcon").className =
      "fa-solid text-slate-400 text-xs " + (taskOpen ? "fa-chevron-up" : "fa-chevron-down");
    const onlyProb = document.getElementById("onlyProblemTask").checked;
    let showTasks = tasks.slice();
    if (onlyProb) showTasks = showTasks.filter(isProblemTask);
    if (kpiFilter === "lateTask") showTasks = tasks.filter((t) => BMS4.isTaskOverdue(t));
    if (kpiFilter === "near") showTasks = tasks.filter((t) => BMS4.isTaskNearDue(t) || BMS4.isTaskOverdue(t));
    document.getElementById("taskCount").textContent = "展示 " + showTasks.length + " / " + tasks.length;
    document.getElementById("taskBody").innerHTML = showTasks.length
      ? showTasks
          .map((t) => {
            const ou = BMS4.userById(t.ownerId);
            const hot = BMS4.isTaskOverdue(t);
            const near = BMS4.isTaskNearDue(t);
            return `<tr class="${hot ? "row-hot" : ""}">
              <td class="max-w-[16rem]"><a class="hover:underline text-teal-800" href="任务管理_page.html?task=${encodeURIComponent(t.id)}">${escapeHtml(
                t.name
              )}</a></td>
              <td class="whitespace-nowrap">${ou ? escapeHtml(ou.name) : '<span class="text-rose-500">缺主责</span>'}</td>
              <td class="whitespace-nowrap ${hot ? "text-rose-600 font-medium" : near ? "text-amber-600" : ""}">${escapeHtml(
                t.deadline || "—"
              )}</td>
              <td>${BMSUI.statusBadge(t.status)}</td>
              <td class="tabular-nums">${t.actualHours || 0}/${t.planHours || 0}</td>
              <td>${escapeHtml(t.source || "—")}</td>
              <td class="whitespace-nowrap space-x-2">
                <a class="text-teal-700 text-sm hover:underline" href="任务管理_page.html?task=${encodeURIComponent(t.id)}">处理</a>
                ${
                  t.ownerId && t.ownerId !== user.id && (hot || near)
                    ? `<button type="button" class="text-teal-700 text-sm hover:underline" data-urge-owner="${t.ownerId}" data-urge-title="催办：${escapeHtml(
                        t.name
                      )}" data-urge-task="${t.id}">催办</button>`
                    : ""
                }
              </td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="7" class="text-center text-slate-400 py-8">无匹配任务</td></tr>`;

    document.querySelectorAll("#taskBody [data-urge-owner]").forEach((btn) => {
      btn.onclick = () =>
        openUrge({
          targetUserId: btn.getAttribute("data-urge-owner"),
          title: btn.getAttribute("data-urge-title"),
          taskId: btn.getAttribute("data-urge-task"),
        });
    });

    // 负荷
    document.getElementById("foldLoadBody").classList.toggle("hidden", !loadOpen);
    document.getElementById("foldLoadIcon").className =
      "fa-solid text-slate-400 text-xs " + (loadOpen ? "fa-chevron-up" : "fa-chevron-down");
    const members = BMS4.USERS.filter((u) => u.dept === user.dept);
    const loadRows = members
      .map((m) => {
        const mine = tasks.filter((t) => t.ownerId === m.id && t.status !== "已完成" && t.status !== "已关闭");
        const late = mine.filter((t) => BMS4.isTaskOverdue(t)).length;
        const near = mine.filter((t) => BMS4.isTaskNearDue(t)).length;
        return { m, open: mine.length, late, near };
      })
      .sort((a, b) => b.open - a.open || b.late - a.late);
    document.getElementById("loadBody").innerHTML = loadRows
      .map(
        (r) => `<tr class="${r.late ? "row-hot" : ""}">
          <td>${escapeHtml(r.m.name)}${r.m.id === user.id ? ' <span class="text-slate-400 text-xs">我</span>' : ""}</td>
          <td class="text-right tabular-nums font-medium">${r.open}</td>
          <td class="text-right tabular-nums ${r.late ? "text-rose-600 font-medium" : ""}">${r.late}</td>
          <td class="text-right tabular-nums ${r.near ? "text-amber-600 font-medium" : ""}">${r.near}</td>
        </tr>`
      )
      .join("");
  }

  document.addEventListener("DOMContentLoaded", () => {
    user = BMS4.getRoleUser();
    if (user.role !== "部门长") {
      document.getElementById("page-main").innerHTML =
        '<div class="bg-white rounded-2xl border p-8 text-slate-500">本页仅部门长可见。总经理请用「落实驾驶舱 / 部门计划表」；员工请用「任务管理」。</div>';
      return;
    }
    document.getElementById("desc").textContent =
      user.dept + " · 部门日清台：例外优先，计划/任务下钻处理，任务周报缺口提醒。";

    const fCp = document.getElementById("fCp");
    fCp.innerHTML =
      '<option value="">全部公司目标</option>' +
      BMS4.COMPANY_PLANS.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
    fCp.onchange = () => {
      cpFilter = fCp.value;
      render();
    };

    document.getElementById("btnClearFilter").onclick = () => {
      kpiFilter = "";
      cpFilter = "";
      fCp.value = "";
      render();
    };
    document.getElementById("foldPlanHead").onclick = (e) => {
      if (e.target.closest("button,a")) return;
      planOpen = !planOpen;
      render();
    };
    document.getElementById("foldTaskHead").onclick = (e) => {
      if (e.target.closest("label,input,button,a")) return;
      taskOpen = !taskOpen;
      render();
    };
    document.getElementById("foldLoadHead").onclick = () => {
      loadOpen = !loadOpen;
      render();
    };
    document.getElementById("btnPlanL1").onclick = (e) => {
      e.stopPropagation();
      collapseToLevel1(BMS4.plansForDept(user.dept));
      planOpen = true;
      render();
    };
    document.getElementById("btnPlanExpand").onclick = (e) => {
      e.stopPropagation();
      collapsed.clear();
      planOpen = true;
      render();
    };
    document.getElementById("onlyProblemTask").onchange = () => {
      taskOpen = true;
      render();
    };
    document.getElementById("btnUrgeSave").onclick = () => {
      const r = BMS4.createUrge({
        targetUserId: document.getElementById("uTarget").value,
        title: document.getElementById("uTitle").value.trim(),
        expectReplyDate: document.getElementById("uExpect").value,
        taskId: document.getElementById("uTaskId").value,
        planId: document.getElementById("uPlanId").value,
        dept: user.dept,
        exceptionType: "部门催办",
        force: true,
      });
      if (!r.ok) return BMSUI.toast(r.reason, false);
      BMSUI.closeModal("modalUrge");
      BMSUI.toast("已催办，责任人待办已生成");
    };

    collapseToLevel1(BMS4.plansForDept(user.dept));
    render();
  });
})();
  </script>
</body>
</html>
