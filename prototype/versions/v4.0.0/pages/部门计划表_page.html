<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>部门计划表 · v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .grid-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .grid-table th, .grid-table td { border: 1px solid #e8eaed; padding: 8px 10px; vertical-align: middle; }
    .grid-table thead th { background: #f5f6f8; color: #5f6368; font-weight: 500; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
    .grid-table tbody tr:hover { background: #fafbfc; }
    .tag { display: inline-flex; padding: 1px 8px; border-radius: 4px; font-size: 12px; border: 1px solid #e8eaed; background: #f1f3f4; color: #5f6368; }
    .caret-btn { color: #0f766e; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent; padding: 0; cursor: pointer; }
    .row-hot td { background: #fff8f7; }
    .col-name { min-width: 22rem; max-width: 30rem; position: sticky; left: 0; z-index: 2; background: #fff; box-shadow: 4px 0 8px -4px rgba(15,23,42,0.1); }
    thead .col-name { background: #f5f6f8; z-index: 3; }
    .row-hot .col-name { background: #fff8f7; }
    tr[data-cp-row] .col-name { background: #f8fafc; }
    .sum-panel { background:#fff; border:1px solid #e8eaed; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(60,64,67,0.06); }
    .sum-cols { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); }
    .sum-cell { position:relative; padding:18px 12px; text-align:center; border-right:1px solid #f1f5f9; min-height:92px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:6px; }
    .sum-cell:last-child { border-right:none; }
    .sum-cell .lab { font-size:12px; color:#64748b; letter-spacing:0.01em; white-space:nowrap; }
    .sum-cell .num { font-size:26px; font-weight:600; letter-spacing:-0.03em; line-height:1; color:#0f172a; font-variant-numeric:tabular-nums; }
    .sum-cell .num.is-zero { color:#cbd5e1; font-weight:500; }
    .sum-cell.is-total { background:#f8fafc; }
    .sum-cell.is-total .lab { color:#0284c7; font-weight:500; }
    .sum-cell.is-total .num { color:#0f172a; }
    .sum-cell.tone-idle { background:linear-gradient(180deg, #fff 0%, #fafbfc 100%); }
    .sum-cell.tone-doing { background:linear-gradient(180deg, #fff 0%, #f5f9ff 100%); }
    .sum-cell.tone-doing .num:not(.is-zero) { color:#1a73e8; }
    .sum-cell.tone-watch { background:linear-gradient(180deg, #fff 0%, #fffbf0 100%); }
    .sum-cell.tone-watch .num:not(.is-zero) { color:#e37400; }
    .sum-cell.tone-late { background:linear-gradient(180deg, #fff 0%, #fff7f6 100%); }
    .sum-cell.tone-late .num:not(.is-zero) { color:#c5221f; }
    .sum-cell.tone-done { background:linear-gradient(180deg, #fff 0%, #f4fbf6 100%); }
    .sum-cell.tone-done .num:not(.is-zero) { color:#137333; }
    .sum-cell.has-val::after { content:""; position:absolute; left:20%; right:20%; bottom:0; height:2px; border-radius:2px 2px 0 0; background:currentColor; opacity:0.35; }
    .sum-cell.tone-doing.has-val { color:#1a73e8; }
    .sum-cell.tone-watch.has-val { color:#e37400; }
    .sum-cell.tone-late.has-val { color:#c5221f; }
    .sum-cell.tone-done.has-val { color:#137333; }
    .sum-cell.is-total.has-val::after { background:#0284c7; opacity:0.45; color:#0284c7; }
    @media (max-width: 720px) {
      .sum-cols { grid-template-columns:repeat(3, minmax(0, 1fr)); }
      .sum-cell { border-right:1px solid #f1f5f9; border-bottom:1px solid #f1f5f9; min-height:84px; }
      .sum-cell:nth-child(3n) { border-right:none; }
      .sum-cell:nth-last-child(-n+3) { border-bottom:none; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" data-page="deptPlans" data-title="部门计划表">
  <div id="app-root"></div>
  <div id="page-main" class="hidden">

    <div class="flex flex-wrap gap-2 items-center mb-4 text-sm">
      <select id="fCp" class="border border-slate-200 rounded-xl px-3 py-1.5 bg-white"></select>
      <select id="fDept" class="border border-slate-200 rounded-xl px-3 py-1.5 bg-white"></select>
      <select id="fPrio" class="border border-slate-200 rounded-xl px-3 py-1.5 bg-white">
        <option value="">全部优先级</option>
        <option value="P0">P0</option>
        <option value="P1">P1</option>
        <option value="P2">P2</option>
      </select>
      <label class="inline-flex items-center gap-1.5 px-2 py-1.5 rounded-xl border border-slate-200 bg-white cursor-pointer">
        <input type="checkbox" id="onlyProblem" class="rounded" /> 仅问题节点
      </label>
      <input type="search" id="kw" placeholder="搜索计划名称" class="border border-slate-200 rounded-xl px-3 py-1.5 w-52" />
      <button type="button" id="btnCollapse" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white">收起至一级</button>
      <button type="button" id="btnExpand" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white">全部展开</button>
    </div>

    <div class="mb-4" id="kpi"></div>

    <div class="bg-white overflow-auto border border-[#e8eaed] rounded-lg shadow-[0_1px_2px_rgba(60,64,67,0.08)]">
      <table class="grid-table min-w-[1100px]">
        <thead>
          <tr>
            <th>序号</th>
            <th class="col-name">年度 / 计划名称</th>
            <th>优先级</th>
            <th>负责人</th>
            <th>配合人员</th>
            <th>完成进度</th>
            <th>状态</th>
            <th>关联任务</th>
            <th>开始时间</th>
            <th>结束时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div id="modalUrge" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalUrge')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-md p-6 space-y-3 text-sm shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <h3 class="text-lg font-semibold">发起催办</h3>
        <input type="hidden" id="uTarget" />
        <input type="hidden" id="uCompanyPlanId" />
        <input type="hidden" id="uPlanId" />
        <div><label class="block text-slate-600 mb-1">催办标题</label><input id="uTitle" class="w-full border rounded-xl px-3 py-2.5" /></div>
        <div><label class="block text-slate-600 mb-1">要求说明 <span class="text-red-500">*</span></label>
          <textarea id="uNote" class="w-full border rounded-xl px-3 py-2.5 h-20" placeholder="接收人可见"></textarea></div>
        <div><label class="block text-slate-600 mb-1">期望回复日 <span class="text-red-500">*</span></label>
          <input type="date" id="uExpect" class="w-full border rounded-xl px-3 py-2.5" value="2026-08-21" /></div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="BMSUI.closeModal('modalUrge')" class="text-slate-500 px-3">取消</button>
          <button type="button" id="btnUrgeSave" class="px-4 py-2 rounded-xl text-white" style="background:#0f766e">确认催办</button>
        </div>
      </div>
    </div>

    <div id="modalEdit" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalEdit')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <div class="px-5 py-4 border-b flex justify-between items-center">
          <h3 class="text-lg font-semibold" id="editTitle">编辑计划</h3>
          <button type="button" onclick="BMSUI.closeModal('modalEdit')" class="w-9 h-9 rounded-xl border text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-4 space-y-3 text-sm">
          <input type="hidden" id="eKind" />
          <input type="hidden" id="eId" />
          <div>
            <label class="block text-slate-600 mb-1">计划名称 <span class="text-red-500">*</span></label>
            <input id="eName" class="w-full border rounded-xl px-3 py-2.5" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-600 mb-1">优先级</label>
              <select id="ePrio" class="w-full border rounded-xl px-3 py-2.5"><option>P0</option><option>P1</option><option>P2</option></select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">状态</label>
              <select id="eStatus" class="w-full border rounded-xl px-3 py-2.5">
                <option>未开始</option><option>进行中</option><option>关注</option><option>延期</option><option>已完成</option>
              </select>
            </div>
          </div>
          <div id="eOwnerWrap">
            <label class="block text-slate-600 mb-1">负责人</label>
            <select id="eOwner" class="w-full border rounded-xl px-3 py-2.5"></select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-600 mb-1">开始日期</label>
              <input type="date" id="eStart" class="w-full border rounded-xl px-3 py-2.5" />
            </div>
            <div>
              <label class="block text-slate-600 mb-1">结束日期</label>
              <input type="date" id="eEnd" class="w-full border rounded-xl px-3 py-2.5" />
            </div>
          </div>
          <div>
            <label class="block text-slate-600 mb-1">完成进度（%）</label>
            <input type="number" id="ePct" min="0" max="100" class="w-full border rounded-xl px-3 py-2.5" />
          </div>
          <div>
            <label class="block text-slate-600 mb-1">进展说明</label>
            <textarea id="eProg" rows="3" class="w-full border rounded-xl px-3 py-2.5"></textarea>
          </div>
        </div>
        <div class="px-5 py-3 border-t flex justify-end gap-2">
          <button type="button" onclick="BMSUI.closeModal('modalEdit')" class="text-slate-500 px-3">取消</button>
          <button type="button" id="btnEditSave" class="px-4 py-2 rounded-xl text-white" style="background:#0f766e">保存</button>
        </div>
      </div>
    </div>

  </div>
  <script src="../assets/store.js"></script>
  <script src="../assets/common.js"></script>
  <script>
(function () {
  let collapsed = new Set();
  let cpFilter = "";
  let deptFilter = "";
  let prioFilter = "";

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function statusTag(st) {
    const map = {
      未开始: "background:#f1f3f4;color:#5f6368",
      进行中: "background:#e8f0fe;color:#1a73e8",
      关注: "background:#fef7e0;color:#e37400",
      延期: "background:#fce8e6;color:#c5221f",
      已完成: "background:#e6f4ea;color:#137333",
    };
    return `<span class="tag" style="${map[st] || ""}">${st}</span>`;
  }
  function prioTag(p) {
    const map = { P0: "background:#fce8e6;color:#c5221f", P1: "background:#fef7e0;color:#e37400", P2: "background:#f1f3f4;color:#5f6368" };
    return `<span class="tag" style="${map[p] || map.P2}">${p || "P2"}</span>`;
  }
  function isProblemPlan(p) {
    const st = BMS4.resolvePlanStatus ? BMS4.resolvePlanStatus(p) : p.status;
    if (st === "延期" || st === "关注") return true;
    if (BMS4.isPlanNearDue && BMS4.isPlanNearDue(p)) return true;
    const under = BMS4.taskItems.filter((t) => t.annualId === p.id);
    return under.some((t) => BMS4.isTaskOverdue(t));
  }
  function deptHead(dept) {
    return BMS4.USERS.find((u) => u.dept === dept && u.role === "部门长");
  }
  function cpKey(cpId) {
    return "cp:" + cpId;
  }

  /** 默认：公司目标展开，一级部门计划可见，更深层级收起 */
  function collapseToLevel1() {
    collapsed.clear();
    BMS4.PLAN_ITEMS.forEach((p) => {
      const kids = BMS4.PLAN_ITEMS.filter((c) => c.parentId === p.id);
      if (kids.length) collapsed.add(p.id);
    });
  }

  function visiblePool() {
    let list = BMS4.PLAN_ITEMS.slice();
    if (cpFilter) list = list.filter((p) => p.companyPlanId === cpFilter);
    if (deptFilter) list = list.filter((p) => p.dept === deptFilter);
    const onlyProblem = document.getElementById("onlyProblem").checked;
    const kw = (document.getElementById("kw").value || "").trim();
    let hit = new Set(list.map((p) => p.id));
    if (prioFilter) {
      hit = new Set(list.filter((p) => hit.has(p.id) && (p.priority || "P2") === prioFilter).map((p) => p.id));
    }
    if (onlyProblem) hit = new Set(list.filter((p) => hit.has(p.id) && isProblemPlan(p)).map((p) => p.id));
    if (kw) hit = new Set(list.filter((p) => hit.has(p.id) && (p.name || "").includes(kw)).map((p) => p.id));
    if (prioFilter || onlyProblem || kw) {
      [...hit].forEach((id) => {
        let cur = BMS4.planById(id);
        while (cur && cur.parentId) {
          hit.add(cur.parentId);
          cur = BMS4.planById(cur.parentId);
        }
      });
      return list.filter((p) => hit.has(p.id));
    }
    return list;
  }

  function buildRows(pool) {
    const idSet = new Set(pool.map((p) => p.id));
    const rows = [];
    let cps = BMS4.COMPANY_PLANS.slice();
    if (cpFilter) cps = cps.filter((c) => c.id === cpFilter);
    cps = cps.filter((cp) => pool.some((p) => p.companyPlanId === cp.id));

    function walk(p, depth, path) {
      const kids = pool.filter((c) => c.parentId === p.id);
      const hasKids = kids.length > 0;
      const isCol = collapsed.has(p.id);
      rows.push({ kind: "plan", p, depth, path, hasKids, isCol });
      if (hasKids && !isCol) kids.forEach((c, i) => walk(c, depth + 1, path + "." + (i + 1)));
    }

    cps.forEach((cp, ci) => {
      const roots = pool.filter((p) => p.companyPlanId === cp.id && (!p.parentId || !idSet.has(p.parentId)));
      const key = cpKey(cp.id);
      const isCol = collapsed.has(key);
      rows.push({
        kind: "company",
        company: cp,
        depth: 0,
        path: String(ci + 1),
        hasKids: roots.length > 0,
        isCol,
      });
      if (!isCol) roots.forEach((r, i) => walk(r, 1, String(ci + 1) + "." + (i + 1)));
    });
    return rows;
  }

  const PLAN_STATUS_ORDER = ["未开始", "进行中", "关注", "延期", "已完成"];

  function statusToneClass(st) {
    if (st === "未开始") return "tone-idle";
    if (st === "进行中") return "tone-doing";
    if (st === "关注") return "tone-watch";
    if (st === "延期") return "tone-late";
    if (st === "已完成") return "tone-done";
    return "";
  }

  function countDeptPlanStatus(pool) {
    const counts = {};
    PLAN_STATUS_ORDER.forEach((k) => (counts[k] = 0));
    pool.forEach((p) => {
      const st = BMS4.resolvePlanStatus ? BMS4.resolvePlanStatus(p) : p.status || "进行中";
      if (counts[st] !== undefined) counts[st]++;
      else counts["进行中"]++;
    });
    return counts;
  }

  function renderSumCard(total, counts) {
    const totalCell = `<div class="sum-cell is-total ${total > 0 ? "has-val" : ""}">
      <div class="lab">合计</div>
      <div class="num ${total === 0 ? "is-zero" : ""}">${total}</div>
    </div>`;
    const cells = PLAN_STATUS_ORDER.map((k) => {
      const n = counts[k] || 0;
      return `<div class="sum-cell ${statusToneClass(k)} ${n > 0 ? "has-val" : ""}">
        <div class="lab">${k}</div>
        <div class="num ${n === 0 ? "is-zero" : ""}">${n}</div>
      </div>`;
    }).join("");
    return `<div class="sum-panel"><div class="sum-cols">${totalCell}${cells}</div></div>`;
  }

  function render() {
    const pool = visiblePool();
    const rows = buildRows(pool);
    const counts = countDeptPlanStatus(pool);
    document.getElementById("kpi").innerHTML = renderSumCard(pool.length, counts);

    document.getElementById("tbody").innerHTML = rows.length
      ? rows
          .map((row) => {
            if (row.kind === "company") {
              const cp = row.company;
              const caret = row.hasKids
                ? `<button type="button" class="caret-btn" data-toggle="${cpKey(cp.id)}"><i class="fa-solid fa-caret-${row.isCol ? "right" : "down"}"></i></button>`
                : `<span style="display:inline-block;width:16px"></span>`;
              return `<tr data-cp-row class="bg-slate-50/80">
                <td class="text-slate-400 text-xs">${row.path}</td>
                <td class="col-name">
                  <div class="flex items-center gap-1">
                    ${caret}
                    <div>
                      <span class="tag" style="background:#e8f0fe;color:#1a73e8;border-color:#c6dafc">年度</span>
                      <span class="ml-1">${BMSUI.planNameLink(cp.name, { id: cp.id, kind: "company", className: "plan-name-link text-teal-800 hover:underline font-semibold leading-snug" })}</span>
                    </div>
                  </div>
                </td>
                <td>${prioTag(cp.priority)}</td>
                <td>${escapeHtml(cp.owner || "—")}</td>
                <td class="text-slate-400">—</td>
                <td class="text-slate-400">${BMS4.clampPct ? BMS4.clampPct(cp.progressPct) : 0}%</td>
                <td>${statusTag(cp.status)}</td>
                <td class="text-slate-400">—</td>
                <td class="text-slate-400">${escapeHtml(cp.startDate || "—")}</td>
                <td class="text-slate-400">${escapeHtml(cp.endDate || "—")}</td>
                <td class="whitespace-nowrap">${BMSUI.rowOpsHtml([
                  { label: "查看", attrs: `data-view-cp="${cp.id}"` },
                  { label: "编辑", attrs: `data-edit-cp="${cp.id}"` },
                  { label: "催办", attrs: `data-urge-cp="${cp.id}"` },
                ])}</td>
              </tr>`;
            }
            const { p, depth, path, hasKids, isCol } = row;
            const tasks = BMS4.taskItems.filter((t) => t.annualId === p.id);
            const done = tasks.filter((t) => t.status === "已完成" || t.status === "已关闭").length;
            const hot = isProblemPlan(p);
            const head = deptHead(p.dept);
            const owner = BMS4.userById(p.ownerId) || head;
            const helpers = (p.helperIds || [])
              .map((id) => {
                const u = BMS4.userById(id);
                return u ? u.name : "";
              })
              .filter(Boolean);
            const pct = BMS4.clampPct ? BMS4.clampPct(p.progressPct) : Number(p.progressPct) || 0;
            const st = BMS4.resolvePlanStatus ? BMS4.resolvePlanStatus(p) : p.status;
            const pad = depth * 18;
            const caret = hasKids
              ? `<button type="button" class="caret-btn" data-toggle="${p.id}"><i class="fa-solid fa-caret-${isCol ? "right" : "down"}"></i></button>`
              : `<span style="display:inline-block;width:16px"></span>`;
            return `<tr class="${hot ? "row-hot" : ""}">
              <td class="text-slate-400 text-xs">${path}</td>
              <td class="col-name">
                <div style="padding-left:${pad}px" class="flex items-center gap-1">
                  ${caret}
                  <div>
                    <span class="leading-snug">${BMSUI.planNameLink(p.name, {
                      id: p.id,
                      kind: "dept",
                      className: "plan-name-link hover:underline font-medium " + (hot ? "text-rose-700" : "text-teal-800"),
                    })}${hot ? '<span class="ml-1 text-[10px] text-rose-500">问题</span>' : ""}</span>
                    <div class="text-[11px] text-slate-400">${escapeHtml(p.dept)}</div>
                  </div>
                </div>
              </td>
              <td>${prioTag(p.priority)}</td>
              <td class="whitespace-nowrap">${owner ? escapeHtml(owner.name) : "—"}</td>
              <td class="max-w-[7rem] truncate" title="${escapeHtml(helpers.join("、"))}">${helpers.length ? escapeHtml(helpers.slice(0, 2).join("、") + (helpers.length > 2 ? "…" : "")) : "—"}</td>
              <td><span class="font-medium">${pct}%</span></td>
              <td>${statusTag(st)}</td>
              <td>${done}/${tasks.length}</td>
              <td class="text-xs text-slate-600 whitespace-nowrap">${escapeHtml(p.startDate || "—")}</td>
              <td class="text-xs text-slate-600 whitespace-nowrap">${escapeHtml(p.endDate || "—")}</td>
              <td class="whitespace-nowrap">${BMSUI.rowOpsHtml([
                { label: "查看", attrs: `data-view-plan="${p.id}"` },
                { label: "编辑", attrs: `data-edit-plan="${p.id}"` },
                { label: "催办", attrs: `data-urge-plan="${p.id}"` },
              ])}</td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="11" class="text-center text-slate-400 py-10">无匹配的部门计划</td></tr>`;

    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-toggle");
        if (collapsed.has(id)) collapsed.delete(id);
        else collapsed.add(id);
        render();
      };
    });
    document.querySelectorAll("[data-view-cp]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        BMSUI.openPlanDetail(btn.getAttribute("data-view-cp"), "company");
      };
    });
    document.querySelectorAll("[data-view-plan]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        BMSUI.openPlanDetail(btn.getAttribute("data-view-plan"), "dept");
      };
    });
    document.querySelectorAll("[data-edit-cp]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openEditCp(btn.getAttribute("data-edit-cp"));
      };
    });
    document.querySelectorAll("[data-edit-plan]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openEditPlan(btn.getAttribute("data-edit-plan"));
      };
    });
    document.querySelectorAll("[data-urge-cp]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const cp = BMS4.COMPANY_PLANS.find((c) => c.id === btn.getAttribute("data-urge-cp"));
        if (!cp) return;
        const u = BMS4.USERS.find((x) => x.name === (cp.owner || "")) || BMS4.USERS.find((x) => x.role === "部门长");
        if (!u) return BMSUI.toast("未找到可催办对象", false);
        openUrge({ targetUserId: u.id, name: cp.name, companyPlanId: cp.id });
      };
    });
    document.querySelectorAll("[data-urge-plan]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const p = BMS4.planById(btn.getAttribute("data-urge-plan"));
        if (!p) return;
        const uid = p.ownerId || (deptHead(p.dept) && deptHead(p.dept).id);
        if (!uid) return BMSUI.toast("未找到可催办对象", false);
        openUrge({ targetUserId: uid, name: p.name, companyPlanId: p.companyPlanId || "", planId: p.id });
      };
    });
    BMSUI.bindRowOps(document.getElementById("tbody"));
  }

  function openUrge(opt) {
    document.getElementById("uTarget").value = opt.targetUserId || "";
    document.getElementById("uCompanyPlanId").value = opt.companyPlanId || "";
    document.getElementById("uPlanId").value = opt.planId || "";
    document.getElementById("uTitle").value = "催办：" + (opt.name || "");
    document.getElementById("uNote").value = "请反馈未完成原因、纠偏措施与可兑现节点。";
    document.getElementById("uExpect").value = "2026-08-21";
    BMSUI.openModal("modalUrge");
  }

  function fillOwnerOpts(selectedId) {
    document.getElementById("eOwner").innerHTML = BMS4.USERS.map(
      (u) =>
        `<option value="${u.id}" ${u.id === selectedId ? "selected" : ""}>${escapeHtml(u.name)} · ${escapeHtml(u.dept)}</option>`
    ).join("");
  }

  function openEditCp(id) {
    const cp = BMS4.COMPANY_PLANS.find((c) => c.id === id);
    if (!cp) return;
    document.getElementById("eKind").value = "company";
    document.getElementById("eId").value = id;
    document.getElementById("editTitle").textContent = "编辑公司计划";
    document.getElementById("eName").value = cp.name || "";
    document.getElementById("ePrio").value = cp.priority || "P1";
    document.getElementById("eStatus").value = cp.status || "进行中";
    document.getElementById("eStart").value = cp.startDate || "";
    document.getElementById("eEnd").value = cp.endDate || "";
    document.getElementById("ePct").value = String(BMS4.clampPct(cp.progressPct));
    document.getElementById("eProg").value = cp.progress || "";
    document.getElementById("eOwnerWrap").classList.add("hidden");
    BMSUI.openModal("modalEdit");
  }

  function openEditPlan(id) {
    const p = BMS4.planById(id);
    if (!p) return;
    document.getElementById("eKind").value = "dept";
    document.getElementById("eId").value = id;
    document.getElementById("editTitle").textContent = "编辑部门计划";
    document.getElementById("eName").value = p.name || "";
    document.getElementById("ePrio").value = p.priority || "P1";
    document.getElementById("eStatus").value = p.status || "进行中";
    document.getElementById("eStart").value = p.startDate || "";
    document.getElementById("eEnd").value = p.endDate || "";
    document.getElementById("ePct").value = String(BMS4.clampPct(p.progressPct));
    document.getElementById("eProg").value = p.progress || "";
    document.getElementById("eOwnerWrap").classList.remove("hidden");
    fillOwnerOpts(p.ownerId);
    BMSUI.openModal("modalEdit");
  }

  function saveEdit() {
    const kind = document.getElementById("eKind").value;
    const id = document.getElementById("eId").value;
    const name = document.getElementById("eName").value.trim();
    if (!name) return BMSUI.toast("请填写计划名称", false);
    const startDate = document.getElementById("eStart").value;
    const endDate = document.getElementById("eEnd").value;
    if (startDate && endDate && endDate < startDate) return BMSUI.toast("结束日期不能早于开始日期", false);
    let status = document.getElementById("eStatus").value;
    let progressPct = BMS4.clampPct(document.getElementById("ePct").value);
    if (status === "已完成") progressPct = 100;
    const patch = {
      name,
      priority: document.getElementById("ePrio").value,
      status,
      startDate,
      endDate,
      progressPct,
      progress: document.getElementById("eProg").value.trim(),
    };
    if (kind === "company") {
      BMS4.updateCompanyPlan(id, patch);
    } else {
      patch.ownerId = document.getElementById("eOwner").value;
      BMS4.updatePlan(id, patch);
    }
    BMSUI.closeModal("modalEdit");
    BMSUI.toast("已保存");
    render();
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (!BMS4.canViewAllPlans(BMS4.getRoleUser())) {
      document.getElementById("page-main").innerHTML =
        '<div class="bg-white rounded-2xl border p-8 text-slate-500">本页为总经理 / 计划管理员只读主表。部门长请使用「计划管理」维护本部门计划树。</div>';
      return;
    }
    if (BMS4.isPlanAdmin(BMS4.getRoleUser())) {
      const tip = document.querySelector("#page-main p.text-xs");
      if (tip) {
        tip.innerHTML =
          "计划管理员只读联查部门计划树。维护与导入请回「计划管理」。";
      }
    }
    const params = new URLSearchParams(location.search);
    cpFilter = params.get("cp") || "";
    deptFilter = params.get("dept") || "";

    const fCp = document.getElementById("fCp");
    fCp.innerHTML =
      '<option value="">全部公司计划</option>' +
      BMS4.COMPANY_PLANS.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
    fCp.value = cpFilter;
    fCp.onchange = () => {
      cpFilter = fCp.value;
      render();
    };

    const fDept = document.getElementById("fDept");
    fDept.innerHTML =
      '<option value="">全部部门</option>' + BMS4.DEPTS.map((d) => `<option value="${d}">${d}</option>`).join("");
    fDept.value = deptFilter;
    fDept.onchange = () => {
      deptFilter = fDept.value;
      render();
    };

    const fPrio = document.getElementById("fPrio");
    fPrio.value = prioFilter;
    fPrio.onchange = () => {
      prioFilter = fPrio.value || "";
      render();
    };

    document.getElementById("onlyProblem").onchange = render;
    document.getElementById("kw").addEventListener("input", render);
    document.getElementById("btnCollapse").onclick = () => {
      collapseToLevel1();
      render();
    };
    document.getElementById("btnExpand").onclick = () => {
      collapsed.clear();
      render();
    };

    document.getElementById("btnUrgeSave").onclick = () => {
      const r = BMS4.createUrge({
        targetUserId: document.getElementById("uTarget").value,
        title: document.getElementById("uTitle").value.trim(),
        note: document.getElementById("uNote").value.trim(),
        expectReplyDate: document.getElementById("uExpect").value,
        companyPlanId: document.getElementById("uCompanyPlanId").value || undefined,
        planId: document.getElementById("uPlanId").value || undefined,
      });
      if (!r.ok) return BMSUI.toast(r.reason, false);
      BMSUI.closeModal("modalUrge");
      BMSUI.toast("已催办，对象可在待办查看要求说明");
    };
    document.getElementById("btnEditSave").onclick = saveEdit;

    collapseToLevel1();
    render();
  });
})();
  </script>
</body>
</html>
