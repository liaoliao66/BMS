<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>整体任务表 · v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .btn-cta { background:#0f766e; } .btn-cta:hover { background:#0d9488; }
    .row-hover:hover { background:#f8fafc; }
    .tab-on { background:#0f766e; color:#fff; }
    .tab-off { background:#fff; color:#64748b; }
    .chip { display:inline-flex; align-items:center; padding:1px 8px; border-radius:4px; font-size:11px; border:1px solid #c6dafc; background:#e8f0fe; color:#1a73e8; }
    .tag { display:inline-flex; align-items:center; padding:1px 8px; border-radius:4px; font-size:12px; line-height:20px; border:1px solid #e8eaed; background:#f1f3f4; color:#5f6368; white-space:nowrap; }
    .tag-p0 { background:#fce8e6; color:#c5221f; border-color:#f5c6c4; }
    .tag-p1 { background:#fef7e0; color:#e37400; border-color:#fde293; }
    .tag-p2 { background:#f1f3f4; color:#5f6368; border-color:#e8eaed; }
    .sum-panel { background:#fff; border:1px solid #e8eaed; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(60,64,67,0.06); }
    .sum-cols { display:grid; }
    .sum-cell { position:relative; padding:18px 12px; text-align:center; border-right:1px solid #f1f5f9; min-height:92px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:6px; }
    .sum-cell:last-child { border-right:none; }
    .sum-cell .lab { font-size:12px; color:#64748b; letter-spacing:0.01em; white-space:nowrap; }
    .sum-cell .num { font-size:26px; font-weight:600; letter-spacing:-0.03em; line-height:1; color:#0f172a; font-variant-numeric:tabular-nums; }
    .sum-cell .num.is-zero { color:#cbd5e1; font-weight:500; }
    .sum-cell.is-total { background:#f8fafc; }
    .sum-cell.is-total .lab { color:#0f766e; font-weight:500; }
    .sum-cell.tone-idle { background:linear-gradient(180deg, #fff 0%, #fafbfc 100%); }
    .sum-cell.tone-doing { background:linear-gradient(180deg, #fff 0%, #f5f9ff 100%); }
    .sum-cell.tone-doing .num:not(.is-zero) { color:#1a73e8; }
    .sum-cell.tone-todo { background:linear-gradient(180deg, #fff 0%, #f8fafc 100%); }
    .sum-cell.tone-late { background:linear-gradient(180deg, #fff 0%, #fff7f6 100%); }
    .sum-cell.tone-late .num:not(.is-zero) { color:#c5221f; }
    .sum-cell.tone-done { background:linear-gradient(180deg, #fff 0%, #f4fbf6 100%); }
    .sum-cell.tone-done .num:not(.is-zero) { color:#137333; }
    .sum-cell.tone-closed { background:linear-gradient(180deg, #fff 0%, #f8fafc 100%); }
    .sum-cell.tone-closed .num:not(.is-zero) { color:#64748b; }
    .sum-cell.has-val::after { content:""; position:absolute; left:20%; right:20%; bottom:0; height:2px; border-radius:2px 2px 0 0; background:currentColor; opacity:0.35; }
    .sum-cell.tone-doing.has-val { color:#1a73e8; }
    .sum-cell.tone-late.has-val { color:#c5221f; }
    .sum-cell.tone-done.has-val { color:#137333; }
    .sum-cell.tone-closed.has-val { color:#64748b; }
    .sum-cell.is-total.has-val::after { background:#0f766e; opacity:0.45; color:#0f766e; }
    @media (max-width: 720px) {
      .sum-cols { grid-template-columns:repeat(3, minmax(0, 1fr)) !important; }
      .sum-cell { border-right:1px solid #f1f5f9; border-bottom:1px solid #f1f5f9; min-height:84px; }
      .sum-cell:nth-child(3n) { border-right:none; }
      .sum-cell:nth-last-child(-n+3) { border-bottom:none; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" data-page="allTasks" data-title="整体任务表">
  <div id="app-root"></div>
  <div id="page-main" class="hidden">

    <div class="flex flex-wrap gap-2 mb-4 items-center">
      <div class="inline-flex rounded-xl overflow-hidden border border-slate-200 text-sm">
        <button type="button" id="fAll" class="tab-on px-3 py-1.5">全部任务</button>
        <button type="button" id="fEx" class="tab-off px-3 py-1.5">例外任务</button>
      </div>
      <select id="fCp" class="border rounded-xl px-3 py-1.5 text-sm bg-white"></select>
      <select id="fDept" class="border rounded-xl px-3 py-1.5 text-sm bg-white"></select>
      <input type="search" id="kw" placeholder="搜索任务/部门/责任人" class="border rounded-xl px-3 py-1.5 text-sm w-52" />
    </div>
    <div class="mb-4" id="kpi"></div>
    <div class="bg-white rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
      <table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500"><tr>
        <th class="px-4 py-3 text-left">任务项</th><th class="px-4 py-3 text-left">部门</th>
        <th class="px-4 py-3 text-left">责任人</th><th class="px-4 py-3 text-left" id="colPath">计划路径</th>
        <th class="px-4 py-3 text-left">优先级</th>
        <th class="px-4 py-3 text-left">状态</th><th class="px-4 py-3 text-left">截止</th>
        <th class="px-4 py-3 text-left">起止</th><th class="px-4 py-3 text-left" id="colHours">耗费工时</th><th class="px-4 py-3 text-left">操作</th>
      </tr></thead><tbody id="tbody"></tbody></table>
    </div>

    <div id="modalUrge" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalUrge')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-md p-6 space-y-3 text-sm shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <h3 class="text-lg font-semibold">发起催办</h3>
        <input type="hidden" id="uTarget" />
        <input type="hidden" id="uTaskId" />
        <div><label class="block text-slate-600 mb-1">催办标题</label><input id="uTitle" class="w-full border rounded-xl px-3 py-2.5" /></div>
        <div><label class="block text-slate-600 mb-1">要求说明 <span class="text-red-500">*</span></label>
          <textarea id="uNote" class="w-full border rounded-xl px-3 py-2.5 h-20" placeholder="接收人可见：说明要求与期望结果"></textarea></div>
        <div><label class="block text-slate-600 mb-1">期望回复日 <span class="text-red-500">*</span></label>
          <input type="date" id="uExpect" class="w-full border rounded-xl px-3 py-2.5" value="2026-08-21" /></div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="BMSUI.closeModal('modalUrge')" class="text-slate-500 px-3">取消</button>
          <button type="button" onclick="saveUrge()" class="btn-cta text-white px-4 py-2 rounded-xl">确认催办</button>
        </div>
      </div>
    </div>

  </div>
  <script src="../assets/store.js"></script>
  <script src="../assets/common.js"></script>
  <script>
/** all | supervise（例外=督办/计划外） */
let viewMode = "all";
let cpFilter = "";
let deptFilter = "";
let planFilter = "";

function escapeHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function prioTag(p) {
  if (!p) return "—";
  const cls = p === "P0" ? "tag-p0" : p === "P1" ? "tag-p1" : "tag-p2";
  return `<span class="tag ${cls}">${escapeHtml(p)}</span>`;
}
function openUrge(uid, name, taskId, exType) {
  document.getElementById("uTarget").value = uid;
  document.getElementById("uTaskId").value = taskId || "";
  document.getElementById("uTitle").value = "催办：" + name;
  document.getElementById("uNote").value = "请反馈未完成原因、纠偏措施与可兑现节点。";
  document.getElementById("uExpect").value = "2026-08-21";
  document.getElementById("modalUrge").dataset.exType = exType || "";
  BMSUI.openModal("modalUrge");
}
function saveUrge() {
  const r = BMS4.createUrge({
    targetUserId: document.getElementById("uTarget").value,
    title: document.getElementById("uTitle").value.trim(),
    note: document.getElementById("uNote").value.trim(),
    expectReplyDate: document.getElementById("uExpect").value,
    taskId: document.getElementById("uTaskId").value || undefined,
    exceptionType: document.getElementById("modalUrge").dataset.exType || undefined,
  });
  if (!r.ok) return BMSUI.toast(r.reason, false);
  BMSUI.closeModal("modalUrge");
  BMSUI.toast("已催办，对象可在待办查看要求说明");
}

function isSuperviseOverdue(m) {
  return m.endDate && m.endDate < (BMS4.DEMO_TODAY || "2026-08-18") && m.status !== "已完成";
}

const TASK_STATUS_ORDER = ["未开始", "进行中", "延期", "已完成", "已关闭"];
const SUPERVISE_STATUS_ORDER = ["待办", "进行中", "延期", "已完成"];

function statusToneClass(st) {
  if (st === "未开始" || st === "待办") return "tone-idle";
  if (st === "进行中") return "tone-doing";
  if (st === "延期") return "tone-late";
  if (st === "已完成") return "tone-done";
  if (st === "已关闭") return "tone-closed";
  return "";
}

function taskDisplayStatus(t) {
  if (t.status === "已完成" || t.status === "已关闭") return t.status;
  if (BMS4.isTaskOverdue(t) || t.status === "延期") return "延期";
  return t.status || "进行中";
}

function superviseDisplayStatus(m) {
  if (m.status === "已完成") return "已完成";
  if (isSuperviseOverdue(m) || m.status === "延期") return "延期";
  return m.status || "待办";
}

function countByOrder(items, getStatus, order) {
  const counts = {};
  order.forEach((k) => (counts[k] = 0));
  items.forEach((item) => {
    const st = getStatus(item);
    if (counts[st] !== undefined) counts[st]++;
    else if (counts["进行中"] !== undefined) counts["进行中"]++;
  });
  return counts;
}

function renderSumCard(total, order, counts) {
  const n = order.length + 1;
  const totalCell = `<div class="sum-cell is-total ${total > 0 ? "has-val" : ""}">
    <div class="lab">合计</div>
    <div class="num ${total === 0 ? "is-zero" : ""}">${total}</div>
  </div>`;
  const cells = order
    .map((k) => {
      const c = counts[k] || 0;
      return `<div class="sum-cell ${statusToneClass(k)} ${c > 0 ? "has-val" : ""}">
        <div class="lab">${k}</div>
        <div class="num ${c === 0 ? "is-zero" : ""}">${c}</div>
      </div>`;
    })
    .join("");
  return `<div class="sum-panel"><div class="sum-cols" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${totalCell}${cells}</div></div>`;
}

function render() {
  const isAll = viewMode === "all";
  document.getElementById("fAll").className = "px-3 py-1.5 " + (isAll ? "tab-on" : "tab-off");
  document.getElementById("fEx").className = "px-3 py-1.5 " + (!isAll ? "tab-on" : "tab-off");
  document.getElementById("colPath").textContent = isAll ? "计划路径" : "类型";
  document.getElementById("colHours").textContent = isAll ? "耗费工时" : "配合人";
  document.getElementById("fCp").classList.toggle("hidden", !isAll);

  const kw = (document.getElementById("kw").value || "").trim();

  if (isAll) {
    let list = BMS4.taskItems.slice();
    if (planFilter) {
      const ids = new Set([planFilter, ...BMS4.planDescendantIds(planFilter)]);
      list = list.filter((t) => ids.has(t.annualId));
    }
    if (cpFilter) {
      list = list.filter((t) => {
        const pl = BMS4.planById(t.annualId);
        return pl && pl.companyPlanId === cpFilter;
      });
    }
    if (deptFilter) list = list.filter((t) => t.dept === deptFilter);
    if (kw) {
      list = list.filter((t) => {
        const u = BMS4.userById(t.ownerId);
        return (t.name || "").includes(kw) || (t.dept || "").includes(kw) || (u && u.name.includes(kw));
      });
    }
    list.sort((a, b) => {
      const sa = BMS4.isTaskOverdue(a) ? 2 : BMS4.isTaskNearDue(a) ? 1 : 0;
      const sb = BMS4.isTaskOverdue(b) ? 2 : BMS4.isTaskNearDue(b) ? 1 : 0;
      return sb - sa;
    });
    const taskCounts = countByOrder(list, taskDisplayStatus, TASK_STATUS_ORDER);
    document.getElementById("kpi").innerHTML = renderSumCard(list.length, TASK_STATUS_ORDER, taskCounts);

    document.getElementById("tbody").innerHTML = list.length
      ? list
          .map((t) => {
            const u = BMS4.userById(t.ownerId);
            const nameJs = (t.name || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
            const flag = BMS4.isTaskOverdue(t) ? "延期" : BMS4.isTaskNearDue(t) ? "临期" : "";
            return `<tr class="border-t row-hover"><td class="px-4 py-3">${BMSUI.taskNameLink(t.name, {
              id: t.id,
            })}${flag ? ` <span class="text-[11px] text-rose-600">[${flag}]</span>` : ""}</td><td class="px-4 py-3">${escapeHtml(
              t.dept || "—"
            )}</td>
      <td class="px-4 py-3">${u ? escapeHtml(u.name) : ""}</td>
      <td class="px-4 py-3 text-slate-600 max-w-[14rem]">${
              t.annualId
                ? BMSUI.planNameLink(BMS4.planPathLabel(t.annualId) || "—", { id: t.annualId, kind: "dept" })
                : "—"
            }</td>
      <td class="px-4 py-3">${prioTag(t.priority)}</td>
      <td class="px-4 py-3">${BMSUI.statusBadge(t.status)}</td>
      <td class="px-4 py-3">${escapeHtml(t.deadline || "—")}</td>
      <td class="px-4 py-3 text-xs whitespace-nowrap">${escapeHtml(BMS4.taskStartDate(t) || "—")} ~ ${escapeHtml(
              BMS4.taskEndDate(t) || "—"
            )}</td>
      <td class="px-4 py-3 tabular-nums">${BMS4.taskWorkHours(t) || 0}h</td>
      <td class="px-4 py-3"><button type="button" class="text-teal-700 text-sm hover:underline" onclick="openUrge('${t.ownerId}','${nameJs}','${t.id}')">催办</button></td></tr>`;
          })
          .join("")
      : `<tr><td colspan="10" class="px-4 py-10 text-center text-slate-400">无计划内任务</td></tr>`;
    return;
  }

  // 例外任务 = 督办（计划外）
  let list = (BMS4.superviseItems || []).slice();
  if (deptFilter) {
    list = list.filter((m) => {
      const u = BMS4.userById(m.ownerId);
      return u && u.dept === deptFilter;
    });
  }
  if (kw) {
    list = list.filter((m) => {
      const u = BMS4.userById(m.ownerId);
      return (
        (m.title || "").includes(kw) ||
        (m.helper || "").includes(kw) ||
        (u && (u.name.includes(kw) || (u.dept || "").includes(kw)))
      );
    });
  }
  list.sort((a, b) => {
    const sa = isSuperviseOverdue(a) ? 2 : a.status === "已完成" ? 0 : 1;
    const sb = isSuperviseOverdue(b) ? 2 : b.status === "已完成" ? 0 : 1;
    return sb - sa;
  });
  const superviseCounts = countByOrder(list, superviseDisplayStatus, SUPERVISE_STATUS_ORDER);
  document.getElementById("kpi").innerHTML = renderSumCard(list.length, SUPERVISE_STATUS_ORDER, superviseCounts);

  document.getElementById("tbody").innerHTML = list.length
    ? list
        .map((m) => {
          const u = BMS4.userById(m.ownerId);
          const nameJs = (m.title || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
          const flag = isSuperviseOverdue(m) ? "逾期" : "";
          const canUrge = m.status !== "已完成" && m.ownerId;
          return `<tr class="border-t row-hover">
      <td class="px-4 py-3">${escapeHtml(m.title)}${
            flag ? ` <span class="text-[11px] text-rose-600">[${flag}]</span>` : ""
          }</td>
      <td class="px-4 py-3">${u ? escapeHtml(u.dept) : "—"}</td>
      <td class="px-4 py-3">${u ? escapeHtml(u.name) : "—"}</td>
      <td class="px-4 py-3"><span class="chip">计划外 · 督办</span></td>
      <td class="px-4 py-3">${prioTag(m.priority)}</td>
      <td class="px-4 py-3">${BMSUI.statusBadge(m.status)}</td>
      <td class="px-4 py-3">${escapeHtml(m.endDate || "—")}</td>
      <td class="px-4 py-3 text-xs whitespace-nowrap">${escapeHtml(m.startDate || "—")} ~ ${escapeHtml(m.endDate || "—")}</td>
      <td class="px-4 py-3 text-slate-600">${escapeHtml(m.helper || "—")}</td>
      <td class="px-4 py-3 space-x-2 whitespace-nowrap">
        ${
          canUrge
            ? `<button type="button" class="text-teal-700 text-sm hover:underline" onclick="openUrge('${m.ownerId}','${nameJs}','','任务督办')">催办</button>`
            : "—"
        }
      </td>
    </tr>`;
        })
        .join("")
    : `<tr><td colspan="10" class="px-4 py-10 text-center text-slate-400">暂无例外任务（督办）</td></tr>`;
}

document.addEventListener("DOMContentLoaded", () => {
  if (!BMS4.canViewAllPlans(BMS4.getRoleUser())) {
    document.getElementById("page-main").innerHTML =
      '<div class="bg-white rounded-2xl border p-8 text-slate-500">本页仅总经理 / 计划管理员可见。</div>';
    return;
  }
  const params = new URLSearchParams(location.search);
  if (params.get("ex") === "1" || params.get("supervise") === "1") viewMode = "supervise";
  else viewMode = "all";
  cpFilter = params.get("cp") || "";
  deptFilter = params.get("dept") || "";
  planFilter = params.get("plan") || "";

  const fCp = document.getElementById("fCp");
  fCp.innerHTML =
    '<option value="">全部公司计划</option>' +
    BMS4.COMPANY_PLANS.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
  fCp.value = cpFilter;
  fCp.onchange = () => {
    cpFilter = fCp.value;
    render();
  };
  const fDept = document.getElementById("fDept");
  fDept.innerHTML =
    '<option value="">全部部门</option>' + BMS4.DEPTS.map((d) => `<option value="${d}">${d}</option>`).join("");
  fDept.value = deptFilter;
  fDept.onchange = () => {
    deptFilter = fDept.value;
    render();
  };

  document.getElementById("fAll").onclick = () => {
    viewMode = "all";
    render();
  };
  document.getElementById("fEx").onclick = () => {
    viewMode = "supervise";
    render();
  };
  document.getElementById("kw").addEventListener("input", render);
  render();
});
  </script>
</body>
</html>
