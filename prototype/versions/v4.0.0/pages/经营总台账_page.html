<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>公司计划表 · v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .btn-cta { background:#0f766e; } .btn-cta:hover { background:#0d9488; }
    .grid-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .grid-table th, .grid-table td { border: 1px solid #e8eaed; padding: 10px 12px; vertical-align: middle; }
    .grid-table thead th { background: #f5f6f8; color: #5f6368; font-weight: 500; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
    .grid-table tbody tr:hover { background: #fafbfc; }
    .row-risk td { background: #fffbfa; }
    .row-risk:hover td { background: #fff7f6; }
    .col-name { min-width: 18rem; max-width: 26rem; position: sticky; left: 0; z-index: 2; background: #fff; box-shadow: 4px 0 8px -4px rgba(15,23,42,0.1); }
    thead .col-name { background: #f5f6f8; z-index: 3; }
    .row-risk .col-name { background: #fffbfa; }
    .row-risk:hover .col-name { background: #fff7f6; }
    tbody tr:hover .col-name { background: #fafbfc; }
    .cell-edit { cursor: pointer; border-radius: 6px; padding: 2px 6px; display: inline-flex; align-items: center; gap: 4px; min-height: 24px; }
    .cell-edit:hover { background: #eef5f4; }
    .pencil { font-size: 10px; color: #94a3b8; opacity: 0; }
    .cell-edit:hover .pencil { opacity: 1; }
    .inline-input { border: 1px solid #94c2ff; border-radius: 6px; padding: 4px 8px; font-size: 13px; background: #fff; min-width: 5.5rem; box-shadow: 0 0 0 3px rgba(26,115,232,0.08); }
    .inline-input:focus { outline: none; border-color: #1a73e8; }
    .inline-input.name-input { min-width: 14rem; max-width: 100%; width: auto; }
    .pct-wrap { min-width: 5.5rem; }
    .pct-bar { height: 4px; border-radius: 999px; background: #e8eaed; overflow: hidden; margin-top: 6px; }
    .pct-fill { height: 100%; border-radius: 999px; background: #0f766e; }
    .pct-fill.is-low { background: #d97706; }
    .pct-fill.is-done { background: #059669; }
    .cell-sum { cursor: pointer; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; transition: background .15s; }
    .cell-sum:hover { background: #f0fdfa; }
    .sum-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .sum-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; line-height: 18px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
    .sum-chip:hover { filter: brightness(0.97); }
    .sum-chip.st-未开始 { background:#f1f3f4; color:#5f6368; border-color:#e8eaed; }
    .sum-chip.st-进行中 { background:#e8f0fe; color:#1a73e8; border-color:#c6dafc; }
    .sum-chip.st-关注 { background:#fef7e0; color:#e37400; border-color:#fde293; }
    .sum-chip.st-延期 { background:#fce8e6; color:#c5221f; border-color:#f5c6c4; }
    .sum-chip.st-已完成 { background:#e6f4ea; color:#137333; border-color:#ceead6; }
    .sum-chip.st-已关闭 { background:#f1f3f4; color:#80868b; border-color:#e8eaed; }
    .sum-chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .dept-link { display:inline-flex; align-items:center; gap:6px; color:#0f766e; font-weight:500; }
    .dept-link:hover { text-decoration: underline; }
    .col-prog { min-width: 22rem; max-width: 32rem; width: 26rem; }
    .prog-edit { cursor:pointer; border-radius:8px; padding:6px 8px; width:100%; max-width:100%; color:#475569; line-height:1.45; display:inline-flex; align-items:flex-start; gap:6px; box-sizing:border-box; }
    .prog-edit:hover { background:#eef5f4; }
    .prog-edit.empty { color:#94a3b8; }
    .prog-edit .prog-text { flex:1; min-width:0; white-space:normal; word-break:break-word; }
    .prog-area { width:100%; min-width:18rem; border:1px solid #94c2ff; border-radius:8px; padding:8px 10px; font-size:13px; line-height:1.45; resize:vertical; min-height:72px; box-shadow:0 0 0 3px rgba(26,115,232,0.08); box-sizing:border-box; }
    .prog-area:focus { outline:none; border-color:#1a73e8; }
    .filter-chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid #e2e8f0; background: #fff; color: #64748b; }
    .filter-chip.on { border-color: #99f6e4; background: #f0fdfa; color: #0f766e; font-weight: 500; }
    .name-wrap { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; }
    .sum-panel { background:#fff; border:1px solid #e8eaed; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(60,64,67,0.06); }
    .sum-cols { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); }
    .sum-cell { position:relative; padding:18px 12px; text-align:center; border-right:1px solid #f1f5f9; min-height:92px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:6px; }
    .sum-cell:last-child { border-right:none; }
    .sum-cell .lab { font-size:12px; color:#64748b; letter-spacing:0.01em; white-space:nowrap; }
    .sum-cell .num { font-size:26px; font-weight:600; letter-spacing:-0.03em; line-height:1; color:#0f172a; font-variant-numeric:tabular-nums; }
    .sum-cell .num.is-zero { color:#cbd5e1; font-weight:500; }
    .sum-cell.is-total { background:#f8fafc; }
    .sum-cell.is-total .lab { color:#0f766e; font-weight:500; }
    .sum-cell.is-total .num { color:#0f172a; }
    .sum-cell.tone-idle { background:linear-gradient(180deg, #fff 0%, #fafbfc 100%); }
    .sum-cell.tone-doing { background:linear-gradient(180deg, #fff 0%, #f5f9ff 100%); }
    .sum-cell.tone-doing .num:not(.is-zero) { color:#1a73e8; }
    .sum-cell.tone-watch { background:linear-gradient(180deg, #fff 0%, #fffbf0 100%); }
    .sum-cell.tone-watch .num:not(.is-zero) { color:#e37400; }
    .sum-cell.tone-late { background:linear-gradient(180deg, #fff 0%, #fff7f6 100%); }
    .sum-cell.tone-late .num:not(.is-zero) { color:#c5221f; }
    .sum-cell.tone-done { background:linear-gradient(180deg, #fff 0%, #f4fbf6 100%); }
    .sum-cell.tone-done .num:not(.is-zero) { color:#137333; }
    .sum-cell.has-val::after { content:""; position:absolute; left:20%; right:20%; bottom:0; height:2px; border-radius:2px 2px 0 0; background:currentColor; opacity:0.35; }
    .sum-cell.tone-doing.has-val { color:#1a73e8; }
    .sum-cell.tone-watch.has-val { color:#e37400; }
    .sum-cell.tone-late.has-val { color:#c5221f; }
    .sum-cell.tone-done.has-val { color:#137333; }
    .sum-cell.is-total.has-val::after { background:#0f766e; opacity:0.45; color:#0f766e; }
    @media (max-width: 720px) {
      .sum-cols { grid-template-columns:repeat(3, minmax(0, 1fr)); }
      .sum-cell { border-right:1px solid #f1f5f9; border-bottom:1px solid #f1f5f9; min-height:84px; }
      .sum-cell:nth-child(3n) { border-right:none; }
      .sum-cell:nth-last-child(-n+3) { border-bottom:none; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" data-page="companyPlan" data-title="公司计划表">
  <div id="app-root"></div>
  <div id="page-main" class="hidden">

    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex flex-wrap gap-2 items-center text-sm">
        <input type="search" id="kw" placeholder="搜索计划名称 / 进展说明" class="border border-slate-200 rounded-xl px-3 py-1.5 w-56 bg-white" />
        <select id="fPrio" class="border border-slate-200 rounded-xl px-3 py-1.5 bg-white">
          <option value="">全部优先级</option>
          <option value="P0">P0</option>
          <option value="P1">P1</option>
          <option value="P2">P2</option>
        </select>
        <select id="fStatus" class="border border-slate-200 rounded-xl px-3 py-1.5 bg-white">
          <option value="">全部状态</option>
          <option value="未开始">未开始</option>
          <option value="进行中">进行中</option>
          <option value="关注">关注</option>
          <option value="延期">延期</option>
          <option value="已完成">已完成</option>
        </select>
      </div>
      <button id="btnNew" class="btn-cta text-white text-sm px-4 py-2 rounded-xl"><i class="fa-solid fa-plus mr-1"></i>下达公司计划</button>
    </div>
    <div class="mb-4" id="kpi"></div>
    <div class="bg-white overflow-auto border border-[#e8eaed] rounded-lg shadow-[0_1px_2px_rgba(60,64,67,0.08)]">
      <table class="grid-table min-w-[1480px]">
        <thead>
          <tr>
            <th class="col-name">计划名称</th>
            <th>优先级</th>
            <th>状态</th>
            <th>整体进度</th>
            <th>承接部门</th>
            <th style="min-width:11rem">计划状态汇总</th>
            <th style="min-width:11rem">任务状态汇总</th>
            <th class="col-prog">进展说明</th>
            <th>开始时间</th>
            <th>结束时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="cpBody"></tbody>
      </table>
    </div>

    <div id="modal-cp" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modal-cp')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-lg shadow-[0_12px_40px_rgba(0,0,0,0.12)] p-6 space-y-3 text-sm max-h-[90vh] overflow-y-auto">
        <h3 class="text-lg font-semibold" id="cpModalTitle">下达公司计划</h3>
        <input type="hidden" id="cpEditId" value="" />
        <div>
          <label class="block text-slate-600 mb-1">计划名称 <span class="text-red-500">*</span></label>
          <input id="cpName" class="w-full border rounded-xl px-3 py-2.5" placeholder="计划名称" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-600 mb-1">优先级</label>
            <select id="cpPrio" class="w-full border rounded-xl px-3 py-2.5">
              <option>P0</option><option selected>P1</option><option>P2</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1">状态</label>
            <select id="cpStatus" class="w-full border rounded-xl px-3 py-2.5">
              <option>未开始</option><option selected>进行中</option><option>关注</option><option>延期</option><option>已完成</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-600 mb-1">开始时间 <span class="text-red-500">*</span></label>
            <input type="date" id="cpStart" class="w-full border rounded-xl px-3 py-2.5" value="2026-01-01" />
          </div>
          <div>
            <label class="block text-slate-600 mb-1">结束时间 <span class="text-red-500">*</span></label>
            <input type="date" id="cpEnd" class="w-full border rounded-xl px-3 py-2.5" value="2026-12-31" />
          </div>
        </div>
        <div>
          <label class="block text-slate-600 mb-1">整体进度（%）</label>
          <input type="number" id="cpPct" min="0" max="100" value="0" class="w-full border rounded-xl px-3 py-2.5" />
        </div>
        <div>
          <label class="block text-slate-600 mb-1">进展说明</label>
          <textarea id="cpProg" class="w-full border rounded-xl px-3 py-2.5 h-24" placeholder="初始说明/完成情况"></textarea>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="BMSUI.closeModal('modal-cp')" class="text-slate-500 px-3">取消</button>
          <button type="button" id="btnCpSave" onclick="saveCp()" class="btn-cta text-white px-4 py-2 rounded-xl">发布</button>
        </div>
      </div>
    </div>

    <div id="modal-dept" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modal-dept')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-2xl shadow-[0_12px_40px_rgba(0,0,0,0.12)] overflow-hidden max-h-[85vh] flex flex-col">
        <div class="px-5 py-4 border-b flex items-center justify-between gap-3">
          <div>
            <h3 class="text-lg font-semibold" id="deptModalTitle">承接部门</h3>
            <p class="text-xs text-slate-400 mt-0.5" id="deptModalSub"></p>
          </div>
          <button type="button" onclick="BMSUI.closeModal('modal-dept')" class="w-9 h-9 rounded-xl border text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-5 overflow-auto flex-1">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500">
              <tr>
                <th class="px-3 py-2 text-left whitespace-nowrap">部门</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">部门长</th>
                <th class="px-3 py-2 text-right whitespace-nowrap">子计划</th>
                <th class="px-3 py-2 text-right whitespace-nowrap">任务</th>
                <th class="px-3 py-2 text-right whitespace-nowrap">任务完成率</th>
                <th class="px-3 py-2 text-right whitespace-nowrap">延期任务</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">本周周报</th>
              </tr>
            </thead>
            <tbody id="deptModalBody"></tbody>
          </table>
        </div>
        <div class="px-5 py-3 border-t flex justify-end">
          <span id="deptModalLink" class="hidden"></span>
          <button type="button" onclick="BMSUI.closeModal('modal-dept')" class="text-slate-500 px-3 text-sm">关闭</button>
        </div>
      </div>
    </div>

    <div id="modal-plan-sum" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modal-plan-sum')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-4xl shadow-[0_12px_40px_rgba(0,0,0,0.12)] overflow-hidden max-h-[85vh] flex flex-col">
        <div class="px-5 py-4 border-b flex items-center justify-between gap-3">
          <div>
            <h3 class="text-lg font-semibold" id="planSumTitle">子计划明细</h3>
            <p class="text-xs text-slate-400 mt-0.5" id="planSumSub"></p>
          </div>
          <button type="button" onclick="BMSUI.closeModal('modal-plan-sum')" class="w-9 h-9 rounded-xl border text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="px-5 pt-3 flex flex-wrap gap-2" id="planSumFilters"></div>
        <div class="p-5 overflow-auto flex-1">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500">
              <tr>
                <th class="px-3 py-2 text-left">子计划</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">部门</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">状态</th>
                <th class="px-3 py-2 text-right whitespace-nowrap">进度</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">责任人</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">起止时间</th>
              </tr>
            </thead>
            <tbody id="planSumBody"></tbody>
          </table>
        </div>
        <div class="px-5 py-3 border-t flex justify-end items-center">
          <span id="planSumLink" class="hidden"></span>
          <button type="button" onclick="BMSUI.closeModal('modal-plan-sum')" class="text-slate-500 px-3 text-sm">关闭</button>
        </div>
      </div>
    </div>

    <div id="modal-task-sum" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modal-task-sum')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-5xl shadow-[0_12px_40px_rgba(0,0,0,0.12)] overflow-hidden max-h-[85vh] flex flex-col">
        <div class="px-5 py-4 border-b flex items-center justify-between gap-3">
          <div>
            <h3 class="text-lg font-semibold" id="taskSumTitle">任务明细</h3>
            <p class="text-xs text-slate-400 mt-0.5" id="taskSumSub"></p>
          </div>
          <button type="button" onclick="BMSUI.closeModal('modal-task-sum')" class="w-9 h-9 rounded-xl border text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="px-5 pt-3 flex flex-wrap gap-2" id="taskSumFilters"></div>
        <div class="p-5 overflow-auto flex-1">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500">
              <tr>
                <th class="px-3 py-2 text-left">任务</th>
                <th class="px-3 py-2 text-left">所属计划</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">部门</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">状态</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">责任人</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">截止日</th>
                <th class="px-3 py-2 text-left whitespace-nowrap">操作</th>
              </tr>
            </thead>
            <tbody id="taskSumBody"></tbody>
          </table>
        </div>
        <div class="px-5 py-3 border-t flex justify-end items-center">
          <span id="taskSumLink" class="hidden"></span>
          <button type="button" onclick="BMSUI.closeModal('modal-task-sum')" class="text-slate-500 px-3 text-sm">关闭</button>
        </div>
      </div>
    </div>

    <div id="modalUrge" class="fixed inset-0 z-[60] hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalUrge')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-md p-6 space-y-3 text-sm shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <h3 class="text-lg font-semibold">发起催办</h3>
        <input type="hidden" id="uTarget" />
        <input type="hidden" id="uTaskId" />
        <div><label class="block text-slate-600 mb-1">催办标题</label><input id="uTitle" class="w-full border rounded-xl px-3 py-2.5" /></div>
        <div><label class="block text-slate-600 mb-1">要求说明 <span class="text-red-500">*</span></label>
          <textarea id="uNote" class="w-full border rounded-xl px-3 py-2.5 h-20" placeholder="接收人可见：说明要求与期望结果"></textarea></div>
        <div><label class="block text-slate-600 mb-1">期望回复日 <span class="text-red-500">*</span></label>
          <input type="date" id="uExpect" class="w-full border rounded-xl px-3 py-2.5" value="2026-08-21" /></div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="BMSUI.closeModal('modalUrge')" class="text-slate-500 px-3">取消</button>
          <button type="button" onclick="saveUrge()" class="btn-cta text-white px-4 py-2 rounded-xl">确认催办</button>
        </div>
      </div>
    </div>

  </div>
  <script src="../assets/store.js"></script>
  <script src="../assets/common.js"></script>
  <script>
(function () {
  let editPctId = null;
  let editNameId = null;
  let editProgId = null;
  let editCell = null; // { id, field } priority | status
  let matrixCache = [];
  let planSumState = { cpId: "", filter: "" };
  let taskSumState = { cpId: "", filter: "" };
  let kwFilter = "";
  let prioFilter = "";
  let statusFilter = "";
  const CP_STATUS_OPTS = ["未开始", "进行中", "关注", "延期", "已完成"];
  const CP_PRIO_OPTS = ["P0", "P1", "P2"];

  function isEditing(id, field) {
    return editCell && editCell.id === id && editCell.field === field;
  }
  function prioTag(p) {
    const map = {
      P0: "background:#fce8e6;color:#c5221f;border-color:#f5c6c4",
      P1: "background:#fef7e0;color:#e37400;border-color:#fde293",
      P2: "background:#f1f3f4;color:#5f6368;border-color:#e8eaed",
    };
    const v = p || "P2";
    return `<span class="inline-flex px-2 py-0.5 rounded text-xs border font-medium" style="${map[v] || map.P2}">${v}</span>`;
  }

  function cellCompanyName(cp) {
    if (editNameId === cp.id) {
      return `<input class="inline-input name-input" data-name-input="${cp.id}" value="${escapeAttr(cp.name)}" />`;
    }
    return `<div class="name-wrap">
      ${BMSUI.planNameLink(cp.name, { id: cp.id, kind: "company" })}
    </div>`;
  }

  function resolveCpUrgeTarget(cp) {
    const byName = BMS4.USERS.find((u) => u.name === (cp.owner || ""));
    if (byName) return byName.id;
    const row = matrixCache.find((r) => r.companyPlan.id === cp.id);
    if (row) {
      const active = row.cells.find((c) => c.planNodes + c.taskTotal > 0 && c.ownerId);
      if (active) return active.ownerId;
    }
    const head = BMS4.USERS.find((u) => u.role === "部门长");
    return head ? head.id : "";
  }

  function cellOpsCompany(cp) {
    const items = [

    if (window.__cpReadOnly) return prioTag(cur);
    if (isEditing(cp.id, "priority")) {
      return `<select class="inline-input" data-inline="priority" data-id="${cp.id}" data-inline-focus>
        ${CP_PRIO_OPTS.map((o) => `<option value="${o}" ${o === cur ? "selected" : ""}>${o}</option>`).join("")}
      </select>`;
    }
    return `<span class="cell-edit" data-start-edit="priority" data-id="${cp.id}">${prioTag(cur)}<i class="fa-solid fa-pen pencil"></i></span>`;

  function cellStatus(cp) {
    const cur = cp.status || "进行中";
    if (window.__cpReadOnly) return BMSUI.statusBadge(cur);
    if (isEditing(cp.id, "status")) {
      return `<select class="inline-input" data-inline="status" data-id="${cp.id}" data-inline-focus>
        ${CP_STATUS_OPTS.map((o) => `<option value="${o}" ${o === cur ? "selected" : ""}>${o}</option>`).join("")}
      </select>`;

  function cellProgressNote(cp) {
    if (window.__cpReadOnly) {
      return `<span class="text-slate-600 block" title="${escapeAttr(cp.progress || "")}">${escapeHtml(
        cp.progress || "—"
      )}</span>`;
    }
    if (editProgId === cp.id) {
      return `<textarea class="prog-area" data-prog-input="${cp.id}" rows="3">${escapeHtml(cp.progress || "")}</textarea>`;
    }
    const empty = !(cp.progress || "").trim();
    return `<span class="prog-edit ${empty ? "empty" : ""}" data-edit-prog="${cp.id}" title="点击编辑进展说明"><span class="prog-text">${
      empty ? "点击填写" : escapeHtml(cp.progress)
    }</span><i class="fa-solid fa-pen pencil mt-0.5"></i></span>`;
  }

  function clearOtherEdits(keep) {
    if (keep !== "pct") editPctId = null;
    if (keep !== "name") editNameId = null;
    if (keep !== "prog") editProgId = null;
    if (keep !== "cell") editCell = null;
  }

  function bindActiveSelectEditor() {
    const el = document.querySelector("[data-inline]");
    if (!el) return;
    let done = false;
    const finish = (save) => {
      if (done) return;
      done = true;
      if (save) {
        const id = el.getAttribute("data-id");
        const field = el.getAttribute("data-inline");
        const prev = BMS4.COMPANY_PLANS.find((c) => c.id === id);
        if (prev) {
          if (field === "priority" && el.value !== prev.priority) {
            BMS4.updateCompanyPlan(id, { priority: el.value });
            logCpChange(id, "优先级", prev.priority, el.value);
            BMSUI.toast("优先级已保存");
          } else if (field === "status" && el.value !== prev.status) {
            const patch = { status: el.value };
            if (el.value === "已完成") patch.progressPct = 100;
            BMS4.updateCompanyPlan(id, patch);
            logCpChange(id, "状态", prev.status, el.value);
            BMSUI.toast("状态已保存");
          }
        }
      }
      editCell = null;
      render();
    };
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        finish(true);
      }
      if (e.key === "Escape") finish(false);
    });
    el.addEventListener("change", () => finish(true));
    el.addEventListener("blur", () => setTimeout(() => finish(false), 150));
  }

  function logCpChange(id, field, from, to) {
    if (!BMS4.appendPlanChangeLog || from === to) return;
    BMS4.appendPlanChangeLog({
      refId: id,
      refKind: "company",
      field,
      from: from == null || from === "" ? "—" : String(from),
      to: to == null || to === "" ? "—" : String(to),
      operator: (BMS4.getRoleUser() || {}).name || "李家治",
      note: "公司计划表行内修改",
    });
  }

  const PLAN_STATUS_ORDER = ["未开始", "进行中", "关注", "延期", "已完成"];
  const TASK_STATUS_ORDER = ["未开始", "进行中", "延期", "已完成", "已关闭"];

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

  function formatStatusParts(order, counts, cls, emptyText, kind, cpId) {
    const parts = order
      .filter((k) => counts[k] > 0)
      .map(
        (k) =>
          `<span class="sum-chip st-${k}" data-sum-kind="${kind}" data-sum-cp="${escapeAttr(
            cpId
          )}" data-sum-st="${escapeAttr(k)}" title="查看「${escapeAttr(k)}」明细">${k}<b>${counts[k]}</b></span>`
      )
      .join("");
    return parts
      ? `<div class="sum-line">${parts}</div>`
      : `<span class="text-slate-400 text-xs">${emptyText}</span>`;
  }

  function resolveTaskDisplayStatus(t) {
    let st = t.status || "进行中";
    if (BMS4.isTaskOverdue(t)) st = "延期";
    return st;
  }

  function plansOfCp(cpId) {
    return BMS4.PLAN_ITEMS.filter((p) => p.companyPlanId === cpId);
  }

  function tasksOfCp(cpId) {
    const planIds = new Set(plansOfCp(cpId).map((p) => p.id));
    return BMS4.taskItems.filter((t) => planIds.has(t.annualId));
  }

  function planStatusSummary(cpId) {
    const plans = plansOfCp(cpId);
    const counts = { 未开始: 0, 进行中: 0, 关注: 0, 延期: 0, 已完成: 0 };
    let latePlans = 0;
    plans.forEach((p) => {
      const st = BMS4.resolvePlanStatus(p);
      if (counts[st] !== undefined) counts[st]++;
      else counts["进行中"]++;
      if (st === "延期" || BMS4.isPlanOverdue(p)) latePlans++;
    });
    return {
      total: plans.length,
      html: formatStatusParts(PLAN_STATUS_ORDER, counts, null, "暂无子计划", "plan", cpId),
      latePlans,
      counts,
    };
  }

  function taskStatusSummary(cpId) {
    const tasks = tasksOfCp(cpId);
    const counts = { 未开始: 0, 进行中: 0, 延期: 0, 已完成: 0, 已关闭: 0 };
    let lateTasks = 0;
    tasks.forEach((t) => {
      const st = resolveTaskDisplayStatus(t);
      if (counts[st] !== undefined) counts[st]++;
      else counts["进行中"]++;
      if (st === "延期") lateTasks++;
    });
    return {
      total: tasks.length,
      html: formatStatusParts(TASK_STATUS_ORDER, counts, null, "暂无任务", "task", cpId),
      lateTasks,
      counts,
    };
  }

  function renderFilterChips(containerId, order, counts, active, onPick) {
    const el = document.getElementById(containerId);
    const chips = [
      { key: "", label: "全部 " + Object.values(counts).reduce((s, n) => s + n, 0) },
      ...order.filter((k) => counts[k] > 0).map((k) => ({ key: k, label: k + " " + counts[k] })),
    ];
    el.innerHTML = chips
      .map(
        (c) =>
          `<button type="button" class="filter-chip ${c.key === active ? "on" : ""}" data-filter="${escapeAttr(
            c.key
          )}">${escapeHtml(c.label)}</button>`
      )
      .join("");
    el.querySelectorAll("[data-filter]").forEach((btn) => {
      btn.onclick = () => onPick(btn.getAttribute("data-filter") || "");
    });
  }

  function openPlanSumModal(cpId, statusFilter) {
    const cp = BMS4.COMPANY_PLANS.find((x) => x.id === cpId);
    if (!cp) return;
    planSumState = { cpId, filter: statusFilter || "" };
    const all = plansOfCp(cpId);
    const counts = { 未开始: 0, 进行中: 0, 关注: 0, 延期: 0, 已完成: 0 };
    all.forEach((p) => {
      const st = BMS4.resolvePlanStatus(p);
      if (counts[st] !== undefined) counts[st]++;
      else counts["进行中"]++;
    });
    const filtered = planSumState.filter
      ? all.filter((p) => BMS4.resolvePlanStatus(p) === planSumState.filter)
      : all;
    document.getElementById("planSumTitle").textContent = "子计划明细 · " + cp.name;
    document.getElementById("planSumSub").textContent = planSumState.filter
      ? `筛选「${planSumState.filter}」· 共 ${filtered.length} 条`
      : `共 ${filtered.length} 条子计划`;
    renderFilterChips("planSumFilters", PLAN_STATUS_ORDER, counts, planSumState.filter, (st) =>
      openPlanSumModal(cpId, st)
    );
    document.getElementById("planSumBody").innerHTML = filtered.length
      ? filtered
          .map((p) => {
            const owner = BMS4.userById(p.ownerId);
            const st = BMS4.resolvePlanStatus(p);
            return `<tr class="border-t">
              <td class="px-3 py-2.5 font-medium leading-snug">${BMSUI.planNameLink(p.name, { id: p.id, kind: "dept" })}</td>
              <td class="px-3 py-2.5 whitespace-nowrap">${escapeHtml(p.dept || "—")}</td>
              <td class="px-3 py-2.5 whitespace-nowrap">${BMSUI.statusBadge(st)}</td>
              <td class="px-3 py-2.5 text-right tabular-nums">${BMS4.clampPct(p.progressPct)}%</td>
              <td class="px-3 py-2.5 whitespace-nowrap">${owner ? escapeHtml(owner.name) : "—"}</td>
              <td class="px-3 py-2.5 whitespace-nowrap text-xs text-slate-600">${escapeHtml(
                p.startDate || "—"
              )} ~ ${escapeHtml(p.endDate || "—")}</td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="6" class="px-3 py-10 text-center text-slate-400">${
          all.length ? "当前筛选下暂无子计划" : "暂无子计划"
        }</td></tr>`;
    BMSUI.openModal("modal-plan-sum");
  }

  function openTaskSumModal(cpId, statusFilter) {
    const cp = BMS4.COMPANY_PLANS.find((x) => x.id === cpId);
    if (!cp) return;
    taskSumState = { cpId, filter: statusFilter || "" };
    const all = tasksOfCp(cpId);
    const counts = { 未开始: 0, 进行中: 0, 延期: 0, 已完成: 0, 已关闭: 0 };
    all.forEach((t) => {
      const st = resolveTaskDisplayStatus(t);
      if (counts[st] !== undefined) counts[st]++;
      else counts["进行中"]++;
    });
    const filtered = taskSumState.filter
      ? all.filter((t) => resolveTaskDisplayStatus(t) === taskSumState.filter)
      : all.slice();
    filtered.sort((a, b) => {
      const sa = resolveTaskDisplayStatus(a) === "延期" ? 2 : BMS4.isTaskNearDue(a) ? 1 : 0;
      const sb = resolveTaskDisplayStatus(b) === "延期" ? 2 : BMS4.isTaskNearDue(b) ? 1 : 0;
      return sb - sa;
    });
    document.getElementById("taskSumTitle").textContent = "任务明细 · " + cp.name;
    document.getElementById("taskSumSub").textContent = taskSumState.filter
      ? `筛选「${taskSumState.filter}」· 共 ${filtered.length} 条`
      : `共 ${filtered.length} 条任务`;
    renderFilterChips("taskSumFilters", TASK_STATUS_ORDER, counts, taskSumState.filter, (st) =>
      openTaskSumModal(cpId, st)
    );
    document.getElementById("taskSumBody").innerHTML = filtered.length
      ? filtered
          .map((t) => {
            const owner = BMS4.userById(t.ownerId);
            const st = resolveTaskDisplayStatus(t);
            const path = BMS4.planPathLabel(t.annualId) || "—";
            const nameJs = (t.name || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
            const canUrge = st !== "已完成" && st !== "已关闭";
            return `<tr class="border-t">
              <td class="px-3 py-2.5 font-medium leading-snug">${escapeHtml(t.name)}${
              st === "延期" ? ' <span class="text-[11px] text-rose-600">[延期]</span>' : ""
            }</td>
              <td class="px-3 py-2.5 text-slate-600 max-w-[12rem] truncate" title="${escapeAttr(path)}">${
              t.annualId
                ? BMSUI.planNameLink(path, { id: t.annualId, kind: "dept", className: "plan-name-link text-teal-700 hover:underline" })
                : escapeHtml(path)
            }</td>
              <td class="px-3 py-2.5 whitespace-nowrap">${escapeHtml(t.dept || "—")}</td>
              <td class="px-3 py-2.5 whitespace-nowrap">${BMSUI.statusBadge(st)}</td>
              <td class="px-3 py-2.5 whitespace-nowrap">${owner ? escapeHtml(owner.name) : "—"}</td>
              <td class="px-3 py-2.5 whitespace-nowrap">${escapeHtml(t.deadline || t.endDate || "—")}</td>
              <td class="px-3 py-2.5 whitespace-nowrap">${
                canUrge
                  ? `<button type="button" class="text-teal-700 hover:underline" onclick="openUrge('${escapeAttr(
                      t.ownerId
                    )}','${nameJs}','${escapeAttr(t.id)}')">催办</button>`
                  : `<span class="text-slate-300">—</span>`
              }</td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="7" class="px-3 py-10 text-center text-slate-400">${
          all.length ? "当前筛选下暂无任务" : "暂无任务"
        }</td></tr>`;
    BMSUI.openModal("modal-task-sum");
  }

  window.openUrge = function (uid, name, taskId) {
    document.getElementById("uTarget").value = uid;
    document.getElementById("uTaskId").value = taskId || "";
    document.getElementById("uTitle").value = "催办：" + name;
    document.getElementById("uNote").value = "请反馈未完成原因、纠偏措施与可兑现节点。";
    document.getElementById("uExpect").value = "2026-08-21";
    BMSUI.openModal("modalUrge");
  };

  window.saveUrge = function () {
    const r = BMS4.createUrge({
      targetUserId: document.getElementById("uTarget").value,
      title: document.getElementById("uTitle").value.trim(),
      note: document.getElementById("uNote").value.trim(),
      expectReplyDate: document.getElementById("uExpect").value,
      taskId: document.getElementById("uTaskId").value || undefined,
      companyPlanId: taskSumState.cpId || undefined,
    });
    if (!r.ok) return BMSUI.toast(r.reason, false);
    BMSUI.closeModal("modalUrge");
    BMSUI.toast("已催办，对象可在待办查看要求说明");
  };

    const cp = row.companyPlan;

              <td class="px-3 py-2.5 font-medium">${escapeHtml(c.dept)}</td>
              <td class="px-3 py-2.5">${head ? escapeHtml(head.name) : "—"}</td>
              <td class="px-3 py-2.5 text-right tabular-nums">${c.planNodes}</td>
              <td class="px-3 py-2.5 text-right tabular-nums">${c.taskTotal}</td>
              <td class="px-3 py-2.5 text-right tabular-nums">${c.taskRate}%</td>
              <td class="px-3 py-2.5 text-right tabular-nums ${c.late ? "text-rose-600 font-medium" : ""}">${c.late}</td>
              <td class="px-3 py-2.5 ${c.weekFilled ? "text-emerald-600" : "text-amber-600"}">${c.weekFilled ? "已填" : "未填"}</td>

      : `<tr><td colspan="7" class="px-3 py-8 text-center text-slate-400">暂无部门承接</td></tr>`;

  function bindSumClicks() {
    document.querySelectorAll("[data-sum-open]").forEach((el) => {
      el.onclick = (e) => {
        if (e.target.closest("[data-sum-st]")) return;
        const kind = el.getAttribute("data-sum-open");
        const cpId = el.getAttribute("data-sum-cp");
        if (kind === "plan") openPlanSumModal(cpId, "");
        else openTaskSumModal(cpId, "");
      };
    });
    document.querySelectorAll("[data-sum-st]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        const kind = el.getAttribute("data-sum-kind");
        const cpId = el.getAttribute("data-sum-cp");
        const st = el.getAttribute("data-sum-st") || "";
        if (kind === "plan") openPlanSumModal(cpId, st);
        else openTaskSumModal(cpId, st);
      };
    });
  }

  function countByStatus(items, getStatus, order) {
    const counts = {};
    order.forEach((k) => (counts[k] = 0));
    items.forEach((item) => {
      const st = getStatus(item);
      if (counts[st] !== undefined) counts[st]++;
      else if (counts["进行中"] !== undefined) counts["进行中"]++;
    });
    return counts;
  }

  function statusToneClass(st) {
    if (st === "未开始") return "tone-idle";
    if (st === "进行中") return "tone-doing";
    if (st === "关注") return "tone-watch";
    if (st === "延期") return "tone-late";
    if (st === "已完成") return "tone-done";
    return "";
  }

  function renderSumCard(total, order, counts) {
    const totalCell = `<div class="sum-cell is-total ${total > 0 ? "has-val" : ""}">
      <div class="lab">合计</div>
      <div class="num ${total === 0 ? "is-zero" : ""}">${total}</div>
    </div>`;
    const cells = order
      .map((k) => {
        const n = counts[k] || 0;
        return `<div class="sum-cell ${statusToneClass(k)} ${n > 0 ? "has-val" : ""}">
          <div class="lab">${k}</div>
          <div class="num ${n === 0 ? "is-zero" : ""}">${n}</div>
        </div>`;
      })
      .join("");
    return `<div class="sum-panel"><div class="sum-cols">${totalCell}${cells}</div></div>`;
  }

  function matchCpFilter(cp) {
    if (prioFilter && (cp.priority || "P2") !== prioFilter) return false;
    if (statusFilter && (cp.status || "进行中") !== statusFilter) return false;
    const kw = kwFilter.trim().toLowerCase();
    if (kw) {
      const blob = ((cp.name || "") + " " + (cp.progress || "")).toLowerCase();
      if (!blob.includes(kw)) return false;
    }
    return true;
  }

  function render() {
    matrixCache = BMS4.companyPlanDeptMatrix();
    const rows = matrixCache.filter((row) => matchCpFilter(row.companyPlan));

    document.getElementById("cpBody").innerHTML = rows.length
      ? rows.map((row) => {
        const cp = row.companyPlan;
        const activeDepts = row.cells.filter((c) => c.planNodes + c.taskTotal > 0);
        const missDepts = activeDepts.filter((c) => !c.weekFilled);
        const sub = planStatusSummary(cp.id);
        const taskSum = taskStatusSummary(cp.id);
        const hot = sub.latePlans > 0 || taskSum.lateTasks > 0 || missDepts.length > 0;
        const pct = BMS4.clampPct(cp.progressPct);
        const barCls = pct >= 100 ? "is-done" : pct < 40 ? "is-low" : "";
        const pctCell =
          editPctId === cp.id
            ? `<input type="number" min="0" max="100" class="inline-input" data-pct-input="${cp.id}" value="${pct}" />`
            : window.__cpReadOnly
              ? `<div class="pct-wrap"><div class="font-medium tabular-nums text-slate-800">${pct}%</div><div class="pct-bar"><div class="pct-fill ${barCls}" style="width:${pct}%"></div></div></div>`
              : `<div class="pct-wrap cell-edit" data-edit-pct="${cp.id}" title="点击编辑进度">
                  <div class="font-medium tabular-nums text-slate-800">${pct}%<i class="fa-solid fa-pen pencil"></i></div>
                  <div class="pct-bar"><div class="pct-fill ${barCls}" style="width:${pct}%"></div></div>
                </div>`;

        return `<tr class="${hot ? "row-risk" : ""}">
          <td class="col-name font-medium leading-snug">${cellCompanyName(cp)}</td>
          <td class="whitespace-nowrap">${cellPriority(cp)}</td>
          <td class="whitespace-nowrap">${cellStatus(cp)}</td>
          <td class="whitespace-nowrap">${pctCell}</td>
          <td class="whitespace-nowrap">
            <button type="button" class="dept-link" data-dept-modal="${cp.id}">${activeDepts.length} 个部门</button>
          </td>
          <td class="cell-sum" data-sum-open="plan" data-sum-cp="${cp.id}" title="点击查看子计划明细">
            <div class="text-[10px] text-slate-400 mb-1">共 ${sub.total}</div>
            ${sub.html}
          </td>
          <td class="cell-sum" data-sum-open="task" data-sum-cp="${cp.id}" title="点击查看任务明细">
            <div class="text-[10px] text-slate-400 mb-1">共 ${taskSum.total}</div>
            ${taskSum.html}
          </td>
          <td class="col-prog">${cellProgressNote(cp)}</td>
          <td class="whitespace-nowrap text-slate-600">${escapeHtml(cp.startDate || "—")}</td>
          <td class="whitespace-nowrap text-slate-600">${escapeHtml(cp.endDate || "—")}</td>
          <td class="whitespace-nowrap">${cellOpsCompany(cp)}</td>
        </tr>`;
      }).join("")
      : `<tr><td colspan="11" class="text-center text-slate-400 py-12">无匹配的公司计划</td></tr>`;

    const filteredCps = rows.map((r) => r.companyPlan);
    const cpStatusOrder = PLAN_STATUS_ORDER.slice();
    const cpCounts = countByStatus(filteredCps, (cp) => cp.status || "进行中", cpStatusOrder);
    document.getElementById("kpi").innerHTML = renderSumCard(filteredCps.length, cpStatusOrder, cpCounts);

    document.querySelectorAll("[data-dept-modal]").forEach((btn) => {
      btn.onclick = () => openDeptModal(btn.getAttribute("data-dept-modal"));
    });
    bindSumClicks();
    document.querySelectorAll("[data-start-edit]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        if (window.__cpReadOnly) return;
        clearOtherEdits("cell");
        editCell = { id: el.getAttribute("data-id"), field: el.getAttribute("data-start-edit") };
        render();
        requestAnimationFrame(() => {
          const focusEl = document.querySelector("[data-inline-focus]");
          if (focusEl) focusEl.focus();
        });
      };
    });
    document.querySelectorAll("[data-edit-pct]").forEach((el) => {
      el.onclick = () => {
        clearOtherEdits("pct");
        editPctId = el.getAttribute("data-edit-pct");
        render();
        requestAnimationFrame(() => {
          const input = document.querySelector("[data-pct-input]");
          if (input) {
            input.focus();
            input.select();
          }
        });
      };
    });
    document.querySelectorAll("[data-edit-prog]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        clearOtherEdits("prog");
        editProgId = el.getAttribute("data-edit-prog");
        render();
        requestAnimationFrame(() => {
          const input = document.querySelector("[data-prog-input]");
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        });
      };
    });
    document.querySelectorAll("[data-edit-name]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        clearOtherEdits("name");
        editNameId = el.getAttribute("data-edit-name");
        render();
        requestAnimationFrame(() => {
          const input = document.querySelector("[data-name-input]");
          if (input) {
            input.focus();
            input.select();
          }
        });
      };
    });
    bindActiveSelectEditor();
    document.querySelectorAll("[data-del-cp]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.getAttribute("data-del-cp");
        const cp = BMS4.COMPANY_PLANS.find((c) => c.id === id);
        if (!cp) return;
        if (!confirm("确认删除公司计划「" + cp.name + "」？其下若仍有部门计划将无法删除。")) return;
        const r = BMS4.removeCompanyPlan(id);
        if (!r.ok) return BMSUI.toast(r.reason, false);
        BMSUI.toast("已删除");
        render();
      };
    });
    document.querySelectorAll("[data-view-cp]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        BMSUI.openPlanDetail(btn.getAttribute("data-view-cp"), "company");
      };
    });
    document.querySelectorAll("[data-edit-cp]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openEditCp(btn.getAttribute("data-edit-cp"));
      };
    });
    document.querySelectorAll("[data-urge-cp]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.getAttribute("data-urge-cp");
        const cp = BMS4.COMPANY_PLANS.find((c) => c.id === id);
        if (!cp) return;
        const uid = resolveCpUrgeTarget(cp);
        if (!uid) return BMSUI.toast("未找到可催办对象", false);
        taskSumState.cpId = id;
        openUrge(uid, cp.name, "");
      };
    });
    BMSUI.bindRowOps(document.getElementById("cpBody"));
    const input = document.querySelector("[data-pct-input]");
    if (input) {
      const finish = (save) => {
        const id = input.getAttribute("data-pct-input");
        if (save) {
          const prev = BMS4.COMPANY_PLANS.find((c) => c.id === id);
          const nextPct = BMS4.clampPct(input.value);
          if (prev && BMS4.clampPct(prev.progressPct) !== nextPct) {
            BMS4.updateCompanyPlan(id, { progressPct: nextPct });
            logCpChange(id, "整体进度", BMS4.clampPct(prev.progressPct) + "%", nextPct + "%");
            BMSUI.toast("整体进度已保存");
          }
        }
        editPctId = null;
        render();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          finish(true);
        }
        if (e.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => setTimeout(() => finish(true), 100));
    }
    const progInput = document.querySelector("[data-prog-input]");
    if (progInput) {
      const finishProg = (save) => {
        const id = progInput.getAttribute("data-prog-input");
        if (save) {
          const prev = BMS4.COMPANY_PLANS.find((c) => c.id === id);
          const text = progInput.value.trim();
          if (prev && (prev.progress || "") !== text) {
            BMS4.updateCompanyPlan(id, { progress: text });
            logCpChange(id, "进展说明", prev.progress, text);
            BMSUI.toast("进展说明已保存");
          }
        }
        editProgId = null;
        render();
      };
      progInput.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          finishProg(false);
        }
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          finishProg(true);
        }
      });
      progInput.addEventListener("blur", () => setTimeout(() => finishProg(true), 120));
    }
    const nameInput = document.querySelector("[data-name-input]");
    if (nameInput) {
      const finishName = (save) => {
        const id = nameInput.getAttribute("data-name-input");
        if (save) {
          const name = nameInput.value.trim();
          if (!name) {
            BMSUI.toast("计划名称不能为空", false);
            nameInput.focus();
            return;
          }
          const prev = BMS4.COMPANY_PLANS.find((c) => c.id === id);
          if (prev && prev.name !== name) {
            BMS4.updateCompanyPlan(id, { name });
            logCpChange(id, "计划名称", prev.name, name);
            BMSUI.toast("名称已保存");
          }
        }
        editNameId = null;
        render();
      };
      nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          finishName(true);
        }
        if (e.key === "Escape") finishName(false);
      });
      nameInput.addEventListener("blur", () => setTimeout(() => finishName(true), 120));
    }
  }

  window.saveCp = function () {
    const name = document.getElementById("cpName").value.trim();
    if (!name) return BMSUI.toast("请填写计划名称", false);
    const startDate = document.getElementById("cpStart").value;
    const endDate = document.getElementById("cpEnd").value;
    if (!startDate || !endDate) return BMSUI.toast("请填写开始与结束时间", false);
    if (endDate < startDate) return BMSUI.toast("结束时间不能早于开始时间", false);
    const patch = {
      name,
      status: document.getElementById("cpStatus").value || "进行中",
      priority: document.getElementById("cpPrio").value || "P1",
      progress: document.getElementById("cpProg").value.trim() || "新下达",
      startDate,
      endDate,
      progressPct: BMS4.clampPct(document.getElementById("cpPct").value),
    };
    const editId = document.getElementById("cpEditId").value;
    if (editId) {
      const prev = BMS4.COMPANY_PLANS.find((c) => c.id === editId);
      BMS4.updateCompanyPlan(editId, patch);
      if (prev) {
        if (prev.name !== patch.name) logCpChange(editId, "计划名称", prev.name, patch.name);
        if (prev.priority !== patch.priority) logCpChange(editId, "优先级", prev.priority, patch.priority);
        if (prev.status !== patch.status) logCpChange(editId, "状态", prev.status, patch.status);
      }
      BMSUI.closeModal("modal-cp");
      BMSUI.toast("已保存");
      render();
      return;
    }
    BMS4.COMPANY_PLANS.push({
      id: "cp_" + Date.now(),
      ...patch,
      owner: "李家治",
    });
    if (BMS4.persistDemoData) BMS4.persistDemoData();
    BMSUI.closeModal("modal-cp");
    BMSUI.toast("已下达");
    render();
  };

  document.addEventListener("DOMContentLoaded", () => {
    const roleUser = BMS4.getRoleUser();
    if (!BMS4.canViewAllPlans(roleUser)) {
      document.getElementById("page-main").innerHTML =
        '<div class="bg-white rounded-2xl border p-8 text-slate-500">本页仅总经理 / 计划管理员可见，请切换视角。</div>';
      return;
    }
    document.getElementById("btnNew").onclick = openNewCp;
    const kwEl = document.getElementById("kw");
    const prioEl = document.getElementById("fPrio");
    const statusEl = document.getElementById("fStatus");
    if (kwEl) {
      kwEl.addEventListener("input", () => {
        kwFilter = kwEl.value || "";
        render();
      });
    }
    if (prioEl) {
      prioEl.addEventListener("change", () => {
        prioFilter = prioEl.value || "";
        render();
      });
    }
    if (statusEl) {
      statusEl.addEventListener("change", () => {
        statusFilter = statusEl.value || "";
        render();
      });
    }
    window.__cpReadOnly = false;
    render();
  });
})();
  </script>
</body>
</html>
