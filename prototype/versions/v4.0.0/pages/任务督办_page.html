<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>任务督办 · v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .btn-cta { background:#0f766e; } .btn-cta:hover { background:#0d9488; }
    .grid-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .grid-table th, .grid-table td { border: 1px solid #e8eaed; padding: 8px 10px; vertical-align: middle; }
    .grid-table thead th { background: #f5f6f8; color: #5f6368; font-weight: 500; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
    .grid-table tbody tr:hover { background: #fafbfc; }
    .col-head { display: inline-flex; align-items: center; gap: 4px; }
    .tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 4px; font-size: 12px; line-height: 20px; border: 1px solid #e8eaed; background: #f1f3f4; color: #5f6368; white-space: nowrap; }
    .tag-p0 { background:#fce8e6;color:#c5221f;border-color:#f5c6c4; }
    .tag-p1 { background:#fef7e0;color:#e37400;border-color:#fde293; }
    .tag-p2 { background:#f1f3f4;color:#5f6368;border-color:#e8eaed; }
    .tag-out { background:#e8f0fe;color:#1a73e8;border-color:#c6dafc; }
    .name-link { color: #1a73e8; cursor: pointer; }
    .name-link:hover { text-decoration: underline; }
    .cell-edit { cursor: pointer; min-height: 24px; display: inline-flex; align-items: center; gap: 4px; }
    .cell-edit:hover { background: #eef5f4; border-radius: 4px; }
    .inline-input { border: 1px solid #1a73e8; border-radius: 4px; padding: 2px 6px; font-size: 13px; background: #fff; max-width: 100%; min-width: 5rem; }
    .name-wrap { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
    .helper-box { max-height: 160px; overflow: auto; border: 1px solid #1a73e8; border-radius: 8px; padding: 8px; background: #fff; min-width: 12rem; }
    .helper-box label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .helper-box label:hover { background: #f8fafc; }
    .pencil { color: #9aa0a6; font-size: 11px; opacity: 0; }
    .cell-edit:hover .pencil, .name-wrap:hover .pencil { opacity: 1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" data-page="supervise" data-title="任务督办">
  <div id="app-root"></div>
  <div id="page-main" class="hidden">

    <div id="panelSupervise">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div class="flex flex-wrap gap-2 items-center">
          <button type="button" id="btnNew" class="btn-cta text-white text-sm px-3 py-2 rounded-xl"><i class="fa-solid fa-plus mr-1"></i>下达督办</button>
          <span class="text-[11px] text-slate-400" id="currentWeekHint">当前自然周：2026-W34</span>
        </div>
        <div class="flex flex-wrap gap-2 items-center text-sm">
          <select id="fStatusFilter" class="border border-slate-200 rounded-xl px-3 py-1.5 bg-white">
            <option value="">全部状态</option>
            <option>待办</option><option>进行中</option><option>已完成</option><option>延期</option>
          </select>
          <input type="search" id="kw" placeholder="搜索事项/责任人" class="border border-slate-200 rounded-xl px-3 py-1.5 w-52" />
        </div>
      </div>
      <div class="bg-white overflow-auto border border-[#e8eaed] rounded-lg shadow-[0_1px_2px_rgba(60,64,67,0.08)]">
        <table class="grid-table min-w-[1180px]">
          <thead>
            <tr>
              <th><span class="col-head">序号</span></th>
              <th><span class="col-head">督办事项</span></th>
              <th><span class="col-head">周次</span></th>
              <th><span class="col-head">优先级</span></th>
              <th><span class="col-head">责任人</span></th>
              <th><span class="col-head">配合人员</span></th>
              <th><span class="col-head">开始时间</span></th>
              <th><span class="col-head">结束时间</span></th>
              <th><span class="col-head">下达人</span></th>
              <th><span class="col-head">状态</span></th>
              <th><span class="col-head">操作</span></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="modalForm" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalForm')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <div class="px-6 py-4 border-b flex justify-between items-center">
          <h3 class="text-lg font-semibold" id="modalFormTitle">下达督办（计划外）</h3>
          <button type="button" onclick="BMSUI.closeModal('modalForm')" class="w-9 h-9 rounded-xl border text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto px-6 py-4 space-y-3 text-sm">
          <input type="hidden" id="fEditId" value="" />
          <p class="text-[11px] text-slate-500 bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 hidden" id="fWeekTip"></p>
          <div>
            <label class="block text-slate-600 mb-1">事项名称 <span class="text-red-500">*</span></label>
            <input id="fTitle" class="w-full border rounded-xl px-3 py-2.5" placeholder="不关联任何计划" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-600 mb-1">责任人 <span class="text-red-500">*</span></label>
              <select id="fOwner" class="w-full border rounded-xl px-3 py-2.5"></select>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">优先级</label>
              <select id="fPrio" class="w-full border rounded-xl px-3 py-2.5">
                <option>P0</option><option selected>P1</option><option>P2</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-slate-600 mb-1">配合人（可多选）</label>
            <div id="fHelpers" class="helper-box" style="border-color:#e8eaed"></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-600 mb-1">开始时间</label>
              <input type="date" id="fStart" value="2026-08-18" class="w-full border rounded-xl px-3 py-2.5" />
            </div>
            <div>
              <label class="block text-slate-600 mb-1">结束时间 <span class="text-red-500">*</span></label>
              <input type="date" id="fEnd" value="2026-08-25" class="w-full border rounded-xl px-3 py-2.5" />
            </div>
          </div>
          <div id="fStatusWrap" class="hidden">
            <label class="block text-slate-600 mb-1">状态</label>
            <select id="fStatus" class="w-full border rounded-xl px-3 py-2.5">
              <option>待办</option><option>进行中</option><option>已完成</option><option>延期</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1">备注</label>
            <textarea id="fNote" rows="2" class="w-full border rounded-xl px-3 py-2.5" placeholder="可选"></textarea>
          </div>
        </div>
        <div class="px-6 py-4 border-t flex justify-end gap-2">
          <button type="button" onclick="BMSUI.closeModal('modalForm')" class="text-slate-500 px-3 text-sm">取消</button>
          <button type="button" id="btnSave" class="btn-cta text-white px-4 py-2 rounded-xl text-sm">确认下达</button>
        </div>
      </div>
    </div>

    <div id="modalView" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalView')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <div class="px-6 py-4 border-b flex justify-between items-center">
          <h3 class="text-lg font-semibold">督办详情</h3>
          <button type="button" onclick="BMSUI.closeModal('modalView')" class="w-9 h-9 rounded-xl border text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto px-6 py-4 text-sm space-y-3" id="viewBody"></div>
        <div class="px-6 py-3 border-t flex justify-end gap-2 bg-slate-50/80">
          <button type="button" onclick="BMSUI.closeModal('modalView')" class="text-sm px-4 py-2 rounded-xl border border-slate-200 bg-white">关闭</button>
          <button type="button" id="btnViewEdit" class="btn-cta text-white text-sm px-4 py-2 rounded-xl">编辑</button>
        </div>
      </div>
    </div>

    <div id="modalUrge" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
      <div class="absolute inset-0 bg-slate-900/40" onclick="BMSUI.closeModal('modalUrge')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-md p-6 space-y-3 text-sm shadow-[0_12px_40px_rgba(0,0,0,0.12)]">
        <h3 class="text-lg font-semibold">发起催办</h3>
        <input type="hidden" id="uTarget" />
        <div><label class="block text-slate-600 mb-1">催办标题</label><input id="uTitle" class="w-full border rounded-xl px-3 py-2.5" /></div>
        <div><label class="block text-slate-600 mb-1">要求说明 <span class="text-red-500">*</span></label>
          <textarea id="uNote" class="w-full border rounded-xl px-3 py-2.5 h-20" placeholder="接收人可见：督办催办要求"></textarea></div>
        <div><label class="block text-slate-600 mb-1">期望回复日 <span class="text-red-500">*</span></label>
          <input type="date" id="uExpect" class="w-full border rounded-xl px-3 py-2.5" value="2026-08-21" /></div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="BMSUI.closeModal('modalUrge')" class="text-slate-500 px-3">取消</button>
          <button type="button" id="btnUrgeSave" class="btn-cta text-white px-4 py-2 rounded-xl">确认催办</button>
        </div>
      </div>
    </div>

  </div>
  <script src="../assets/store.js"></script>
  <script src="../assets/common.js"></script>
  <script>
(function () {
  let user;
  let canEdit = false;
  let editCell = null;
  let currentWeek = "2026-W34";

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function getNaturalWeek() {
    return BMS4.getCurrentWeek ? BMS4.getCurrentWeek() : "2026-W34";
  }

  function isEditing(id, field) {
    return editCell && editCell.id === id && editCell.field === field;
  }
  function statusTag(st) {
    const map = {
      待办: "background:#f1f3f4;color:#5f6368",
      进行中: "background:#e8f0fe;color:#1a73e8",
      延期: "background:#fce8e6;color:#c5221f",
      已完成: "background:#e6f4ea;color:#137333",
    };
    return `<span class="tag" style="${map[st] || ""}">${st}</span>`;
  }
  function prioTag(p) {
    const cls = p === "P0" ? "tag-p0" : p === "P1" ? "tag-p1" : "tag-p2";
    return `<span class="tag ${cls}">${p || "P2"}</span>`;
  }
  function userLabel(id) {
    const u = BMS4.userById(id);
    return u ? u.name : "—";
  }
  function userOpts(selectedId) {
    return BMS4.USERS.map(
      (x) =>
        `<option value="${x.id}" ${x.id === selectedId ? "selected" : ""}>${escapeHtml(x.name)}（${escapeHtml(x.dept)}）</option>`
    ).join("");
  }
  function fillModalHelpers(excludeOwnerId, selectedIds) {
    const set = new Set(selectedIds || []);
    document.getElementById("fHelpers").innerHTML = BMS4.USERS.filter((x) => x.id !== excludeOwnerId)
      .map(
        (x) =>
          `<label><input type="checkbox" class="helper-cb rounded border-slate-300" value="${x.id}" ${
            set.has(x.id) ? "checked" : ""
          } /><span>${escapeHtml(x.name)}<span class="text-slate-400 text-xs ml-1">${escapeHtml(x.dept)}</span></span></label>`
      )
      .join("");
  }
  function selectedModalHelpers() {
    return [...document.querySelectorAll("#fHelpers .helper-cb:checked")].map((el) => el.value);
  }

  function filteredList() {
    const st = document.getElementById("fStatusFilter").value;
    const kw = (document.getElementById("kw").value || "").trim().toLowerCase();
    return BMS4.superviseItems.filter((m) => {
      if (!canEdit) {
        const isOwner = m.ownerId === user.id;
        const isHelper = (m.helperIds || []).includes(user.id);
        if (!isOwner && !isHelper) return false;
      }
      if (st && m.status !== st) return false;
      if (!kw) return true;
      const ou = BMS4.userById(m.ownerId);
      const blob = [m.title, ou && ou.name, m.helper, m.note].join(" ").toLowerCase();
      return blob.includes(kw);
    });
  }

  function cellTitle(m) {
    if (canEdit && isEditing(m.id, "title")) {
      return `<input class="inline-input" style="min-width:14rem" data-inline="title" data-id="${m.id}" data-inline-focus value="${escapeAttr(m.title)}" />`;
    }
    return `<div>
      <div class="name-wrap">
        <span class="font-medium text-slate-800">${escapeHtml(m.title)}</span>
      </div>
      <div class="mt-0.5"><span class="tag tag-out">计划外</span>${
        m.note ? `<span class="text-[11px] text-slate-400 ml-2">${escapeHtml(m.note)}</span>` : ""
      }</div>
    </div>`;
  }

  function cellOpsSupervise(m) {
    const items = [{ label: "查看", attrs: `data-view="${m.id}"` }];
    if (canEdit) {
      items.push({ label: "编辑", attrs: `data-edit="${m.id}"` });
      if (m.status !== "已完成") {
        items.push({ label: "催办", attrs: `data-urge="${m.id}"` });
        items.push({ label: "标记完成", attrs: `data-done="${m.id}"` });
      }
      items.push({ label: "删除", attrs: `data-del="${m.id}"`, danger: true });
    }
    return BMSUI.rowOpsHtml(items);
  }

  function cellSelect(m, field, displayHtml, options) {
    if (!canEdit) return displayHtml;
    if (isEditing(m.id, field)) {
      let opts = options;
      if (field === "ownerId") {
        opts = BMS4.USERS.map((u) => ({ value: u.id, label: u.name + " · " + u.dept }));
      } else {
        opts = options.map((o) => ({ value: o, label: o }));
      }
      const cur = m[field];
      return `<select class="inline-input" data-inline="${field}" data-id="${m.id}" data-inline-focus>
        ${opts.map((o) => `<option value="${o.value}" ${o.value === cur ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}
      </select>`;
    }
    return `<span class="cell-edit" data-start-edit="${field}" data-id="${m.id}">${displayHtml}<i class="fa-solid fa-pen pencil"></i></span>`;
  }

  function cellDate(m, field) {
    const val = m[field] || "";
    if (!canEdit) return `<span class="text-slate-600 whitespace-nowrap">${escapeHtml(val || "—")}</span>`;
    if (isEditing(m.id, field)) {
      return `<input type="date" class="inline-input" data-inline="${field}" data-id="${m.id}" data-inline-focus value="${val}" />`;
    }
    return `<span class="cell-edit text-slate-700 whitespace-nowrap" data-start-edit="${field}" data-id="${m.id}">${
      val || "—"
    }<i class="fa-solid fa-pen pencil"></i></span>`;
  }

  function cellHelpers(m) {
    const ids = m.helperIds || [];
    const names = ids.map((id) => userLabel(id)).filter((n) => n !== "—");
    const label = names.length
      ? `<span class="text-slate-600" title="${escapeAttr(names.join("、"))}">${escapeHtml(
          names.slice(0, 2).join("、") + (names.length > 2 ? " +" + (names.length - 2) : "")
        )}</span>`
      : `<span class="text-slate-400">—</span>`;
    if (!canEdit) return label;
    if (isEditing(m.id, "helperIds")) {
      const set = new Set(ids);
      return `<div class="helper-box" data-inline="helperIds" data-id="${m.id}" data-inline-focus tabindex="0">
        ${BMS4.USERS.filter((u) => u.id !== m.ownerId)
          .map(
            (u) =>
              `<label><input type="checkbox" class="inline-helper-cb" value="${u.id}" ${
                set.has(u.id) ? "checked" : ""
              } /><span>${escapeHtml(u.name)}</span></label>`
          )
          .join("")}
        <div class="pt-1 border-t mt-1 flex justify-end">
          <button type="button" class="text-teal-700 text-xs px-2 py-1" data-helper-save="${m.id}">完成</button>
        </div>
      </div>`;
    }
    return `<span class="cell-edit" data-start-edit="helperIds" data-id="${m.id}">${label}<i class="fa-solid fa-pen pencil"></i></span>`;
  }

  function renderRow(m, idx) {
    const ou = BMS4.userById(m.ownerId);
    const cu = BMS4.userById(m.creatorId);
    const week = m.week || "—";
    const isCur = week === getNaturalWeek();
    return `<tr>
      <td class="text-slate-500 whitespace-nowrap">${idx}</td>
      <td>${cellTitle(m)}</td>
      <td class="whitespace-nowrap text-slate-600">${escapeHtml(week)}${
        isCur ? '<span class="tag ml-1" style="background:#ecfdf5;color:#0f766e;border-color:#a7f3d0">本周</span>' : ""
      }</td>
      <td>${cellSelect(m, "priority", prioTag(m.priority), ["P0", "P1", "P2"])}</td>
      <td class="whitespace-nowrap">${cellSelect(
        m,
        "ownerId",
        ou
          ? `${escapeHtml(ou.name)}<div class="text-[10px] text-slate-400">${escapeHtml(ou.dept)}</div>`
          : "—",
        null
      )}</td>
      <td class="max-w-[10rem]">${cellHelpers(m)}</td>
      <td>${cellDate(m, "startDate")}</td>
      <td>${cellDate(m, "endDate")}</td>
      <td class="whitespace-nowrap text-slate-600">${cu ? escapeHtml(cu.name) : "—"}</td>
      <td>${cellSelect(m, "status", statusTag(m.status), ["待办", "进行中", "已完成", "延期"])}</td>
      <td class="whitespace-nowrap">${cellOpsSupervise(m)}</td>
    </tr>`;
  }

  function applyInline(el) {
    if (!el) return;
    const id = el.getAttribute("data-id");
    const field = el.getAttribute("data-inline");
    const item = BMS4.superviseItems.find((x) => x.id === id);
    if (!item) return;
    let patch = null;
    if (field === "title") {
      const title = el.value.trim();
      if (!title) return BMSUI.toast("名称不能为空", false);
      if (title !== item.title) patch = { title };
    } else if (field === "priority" || field === "status") {
      if (el.value !== item[field]) patch = { [field]: el.value };
    } else if (field === "ownerId") {
      if (el.value !== item.ownerId) {
        patch = {
          ownerId: el.value,
          helperIds: (item.helperIds || []).filter((h) => h !== el.value),
        };
      }
    } else if (field === "startDate" || field === "endDate") {
      const v = el.value;
      if (field === "endDate" && !v) return BMSUI.toast("请填写结束时间", false);
      const start = field === "startDate" ? v : item.startDate;
      const end = field === "endDate" ? v : item.endDate;
      if (start && end && end < start) return BMSUI.toast("结束时间不能早于开始时间", false);
      if (v !== (item[field] || "")) patch = { [field]: v };
    } else if (field === "helperIds") {
      const helperIds = [...el.querySelectorAll(".inline-helper-cb:checked")].map((x) => x.value);
      patch = { helperIds };
    }
    if (patch) {
      const r = BMS4.updateSuperviseTask(id, patch);
      if (!r.ok) return BMSUI.toast(r.reason || "保存失败", false);
      BMSUI.toast("已保存");
    }
  }

  function bindActiveEditor() {
    const el = document.querySelector("[data-inline]");
    if (!el) return;
    if (el.getAttribute("data-inline") === "helperIds") {
      const saveBtn = el.querySelector("[data-helper-save]");
      if (saveBtn) {
        saveBtn.onclick = (e) => {
          e.stopPropagation();
          applyInline(el);
          editCell = null;
          render();
        };
      }
      el.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          editCell = null;
          render();
        }
      });
      return;
    }
    let done = false;
    const finish = (save) => {
      if (done) return;
      done = true;
      if (save) applyInline(el);
      editCell = null;
      render();
    };
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        finish(true);
      }
      if (e.key === "Escape") finish(false);
    });
    if (el.tagName === "SELECT") {
      el.addEventListener("change", () => finish(true));
      el.addEventListener("blur", () => setTimeout(() => finish(false), 150));
    } else {
      el.addEventListener("change", () => finish(true));
      el.addEventListener("blur", () => setTimeout(() => finish(true), 120));
    }
  }

  function render() {
    const list = filteredList();
    document.getElementById("tbody").innerHTML = list.length
      ? list.map((m, i) => renderRow(m, i + 1)).join("")
      : `<tr><td colspan="11" class="text-center text-slate-400 py-10">暂无督办事项</td></tr>`;

    document.querySelectorAll("[data-start-edit]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        editCell = { id: el.getAttribute("data-id"), field: el.getAttribute("data-start-edit") };
        render();
        requestAnimationFrame(() => {
          const focusEl = document.querySelector("[data-inline-focus]");
          if (focusEl) focusEl.focus();
        });
      };
    });
    document.querySelectorAll("[data-view]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openView(btn.getAttribute("data-view"));
      };
    });
    document.querySelectorAll("[data-edit]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openEdit(btn.getAttribute("data-edit"));
      };
    });
    document.querySelectorAll("[data-urge]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const m = BMS4.superviseItems.find((x) => x.id === btn.getAttribute("data-urge"));
        if (!m) return;
        document.getElementById("uTarget").value = m.ownerId;
        document.getElementById("uTitle").value = "催办（督办）：" + m.title;
        document.getElementById("uNote").value = "请按督办事项反馈进展、卡点与承诺完成日。";
        document.getElementById("uExpect").value = "2026-08-21";
        BMSUI.openModal("modalUrge");
      };
    });
    document.querySelectorAll("[data-done]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const r = BMS4.completeSuperviseTodo(btn.getAttribute("data-done"));
        if (!r.ok) return BMSUI.toast(r.reason || "失败", false);
        BMSUI.toast("已完成");
        render();
      };
    });
    document.querySelectorAll("[data-del]").forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        if (!confirm("确认删除该督办事项？")) return;
        const r = BMS4.removeSuperviseTask(btn.getAttribute("data-del"));
        if (!r.ok) return BMSUI.toast(r.reason || "失败", false);
        BMSUI.toast("已删除");
        render();
      };
    });
    BMSUI.bindRowOps(document.getElementById("tbody"));
    bindActiveEditor();
  }

  function openView(id) {
    const m = BMS4.superviseItems.find((x) => x.id === id);
    if (!m) return;
    const ou = BMS4.userById(m.ownerId);
    const cu = BMS4.userById(m.creatorId);
    const helpers = (m.helperIds || [])
      .map((hid) => userLabel(hid))
      .filter((n) => n !== "—")
      .join("、");
    document.getElementById("viewBody").innerHTML = `
      <div><div class="text-xs text-slate-400">事项名称</div><div class="font-medium text-slate-800 mt-0.5">${escapeHtml(m.title)}</div></div>
      <div class="grid grid-cols-2 gap-3">
        <div><div class="text-xs text-slate-400">周次</div><div class="mt-0.5">${escapeHtml(m.week || "—")}</div></div>
        <div><div class="text-xs text-slate-400">优先级</div><div class="mt-0.5">${prioTag(m.priority)}</div></div>
        <div><div class="text-xs text-slate-400">责任人</div><div class="mt-0.5">${ou ? escapeHtml(ou.name + " · " + ou.dept) : "—"}</div></div>
        <div><div class="text-xs text-slate-400">状态</div><div class="mt-0.5">${statusTag(m.status)}</div></div>
        <div><div class="text-xs text-slate-400">开始</div><div class="mt-0.5">${escapeHtml(m.startDate || "—")}</div></div>
        <div><div class="text-xs text-slate-400">结束</div><div class="mt-0.5">${escapeHtml(m.endDate || "—")}</div></div>
      </div>
      <div><div class="text-xs text-slate-400">配合人员</div><div class="mt-0.5">${escapeHtml(helpers || "—")}</div></div>
      <div><div class="text-xs text-slate-400">下达人</div><div class="mt-0.5">${cu ? escapeHtml(cu.name) : "—"}</div></div>
      <div><div class="text-xs text-slate-400">备注</div><div class="mt-0.5 text-slate-600">${escapeHtml(m.note || "—")}</div></div>`;
    const btnEdit = document.getElementById("btnViewEdit");
    btnEdit.classList.toggle("hidden", !canEdit);
    btnEdit.onclick = () => {
      BMSUI.closeModal("modalView");
      openEdit(id);
    };
    BMSUI.openModal("modalView");
  }

  function openEdit(id) {
    const m = BMS4.superviseItems.find((x) => x.id === id);
    if (!m) return;
    document.getElementById("fEditId").value = id;
    document.getElementById("modalFormTitle").textContent = "编辑督办";
    document.getElementById("btnSave").textContent = "保存";
    document.getElementById("fStatusWrap").classList.remove("hidden");
    document.getElementById("fTitle").value = m.title || "";
    document.getElementById("fPrio").value = m.priority || "P1";
    document.getElementById("fStart").value = m.startDate || "";
    document.getElementById("fEnd").value = m.endDate || "";
    document.getElementById("fStatus").value = m.status || "待办";
    document.getElementById("fNote").value = m.note || "";
    document.getElementById("fOwner").innerHTML = userOpts(m.ownerId);
    fillModalHelpers(m.ownerId, m.helperIds || []);
    document.getElementById("fOwner").onchange = () =>
      fillModalHelpers(document.getElementById("fOwner").value, selectedModalHelpers());
    BMSUI.openModal("modalForm");
  }

  function openNew() {
    currentWeek = getNaturalWeek();
    document.getElementById("fEditId").value = "";
    document.getElementById("modalFormTitle").textContent = "下达督办（计划外）";
    document.getElementById("btnSave").textContent = "确认下达";
    document.getElementById("fStatusWrap").classList.add("hidden");
    document.getElementById("fTitle").value = "";
    document.getElementById("fPrio").value = "P1";
    document.getElementById("fStart").value = "2026-08-18";
    document.getElementById("fEnd").value = "2026-08-25";
    document.getElementById("fNote").value = "";
    const defaultOwner = BMS4.USERS.find((x) => x.id !== user.id) || BMS4.USERS[0];
    document.getElementById("fOwner").innerHTML = userOpts(defaultOwner && defaultOwner.id);
    fillModalHelpers(document.getElementById("fOwner").value, []);
    document.getElementById("fOwner").onchange = () =>
      fillModalHelpers(document.getElementById("fOwner").value, selectedModalHelpers());
    BMSUI.openModal("modalForm");
  }

  document.addEventListener("DOMContentLoaded", () => {
    user = BMS4.getRoleUser();
    currentWeek = getNaturalWeek();
    canEdit = user.role === "总经理" || user.role === "部门长" || user.role === "计划管理员";
    document.getElementById("currentWeekHint").textContent = "当前自然周：" + currentWeek;
    if (!canEdit) {
      document.getElementById("btnNew").classList.add("hidden");
    }

    document.getElementById("btnNew").onclick = openNew;
    document.getElementById("fStatusFilter").onchange = render;
    document.getElementById("kw").oninput = render;

    document.getElementById("btnSave").onclick = () => {
      const title = document.getElementById("fTitle").value.trim();
      const ownerId = document.getElementById("fOwner").value;
      const endDate = document.getElementById("fEnd").value;
      if (!title) return BMSUI.toast("请填写事项名称", false);
      if (!ownerId) return BMSUI.toast("请选择责任人", false);
      if (!endDate) return BMSUI.toast("请填写结束时间", false);
      const startDate = document.getElementById("fStart").value;
      if (startDate && endDate < startDate) return BMSUI.toast("结束时间不能早于开始时间", false);
      const editId = document.getElementById("fEditId").value;
      const payload = {
        title,
        ownerId,
        helperIds: selectedModalHelpers(),
        priority: document.getElementById("fPrio").value,
        startDate,
        endDate,
        note: document.getElementById("fNote").value.trim(),
      };
      if (editId) {
        payload.status = document.getElementById("fStatus").value;
        const r = BMS4.updateSuperviseTask(editId, payload);
        if (!r.ok) return BMSUI.toast(r.reason || "保存失败", false);
        BMSUI.closeModal("modalForm");
        BMSUI.toast("已保存");
        render();
        return;
      }
      const r = BMS4.addSuperviseTask({
        ...payload,
        week: getNaturalWeek(),
        creatorId: user.id,
      });
      if (!r.ok) return BMSUI.toast(r.reason, false);
      BMSUI.closeModal("modalForm");
      BMSUI.toast("已下达（挂当前自然周）");
      render();
    };

    document.getElementById("btnUrgeSave").onclick = () => {
      const r = BMS4.createUrge({
        targetUserId: document.getElementById("uTarget").value,
        title: document.getElementById("uTitle").value.trim(),
        note: document.getElementById("uNote").value.trim(),
        expectReplyDate: document.getElementById("uExpect").value,
        exceptionType: "任务督办",
      });
      if (!r.ok) return BMSUI.toast(r.reason, false);
      BMSUI.closeModal("modalUrge");
      BMSUI.toast("已催办，对象可在待办查看要求说明");
    };

    render();
  });
})();
  </script>
</body>
</html>
