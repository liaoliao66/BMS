<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>任务管理 · v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .btn-cta { background:#0f766e; } .btn-cta:hover { background:#0d9488; }
    .tab-on { color:#0f766e; border-bottom:2px solid #0f766e; font-weight:600; }
    .tab-off { color:#64748b; border-bottom:2px solid transparent; }
    .view-on { background:#0f766e; color:#fff; }
    .mode-on { background:#0f766e; color:#fff; }
    .mode-off { background:#fff; color:#64748b; }
    .grid-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .grid-table th, .grid-table td { border: 1px solid #e8eaed; padding: 8px 10px; vertical-align: middle; }
    .grid-table thead th { background: #f5f6f8; color: #5f6368; font-weight: 500; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
    .grid-table tbody tr:hover { background: #fafbfc; }
    .grid-table tbody tr.plan-row { background: #fafbfc; }
    .col-head { display: inline-flex; align-items: center; gap: 4px; }
    .col-head i { font-size: 10px; color: #9aa0a6; }
    .tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 4px; font-size: 12px; line-height: 20px; border: 1px solid transparent; white-space: nowrap; }
    .tag-muted { background: #f1f3f4; color: #5f6368; border-color: #e8eaed; }
    .tag-p0 { background: #fce8e6; color: #c5221f; border-color: #f5c6c4; }
    .tag-p1 { background: #fef7e0; color: #e37400; border-color: #fde293; }
    .tag-p2 { background: #f1f3f4; color: #5f6368; border-color: #e8eaed; }
    .tag-st-doing { background: #e8f0fe; color: #1a73e8; border-color: #c6dafc; }
    .tag-st-todo { background: #f1f3f4; color: #5f6368; border-color: #e8eaed; }
    .tag-st-done { background: #e6f4ea; color: #137333; border-color: #ceead6; }
    .tag-st-closed { background: #f1f3f4; color: #80868b; border-color: #e8eaed; }
    .tag-st-late { background: #fce8e6; color: #c5221f; border-color: #f5c6c4; }
    .name-link { color: #1a73e8; cursor: pointer; text-decoration: none; }
    .name-link:hover { text-decoration: underline; }
    .caret-btn { color: #0f766e; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent; padding: 0; cursor: pointer; }
    .cell-edit { cursor: pointer; min-height: 24px; display: inline-flex; align-items: center; gap: 4px; }
    .cell-edit:hover { background: #eef5f4; border-radius: 4px; }
    .inline-input { border: 1px solid #1a73e8; border-radius: 4px; padding: 2px 6px; font-size: 13px; background: #fff; max-width: 100%; min-width: 4.5rem; }
    .inline-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(26,115,232,0.15); }
    .pencil { color: #9aa0a6; font-size: 11px; opacity: 0; }
    .cell-edit:hover .pencil, .name-wrap:hover .pencil { opacity: 1; }
    .name-wrap { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; }
    .frac { color: #9aa0a6; font-size: 12px; margin-left: 6px; }
    .attach-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: #fff; border: 1px solid #e2e8f0; font-size: 12px; color: #475569; }
    .attach-chip button { border: none; background: transparent; color: #94a3b8; cursor: pointer; padding: 0 2px; line-height: 1; }
    .attach-chip button:hover { color: #c5221f; }
    .new-menu { position: absolute; top: calc(100% + 4px); left: 0; min-width: 11.5rem; background: #fff; border: 1px solid #e8eaed; border-radius: 12px; box-shadow: 0 8px 24px rgba(15,23,42,0.12); padding: 4px; z-index: 30; }
    .new-menu button { display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #334155; background: transparent; border: none; cursor: pointer; }
    .new-menu button:hover { background: #f1f5f9; color: #0f766e; }
    .new-menu .sub { display: block; font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .form-section { border: 1px solid #e8eaed; border-radius: 12px; overflow: hidden; background: #fff; }
    .form-section-hd { padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 600; color: #1e293b; }
    .form-section-bd { padding: 14px; }
    .form-label { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .form-label .req { color: #ef4444; margin-left: 2px; }
    .form-ctrl { width: 100%; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 12px; font-size: 13px; color: #0f172a; background: #fff; transition: border-color .15s, box-shadow .15s; }
    .form-ctrl:hover { border-color: #cbd5e1; }
    .form-ctrl:focus { outline: none; border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15,118,110,0.12); }
    textarea.form-ctrl { resize: vertical; min-height: 72px; line-height: 1.5; }
    .seg { display: inline-flex; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; background: #fff; }
    .seg button { padding: 8px 14px; font-size: 13px; border: none; cursor: pointer; background: transparent; color: #64748b; }
    .seg button + button { border-left: 1px solid #e2e8f0; }
    .seg .mode-on { background: #0f766e; color: #fff; }
    .seg .mode-off { background: #fff; color: #64748b; }
    .seg .mode-off:hover { background: #f8fafc; color: #0f766e; }
    .attach-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 18px 12px; border: 1px dashed #cbd5e1; border-radius: 10px; background: #f8fafc; cursor: pointer; transition: border-color .15s, background .15s; }
    .attach-zone-compact { padding: 12px 10px; gap: 4px; flex-direction: row; justify-content: flex-start; }
    .attach-zone:hover { border-color: #0f766e; background: #f0fdfa; }
    .btn-ghost { border: 1px solid #e2e8f0; background: #fff; color: #64748b; border-radius: 10px; padding: 8px 16px; font-size: 13px; }
    .btn-ghost:hover { background: #f8fafc; color: #334155; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" data-page="mine" data-title="任务管理">
  <div id="app-root"></div>
  <div id="page-main" class="hidden">

    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 mb-4">
      <div class="flex flex-wrap gap-1 text-sm" id="statusTabs"></div>
      <div class="inline-flex rounded-xl overflow-hidden text-sm mb-1 shrink-0 border border-slate-200">
        <button type="button" id="btnTree" class="view-on px-3 py-1.5">树结构</button>
        <button type="button" id="btnFlat" class="bg-white text-slate-600 px-3 py-1.5">平铺列表</button>
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex flex-wrap gap-2">
        <div class="relative inline-block" id="newMenuWrap">
          <button type="button" id="btnNew" class="btn-cta text-white text-sm px-3 py-2 rounded-xl inline-flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i>新建任务<i class="fa-solid fa-chevron-down text-[10px] opacity-80"></i>
          </button>
          <div id="newMenu" class="new-menu hidden">
            <button type="button" id="btnNewPlan">关联计划任务<span class="sub">须挂计划，可设上级任务</span></button>
            <button type="button" id="btnNewTemp">临时任务<span class="sub">不挂计划，归入临时分组</span></button>
          </div>
        </div>
        <a id="btnImportTask" href="计划导入_page.html?mode=task" class="hidden text-sm px-3 py-2 rounded-xl border border-teal-200 bg-teal-50 text-teal-800"><i class="fa-solid fa-file-import mr-1"></i>导入任务</a>
        <button type="button" id="btnCollapse" class="text-sm px-3 py-2 rounded-xl border border-slate-200 bg-white">一键收起</button>
        <button type="button" id="btnReset" class="text-sm px-3 py-2 rounded-xl border border-slate-200 bg-white">重置</button>
      </div>
      <div class="flex flex-wrap gap-2 items-center text-sm">
        <input type="date" id="dateFrom" value="2026-08-01" class="border border-slate-200 rounded-xl px-2 py-1.5" />
        <span class="text-slate-400">~</span>
        <input type="date" id="dateTo" value="2026-08-31" class="border border-slate-200 rounded-xl px-2 py-1.5" />
        <input type="search" id="kw" placeholder="请输入计划或任务名称" class="border border-slate-200 rounded-xl px-3 py-1.5 w-52" />
      </div>
    </div>

    <div class="bg-white overflow-auto border border-[#e8eaed] rounded-lg shadow-[0_1px_2px_rgba(60,64,67,0.08)]">
      <table class="grid-table min-w-[1100px]">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6">
      <div class="absolute inset-0 bg-slate-900/45" onclick="BMSUI.closeModal('modal')"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col border border-slate-200 shadow-2xl">
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-start justify-between gap-3 shrink-0">
          <div class="min-w-0">
            <h3 class="text-lg font-semibold text-slate-900 leading-snug" id="modalTitle">新建任务</h3>
            <p class="text-xs text-slate-500 mt-1 hidden" id="modalSub"></p>
          </div>
          <button type="button" onclick="BMSUI.closeModal('modal')" class="w-9 h-9 rounded-xl border border-slate-200 text-slate-400 hover:text-slate-600 shrink-0" title="关闭">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-4 bg-slate-50/50">
          <input type="hidden" id="editId" />
          <p id="taskKindBadge" class="hidden text-xs text-slate-500 items-center gap-2 mb-3">
            <span class="tag tag-muted" id="taskKindBadgeText">临时任务</span>
          </p>

          <div class="form-section hidden mb-3" id="createModeWrap">
            <div class="form-section-hd">创建方式</div>
            <div class="form-section-bd flex flex-wrap items-end gap-3">
              <div class="seg" id="createModeSeg">
                <button type="button" id="btnModeSelf" class="mode-on">自建（给我）</button>
                <button type="button" id="btnModeAssign" class="mode-off">下达给他人</button>
              </div>
              <p class="text-[11px] text-slate-400 hidden" id="createModeHint"></p>
              <div id="ownerWrap" class="hidden flex-1 min-w-[12rem]">
                <label class="form-label">处理人 <span class="req">*</span></label>
                <select id="fOwner" class="form-ctrl"></select>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 items-start">
            <div class="space-y-3">
              <div class="form-section">
                <div class="form-section-hd">基本信息</div>
                <div class="form-section-bd space-y-3">
                  <div>
                    <label class="form-label">任务名称 <span class="req">*</span></label>
                    <input id="fName" class="form-ctrl" placeholder="请输入任务名称" />
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="form-label">任务类型</label>
                      <select id="fType" class="form-ctrl">
                        <option>生产作业</option><option>设备维保</option><option>安全环保</option><option>市场商务</option><option>其他</option>
                      </select>
                    </div>
                    <div>
                      <label class="form-label">优先级</label>
                      <select id="fPrio" class="form-ctrl">
                        <option>P0</option><option selected>P1</option><option>P2</option>
                      </select>
                    </div>
                  </div>
                  <div id="editExtra" class="hidden space-y-3">
                    <div>
                      <label class="form-label">完成状态</label>
                      <select id="fStatus" class="form-ctrl">
                        <option>未开始</option><option>进行中</option><option>已完成</option><option>已关闭</option><option>延期</option>
                      </select>
                    </div>
                    <div>
                      <label class="form-label">完成情况说明</label>
                      <textarea id="fCompletionNote" rows="3" class="form-ctrl" placeholder="说明当前进展、已完成内容或未完成原因"></textarea>
                    </div>
                  </div>
                </div>
              </div>

              <div class="form-section" id="planFieldsWrap">
                <div class="form-section-hd">计划与归属</div>
                <div class="form-section-bd space-y-3">
                  <div>
                    <label class="form-label">关联计划 <span class="req" id="annualReq">*</span></label>
                    <select id="fAnnual" class="form-ctrl"></select>
                  </div>
                  <div>
                    <label class="form-label">上级任务</label>
                    <select id="fParent" class="form-ctrl"><option value="">无</option></select>
                  </div>
                </div>
              </div>
            </div>

            <div class="space-y-3">
              <div class="form-section">
                <div class="form-section-hd">时间与工时</div>
                <div class="form-section-bd">
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="form-label">开始时间 <span class="req">*</span></label>
                      <input type="date" id="fStart" value="2026-08-18" class="form-ctrl" />
                    </div>
                    <div>
                      <label class="form-label">结束时间 <span class="req">*</span></label>
                      <input type="date" id="fEnd" value="2026-08-31" class="form-ctrl" />
                    </div>
                  </div>
                  <p class="text-[11px] text-slate-400 mt-2.5" id="fHoursHint">耗费工时：—</p>
                </div>
              </div>

              <div class="form-section">
                <div class="form-section-hd">备注与附件</div>
                <div class="form-section-bd space-y-3">
                  <div>
                    <label class="form-label">备注</label>
                    <textarea id="fRemark" rows="2" class="form-ctrl" placeholder="可选"></textarea>
                  </div>
                  <div>
                    <label class="form-label">附件</label>
                    <label class="attach-zone attach-zone-compact" for="fAttach">
                      <i class="fa-solid fa-cloud-arrow-up text-slate-400"></i>
                      <span class="text-sm text-slate-600">点击添加附件</span>
                      <input type="file" id="fAttach" class="hidden" multiple />
                    </label>
                    <div id="fAttachList" class="flex flex-wrap gap-2 mt-2"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="px-5 py-3 border-t border-slate-100 flex justify-end gap-2 shrink-0 bg-slate-50/80">
          <button type="button" onclick="BMSUI.closeModal('modal')" class="btn-ghost">取消</button>
          <button type="button" onclick="saveTask()" class="btn-cta text-white px-4 py-2 rounded-[10px] text-sm">保存</button>
        </div>
      </div>
    </div>

    <!-- 任务详情（对齐公司计划详情大弹窗） -->
    <div id="modalTaskDetail" class="fixed inset-0 z-[90] hidden items-center justify-center p-3 sm:p-6">
      <div class="absolute inset-0 bg-slate-900/45" data-task-detail-close></div>
      <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden border border-slate-200">
        <div class="px-5 py-4 border-b border-slate-100 flex items-start justify-between gap-3 shrink-0">
          <div class="min-w-0">
            <div class="text-[11px] text-slate-400" id="tdBread"></div>
            <h3 class="text-lg font-semibold text-slate-900 leading-snug mt-0.5" id="tdTitle">任务详情</h3>
            <p class="text-xs text-slate-500 mt-1" id="tdSub"></p>
          </div>
          <button type="button" class="w-9 h-9 rounded-xl border border-slate-200 text-slate-400 hover:text-slate-600 shrink-0" data-task-detail-close title="关闭">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="px-5 py-2 border-b border-slate-50 flex flex-wrap gap-2 shrink-0" id="tdActions"></div>
        <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4" id="tdBody"></div>
        <div class="px-5 py-3 border-t border-slate-100 flex justify-end shrink-0 bg-slate-50/80">
          <button type="button" class="text-sm px-4 py-2 rounded-xl border border-slate-200 bg-white text-slate-600" data-task-detail-close>关闭</button>
        </div>
      </div>
    </div>

  </div>
  <script src="../assets/store.js"></script>
  <script src="../assets/common.js"></script>
  <script>
(function () {
  const CLOSED = "已关闭";
  const DONE = "已完成";
  let scopeTab = "mine";
  let statusFilter = "open";
  let viewMode = "tree";
  let collapsed = new Set();
  let user;
  /** 当前正在编辑的单元格 { id, field } */
  let editCell = null;
  /** 新建：self | assign */
  let createMode = "self";
  /** 新建类别：计划 | 临时 */
  let taskKind = "计划";
  /** 弹窗附件草稿（仅文件名） */
  let draftAttachments = [];
  let detailTaskId = null;

  const SCOPE_TABS_HEAD = [
    { id: "mine", label: "我负责的" },
    { id: "dept", label: "本部门" },
  ];
  const SCOPE_TABS_ADMIN = [
    { id: "all", label: "全部任务" },
    { id: "mine", label: "我负责的" },
  ];
  let deptFilterAdmin = "";
  const STATUS_TABS = [
    { id: "open", label: "未关闭" },
    { id: "未开始", label: "未开始" },
    { id: "进行中", label: "进行中" },
    { id: DONE, label: "已完成" },
    { id: CLOSED, label: "已关闭" },
    { id: "全部", label: "全部" },
  ];

  function prioTag(p) {
    const cls = p === "P0" ? "tag-p0" : p === "P1" ? "tag-p1" : "tag-p2";
    return `<span class="tag ${cls}">${p || "P2"}</span>`;
  }
  function statusTag(st) {
    const map = {
      未开始: "tag-st-todo",
      进行中: "tag-st-doing",
      已完成: "tag-st-done",
      已关闭: "tag-st-closed",
      延期: "tag-st-late",
      关注: "tag-st-late",
    };
    return `<span class="tag ${map[st] || "tag-muted"}">${st}</span>`;
  }
  function isEditing(id, field) {
    return editCell && editCell.id === id && editCell.field === field;
  }

  function canAssignTasks() {
    return user.role === "部门长" || BMS4.isPlanAdmin(user);
  }

  function basePool() {
    if (BMS4.isPlanAdmin(user)) {
      if (scopeTab === "mine") return BMS4.tasksForUser(user.id);
      let list = BMS4.taskItems.slice();
      if (deptFilterAdmin) list = list.filter((t) => t.dept === deptFilterAdmin);
      return list;
    }
    if (scopeTab === "dept" && user.role === "部门长") return BMS4.tasksForDept(user.dept);
    return BMS4.tasksForUser(user.id);
  }

  function hoursLabel(t) {
    const h = BMS4.taskWorkHours ? BMS4.taskWorkHours(t) : 0;
    return h ? h + "h" : "—";
  }
  function sumWorkHours(list) {
    return list.reduce((s, t) => s + (BMS4.taskWorkHours ? BMS4.taskWorkHours(t) : 0), 0);
  }
  function refreshModalHoursHint() {
    const el = document.getElementById("fHoursHint");
    if (!el) return;
    const s = document.getElementById("fStart").value;
    const e = document.getElementById("fEnd").value;
    const h = BMS4.workHoursByRange ? BMS4.workHoursByRange(s, e) : 0;
    el.textContent = h ? "耗费工时：" + h + " 小时" : "耗费工时：—";
  }

  function inDateRange(t) {
    const from = document.getElementById("dateFrom").value;
    const to = document.getElementById("dateTo").value;
    const d = (BMS4.taskEndDate ? BMS4.taskEndDate(t) : t.endDate || t.deadline) || t.createdAt;
    if (from && d < from) return false;
    if (to && d > to) return false;
    return true;
  }

  function matchKw(t, planName) {
    const kw = (document.getElementById("kw").value || "").trim();
    if (!kw) return true;
    return (t.name || "").includes(kw) || (planName || "").includes(kw);
  }

  function matchStatusFixed(t) {
    if (statusFilter === "全部") return true;
    if (statusFilter === "open") return t.status !== CLOSED;
    return t.status === statusFilter;
  }

  function filteredTasks() {
    return basePool().filter((t) => {
      const plan = isTemp(t) ? null : BMS4.annualById(t.annualId);
      const planName = isTemp(t) ? "临时任务" : plan ? plan.name : "";
      return matchStatusFixed(t) && inDateRange(t) && matchKw(t, planName);
    });
  }

  function taskChildren(parentId, pool) {
    return pool.filter((t) => t.parentId === parentId);
  }


  function isTemp(t) {
    return BMS4.isTempTask ? BMS4.isTempTask(t) : !t.annualId;
  }

  /** 树：一级=计划（或临时任务分组），其下=任务 */
  function buildTreeRows(pool) {
    const hitIds = new Set(pool.map((t) => t.id));
    const allDeptOrMine = basePool();
    const need = new Set(hitIds);
    pool.forEach((t) => {
      let p = t.parentId;
      while (p) {
        need.add(p);
        const parent = BMS4.taskItems.find((x) => x.id === p);
        p = parent ? parent.parentId : null;
      }
    });
    const taskPool = allDeptOrMine.filter((t) => need.has(t.id) || hitIds.has(t.id));
    const planTasks = taskPool.filter((t) => !isTemp(t));
    const tempTasks = taskPool.filter((t) => isTemp(t));

    const planIds = [...new Set(planTasks.map((t) => t.annualId).filter(Boolean))];
    const plans = planIds
      .map((id) => BMS4.annualById(id))
      .filter(Boolean)
      .sort((a, b) => a.name.localeCompare(b.name, "zh"));

    const rows = [];
    let groupIdx = 0;

    function appendTaskGroup(planOrGroup, under, idxLabel) {
      const roots = under.filter((t) => !t.parentId || !under.some((x) => x.id === t.parentId));
      const doneCnt = under.filter((t) => t.status === DONE || t.status === CLOSED).length;
      const planKey = planOrGroup.isTempGroup ? planOrGroup.id : "plan:" + planOrGroup.id;
      rows.push({
        kind: "plan",
        plan: planOrGroup,
        idx: idxLabel,
        depth: 0,
        childCount: roots.length,
        doneKids: doneCnt,
        totalKids: under.length,
        workHours: sumWorkHours(under),
        collapseKey: planKey,
      });
      if (collapsed.has(planKey)) return;
      function walkTask(node, prefix, depth) {
        const kids = taskChildren(node.id, under);
        const dk = kids.filter((k) => k.status === DONE || k.status === CLOSED).length;
        rows.push({
          kind: "task",
          task: node,
          plan: planOrGroup.isTempGroup ? null : planOrGroup,
          idx: prefix,
          depth,
          childCount: kids.length,
          doneKids: dk,
          collapseKey: node.id,
        });
        if (collapsed.has(node.id)) return;
        kids.forEach((k, i) => walkTask(k, prefix + "." + (i + 1), depth + 1));
      }
      roots.forEach((r, i) => walkTask(r, idxLabel + "." + (i + 1), 1));
    }

    plans.forEach((plan) => {
      groupIdx += 1;
      appendTaskGroup(
        plan,
        planTasks.filter((t) => t.annualId === plan.id),
        String(groupIdx)
      );
    });

    if (tempTasks.length) {
      groupIdx += 1;
      appendTaskGroup(
        { id: "__temp__", name: "临时任务", status: "—", isTempGroup: true },
        tempTasks,
        String(groupIdx)
      );
    }
    return rows;
  }

  function buildFlatRows(pool) {
    return pool
      .slice()
      .sort((a, b) => {
        const ta = isTemp(a);
        const tb = isTemp(b);
        if (ta !== tb) return ta ? 1 : -1;
        const pa = BMS4.annualById(a.annualId);
        const pb = BMS4.annualById(b.annualId);
        const na = ta ? "临时任务" : pa ? pa.name : "";
        const nb = tb ? "临时任务" : pb ? pb.name : "";
        const c = na.localeCompare(nb, "zh");
        return c !== 0 ? c : (a.name || "").localeCompare(b.name || "", "zh");
      })
      .map((t, i) => ({
        kind: "task",
        task: t,
        plan: isTemp(t) ? null : BMS4.annualById(t.annualId),
        idx: String(i + 1),
        depth: 0,
        childCount: 0,
        doneKids: 0,
        collapseKey: t.id,
      }));
  }

  function deleteTask(id) {
    const t = BMS4.taskItems.find((x) => x.id === id);

    BMSUI.toast("已删除");
    render();

  function cellSelect(t, field, displayHtml, options) {
    if (isEditing(t.id, field)) {
      let opts = options;
      if (field === "ownerId") {
        let candidates = BMS4.USERS.filter((u) => u.dept === t.dept && u.role !== "总经理");
        if (user.role === "员工") candidates = candidates.filter((u) => u.id === user.id || u.id === t.ownerId);
        opts = candidates.map((u) => ({ value: u.id, label: u.name }));
      } else {
        opts = options.map((o) => ({ value: o, label: o }));
      }
      const cur = field === "ownerId" ? t.ownerId : t[field];
      return `<select class="inline-input" data-inline="${field}" data-id="${t.id}" data-inline-focus>
        ${opts.map((o) => `<option value="${o.value}" ${o.value === cur ? "selected" : ""}>${o.label}</option>`).join("")}
      </select>`;
    }
    return `<span class="cell-edit" data-start-edit="${field}" data-id="${t.id}">${displayHtml}<i class="fa-solid fa-pen pencil"></i></span>`;
  }

  function cellDateField(t, field) {
    const val = field === "startDate" ? BMS4.taskStartDate(t) : BMS4.taskEndDate(t);
    if (isEditing(t.id, field)) {
      return `<input type="date" class="inline-input" data-inline="${field}" data-id="${t.id}" data-inline-focus value="${val || ""}" />`;
    }
    return `<span class="cell-edit text-slate-700 whitespace-nowrap" data-start-edit="${field}" data-id="${t.id}">${val || "—"}<i class="fa-solid fa-pen pencil"></i></span>`;
  }

  function escapeAttr(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;");
  }
  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function bindActiveEditor() {
    const el = document.querySelector("[data-inline]");
    if (!el) return;
    let done = false;
    const finish = (save) => {
      if (done) return;
      done = true;
      if (save) applyInline(el);
      editCell = null;
      render();
    };
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        finish(true);
      }
      if (e.key === "Escape") finish(false);
    });
    if (el.tagName === "SELECT") {
      el.addEventListener("change", () => finish(true));
      el.addEventListener("blur", () => setTimeout(() => finish(false), 150));
    } else {
      el.addEventListener("change", () => finish(true));
      el.addEventListener("blur", () => setTimeout(() => finish(true), 120));
    }
  }

  function applyInline(el) {
    if (!el) return;
    const id = el.getAttribute("data-id");
    const field = el.getAttribute("data-inline");
    const task = BMS4.taskItems.find((x) => x.id === id);
    if (!task) return;
    let patch = null;
    if (field === "name") {
      const name = el.value.trim();
      if (!name) return BMSUI.toast("名称不能为空", false);
      if (name !== task.name) patch = { name };
    } else if (field === "priority") {
      if (el.value !== task.priority) patch = { priority: el.value };
    } else if (field === "ownerId") {
      if (el.value !== task.ownerId) {
        const ou = BMS4.userById(el.value);
        patch = { ownerId: el.value, dept: ou ? ou.dept : task.dept };
      }
    } else if (field === "status") {
      const st = el.value;
      if (st === CLOSED && task.status !== DONE && task.status !== CLOSED) {
        return BMSUI.toast("须先「已完成」才能「已关闭」", false);
      }
      if (st !== task.status) patch = { status: st };
    } else if (field === "startDate" || field === "endDate") {
      const v = el.value;
      if (!v) return BMSUI.toast("请填写日期", false);
      const start = field === "startDate" ? v : BMS4.taskStartDate(task);
      const end = field === "endDate" ? v : BMS4.taskEndDate(task);
      if (start && end && end < start) return BMSUI.toast("结束时间不能早于开始时间", false);
      if (v !== (task[field] || "")) patch = field === "endDate" ? { endDate: v, deadline: v } : { startDate: v };
    }
    if (patch) {
      const r = BMS4.updateTask(id, patch);
      if (r && r.ok === false) return BMSUI.toast(r.reason, false);
      BMSUI.toast("已保存");
    }
  }

  function applyTaskKindUI(kind) {
    taskKind = kind === "临时" ? "临时" : "计划";
    const wrap = document.getElementById("planFieldsWrap");
    if (wrap) wrap.classList.toggle("hidden", taskKind === "临时");
    if (createMode === "assign") fillOwners();
  }

  function modalCreateTitle() {
    if (createMode === "assign") {
      return taskKind === "临时" ? "下达临时任务" : "下达任务";
    }
    return taskKind === "临时" ? "新建临时任务" : "新建任务";
  }

  function modalCreateSub() {
    if (document.getElementById("editId").value) {
      return taskKind === "临时" ? "编辑临时任务信息" : "编辑关联计划任务信息";
    }
    if (createMode === "assign") {
      return taskKind === "临时" ? "选择处理人并下达临时任务" : "选择处理人并下达关联计划任务";
    }
    return taskKind === "临时" ? "不挂计划，保存后归入「临时任务」分组" : "须选择关联计划，可挂上级任务";
  }

  function setCreateMode(mode) {
    createMode = mode === "assign" && canAssignTasks() ? "assign" : "self";
    const selfBtn = document.getElementById("btnModeSelf");
    const assignBtn = document.getElementById("btnModeAssign");
    if (selfBtn && assignBtn) {
      selfBtn.className = createMode === "self" ? "mode-on" : "mode-off";
      assignBtn.className = createMode === "assign" ? "mode-on" : "mode-off";
    }
    document.getElementById("ownerWrap").classList.toggle("hidden", createMode !== "assign");
    if (!document.getElementById("editId").value) {
      document.getElementById("modalTitle").textContent = modalCreateTitle();
    }
    fillOwners();
  }

  function fillOwners() {
    const sel = document.getElementById("fOwner");
    if (!sel) return;
    sel.innerHTML = "";
    if (createMode !== "assign") return;
    const aid = taskKind === "计划" ? document.getElementById("fAnnual").value : "";
    const plan = aid ? BMS4.planById(aid) : null;
    if (BMS4.isPlanAdmin(user)) {
      BMS4.USERS.filter((x) => x.role !== "总经理").forEach((x) => {
        const o = document.createElement("option");
        o.value = x.id;
        o.textContent = x.role + " · " + x.name + "（" + x.dept + "）";
        if (x.id === user.id) o.textContent += "（我）";
        sel.appendChild(o);
      });
      return;
    }
    BMS4.USERS.filter((x) => x.dept === user.dept && x.role !== "总经理").forEach((x) => {
      const o = document.createElement("option");
      o.value = x.id;
      o.textContent = "本部门 · " + x.name;
      if (x.id === user.id) o.textContent += "（我）";
      sel.appendChild(o);
    });
    if (taskKind === "计划" && plan && plan.companyPlanId) {
      BMS4.PLAN_ITEMS.filter((x) => x.companyPlanId === plan.companyPlanId && x.dept !== user.dept).forEach((x) => {
        const h = BMS4.USERS.find((uu) => uu.dept === x.dept && uu.role === "部门长");
        if (h && ![...sel.options].some((op) => op.value === h.id)) {
          const o = document.createElement("option");
          o.value = h.id;
          o.textContent = "关联部门长 · " + h.name + "（" + h.dept + "）";
          sel.appendChild(o);
        }
      });
    }
  }

  function fillAnnualAndParent(excludeId, annualId) {
    const ann = document.getElementById("fAnnual");
    ann.innerHTML = "";
    const plans = BMS4.isPlanAdmin(user)
      ? BMS4.PLAN_ITEMS.slice().sort((a, b) => (a.dept || "").localeCompare(b.dept || "", "zh") || (a.name || "").localeCompare(b.name || "", "zh"))
      : BMS4.plansForDept(user.dept);
    plans.forEach((a) => {
      const o = document.createElement("option");
      o.value = a.id;
      o.textContent = (BMS4.isPlanAdmin(user) ? a.dept + " · " : "") + BMS4.planPathLabel(a.id);
      ann.appendChild(o);
    });
    if (annualId) ann.value = annualId;
    const refreshParent = () => {
      const psel = document.getElementById("fParent");
      const aid = ann.value;
      psel.innerHTML = '<option value="">无</option>';
      const parentPool = BMS4.isPlanAdmin(user) ? BMS4.taskItems : BMS4.tasksForDept(user.dept);
      parentPool
        .filter((t) => t.annualId === aid && t.id !== excludeId)
        .forEach((t) => {
          const o = document.createElement("option");
          o.value = t.id;
          o.textContent = t.name;
          psel.appendChild(o);
        });
      fillOwners();
    };
    ann.onchange = refreshParent;
    refreshParent();
  }

  function openNew(preferAssign, kind) {
    document.getElementById("editId").value = "";
    document.getElementById("editExtra").classList.add("hidden");
    document.getElementById("taskKindBadge").classList.add("hidden");
    document.getElementById("fName").value = "";
    document.getElementById("fRemark").value = "";
    const fDoneNew = document.getElementById("fCompletionNote");
    if (fDoneNew) fDoneNew.value = "";
    draftAttachments = [];
    renderAttachList();
    const fin = document.getElementById("fAttach");
    if (fin) fin.value = "";
    document.getElementById("fStart").value = "2026-08-18";
    document.getElementById("fEnd").value = "2026-08-31";
    refreshModalHoursHint();
    fillAnnualAndParent(null);
    const typeMap = { 生产操作部: "生产作业", 设备技术部: "设备维保", 安全监督部: "安全环保", 市场开发部: "市场商务" };
    document.getElementById("fType").value = typeMap[user.dept] || "其他";
    const canAssign = canAssignTasks();
    document.getElementById("createModeWrap").classList.toggle("hidden", !canAssign);
    applyTaskKindUI(kind === "临时" ? "临时" : "计划");
    setCreateMode(preferAssign && canAssign ? "assign" : "self");
    document.getElementById("modalTitle").textContent = modalCreateTitle();
    document.getElementById("modalSub").textContent = modalCreateSub();
    BMSUI.openModal("modal");
  }

  function openEdit(id) {
    const t = BMS4.taskItems.find((x) => x.id === id);
    if (!t) return;
    const kind = isTemp(t) ? "临时" : "计划";
    document.getElementById("modalTitle").textContent = kind === "临时" ? "更新临时任务" : "更新任务";
    document.getElementById("modalSub").textContent = kind === "临时" ? "编辑临时任务信息" : "编辑关联计划任务信息";
    document.getElementById("editId").value = id;
    document.getElementById("editExtra").classList.remove("hidden");
    const badge = document.getElementById("taskKindBadge");
    const badgeText = document.getElementById("taskKindBadgeText");
    badge.classList.remove("hidden");
    badgeText.textContent = kind === "临时" ? "临时任务" : "关联计划任务";
    document.getElementById("createModeWrap").classList.add("hidden");
    document.getElementById("ownerWrap").classList.add("hidden");
    document.getElementById("fName").value = t.name;
    document.getElementById("fType").value = t.taskType || "其他";
    document.getElementById("fPrio").value = t.priority || "P1";
    document.getElementById("fStart").value = BMS4.taskStartDate(t) || "2026-08-18";
    document.getElementById("fEnd").value = BMS4.taskEndDate(t) || "2026-08-31";
    document.getElementById("fStatus").value = t.status;
    document.getElementById("fRemark").value = t.remark || "";
    const fDone = document.getElementById("fCompletionNote");
    if (fDone) fDone.value = t.completionNote || "";
    draftAttachments = (t.attachments || []).map((a) => ({ name: a.name || a }));
    renderAttachList();
    const fin = document.getElementById("fAttach");
    if (fin) fin.value = "";
    refreshModalHoursHint();
    fillAnnualAndParent(id, t.annualId || "");
    document.getElementById("fParent").value = t.parentId || "";
    applyTaskKindUI(kind);
    BMSUI.openModal("modal");
  }

  window.saveTask = function () {
    const name = document.getElementById("fName").value.trim();
    const startDate = document.getElementById("fStart").value;
    const endDate = document.getElementById("fEnd").value;
    if (!name) return BMSUI.toast("请填写任务名称", false);
    if (!startDate || !endDate) return BMSUI.toast("请填写开始与结束时间", false);
    if (endDate < startDate) return BMSUI.toast("结束时间不能早于开始时间", false);
    const editId = document.getElementById("editId").value;
    const isAssign = !editId && createMode === "assign" && canAssignTasks();
    const ownerId = isAssign ? document.getElementById("fOwner").value : user.id;
    if (isAssign && !ownerId) return BMSUI.toast("请选择处理人", false);
    const annualId = taskKind === "计划" ? document.getElementById("fAnnual").value : "";
    if (taskKind === "计划" && !annualId) return BMSUI.toast("请选择关联计划", false);
    const remark = document.getElementById("fRemark").value.trim();
    const attachments = draftAttachments.map((a) => ({ name: a.name }));
    const payload = {
      name,
      annualId,
      taskKind,
      ownerId,
      parentId: taskKind === "计划" ? document.getElementById("fParent").value || null : null,
      taskType: document.getElementById("fType").value,
      priority: document.getElementById("fPrio").value,
      remark,
      attachments,
      startDate,
      endDate,
      deadline: endDate,
      source: isAssign ? "下达" : "自建",
    };
    if (!editId) {
      BMS4.addAssignTask(payload);
      BMSUI.closeModal("modal");
      BMSUI.toast(
        isAssign
          ? taskKind === "临时"
            ? "已下达临时任务"
            : "已下达，对方任务已生成"
          : taskKind === "临时"
            ? "已新建临时任务"
            : "已新建任务"
      );
      if (isAssign && ownerId !== user.id) {
        scopeTab = BMS4.isPlanAdmin(user) ? "all" : user.role === "部门长" ? "dept" : "mine";
      }
      render();
      return;
    }
    const st = document.getElementById("fStatus").value;
    const old = BMS4.taskItems.find((x) => x.id === editId);
    if (!old) return;
    if (st === CLOSED && old.status !== DONE && old.status !== CLOSED) {
      return BMSUI.toast("须先变为「已完成」，才能「已关闭」", false);
    }
    const lockedKind = isTemp(old) ? "临时" : "计划";
    const patch = {
      name: payload.name,
      taskType: payload.taskType,
      priority: payload.priority,
      remark: payload.remark,
      completionNote: (document.getElementById("fCompletionNote") || {}).value
        ? document.getElementById("fCompletionNote").value.trim()
        : "",
      attachments: payload.attachments,
      startDate,
      endDate,
      deadline: endDate,
      status: st,
      taskKind: lockedKind,
    };
    if (lockedKind === "计划") {
      patch.annualId = payload.annualId;
      patch.parentId = payload.parentId;
    } else {
      patch.annualId = "";
      patch.parentId = null;
    }
    const ur = BMS4.updateTask(editId, patch);
    if (ur && ur.ok === false) return BMSUI.toast(ur.reason, false);
    BMSUI.closeModal("modal");
    BMSUI.toast("已更新");
    render();
  };

  function resetFilters() {
    scopeTab = "mine";
    statusFilter = "open";
    viewMode = "tree";
    collapsed.clear();
    document.getElementById("dateFrom").value = "2026-08-01";
    document.getElementById("dateTo").value = "2026-08-31";
    document.getElementById("kw").value = "";
    render();
  }

  document.addEventListener("DOMContentLoaded", () => {
    user = BMS4.getRoleUser();
    if (user.role === "总经理") {
      document.getElementById("page-main").innerHTML =
        '<div class="bg-white rounded-2xl border p-8 text-slate-500">总经理请使用「计划与任务监督 / 宏观一表」。本页面向员工、部门长与计划管理员。</div>';
      return;
    }
    if (BMS4.isPlanAdmin(user)) {
      // 同页同名「任务管理」；管理员全量范围与导入入口由权限控制
      scopeTab = "all";
      const btnImp = document.getElementById("btnImportTask");
      if (btnImp) btnImp.classList.remove("hidden");
      const wrap = document.querySelector("#page-main .flex.flex-wrap.items-center.justify-between.gap-3.mb-4 .flex.flex-wrap.gap-2.items-center");
      if (wrap && !document.getElementById("fDeptTask")) {
        const sel = document.createElement("select");
        sel.id = "fDeptTask";
        sel.className = "border border-slate-200 rounded-xl px-2 py-1.5 bg-white";
        sel.innerHTML =
          '<option value="">全部部门</option>' + BMS4.DEPTS.map((d) => `<option value="${d}">${d}</option>`).join("");
        sel.onchange = () => {
          deptFilterAdmin = sel.value;
          render();
        };
        wrap.insertBefore(sel, wrap.firstChild);
      }
    }
    document.getElementById("btnTree").onclick = () => {
      viewMode = "tree";
      render();
    };
    document.getElementById("btnFlat").onclick = () => {
      viewMode = "flat";
      render();
    };
    const newMenu = document.getElementById("newMenu");
    const closeNewMenu = () => newMenu.classList.add("hidden");
    document.getElementById("btnNew").onclick = (e) => {
      e.stopPropagation();
      newMenu.classList.toggle("hidden");
    };
    document.getElementById("btnNewPlan").onclick = () => {
      closeNewMenu();
      openNew(false, "计划");
    };
    document.getElementById("btnNewTemp").onclick = () => {
      closeNewMenu();
      openNew(false, "临时");
    };
    document.addEventListener("click", (e) => {
      if (!document.getElementById("newMenuWrap").contains(e.target)) closeNewMenu();
    });
    document.getElementById("fAttach").addEventListener("change", (e) => {
      const files = Array.from(e.target.files || []);
      files.forEach((f) => {
        if (!f || !f.name) return;
        if (draftAttachments.some((a) => a.name === f.name)) return;
        draftAttachments.push({ name: f.name });
      });
      e.target.value = "";
      renderAttachList();
    });
    document.getElementById("modalTaskDetail").addEventListener("click", (e) => {
      if (e.target.closest("[data-task-detail-close]")) closeTaskDetail();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const root = document.getElementById("modalTaskDetail");
        if (root && !root.classList.contains("hidden")) closeTaskDetail();
      }
    });
    document.getElementById("btnModeSelf").onclick = () => setCreateMode("self");
    document.getElementById("btnModeAssign").onclick = () => setCreateMode("assign");
    document.getElementById("btnCollapse").onclick = () => {
      filteredTasks().forEach((t) => {
        if (t.annualId) collapsed.add("plan:" + t.annualId);
        if (t.parentId) collapsed.add(t.parentId);
      });
      const plans = BMS4.isPlanAdmin(user) ? BMS4.PLAN_ITEMS : BMS4.plansForDept(user.dept);
      plans.forEach((a) => collapsed.add("plan:" + a.id));
      collapsed.add("__temp__");
      render();
    };
    document.getElementById("btnReset").onclick = resetFilters;
    ["dateFrom", "dateTo", "kw"].forEach((id) => {
      document.getElementById(id).addEventListener("input", render);
      document.getElementById(id).addEventListener("change", render);
    });
    ["fStart", "fEnd"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("change", refreshModalHoursHint);
    });
    const params = new URLSearchParams(location.search);
    render();
    if (params.get("mode") === "assign" && canAssignTasks()) {
      openNew(true, params.get("kind") === "temp" ? "临时" : "计划");
    }
  });
})();
  </script>
</body>
