<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>经营目标管理系统 · 原型总入口</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-6xl mx-auto px-6 py-10">
    <header class="mb-8">
      <p class="text-sm text-slate-500 mb-2">BMS · GitHub Pages 静态发布入口</p>
      <h1 class="text-2xl font-semibold text-slate-900">经营目标管理系统 · 原型与文档总入口</h1>
      <p class="mt-2 text-slate-600 text-sm leading-relaxed">本页汇总全部版本的 PRD 与各端原型链接。v1.0.0 已完成 PC 端原型。</p>
    </header>
    <div class="bg-white rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] overflow-hidden border border-slate-100">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center gap-2">
        <i class="fa-solid fa-table text-slate-500"></i>
        <span class="font-medium">版本一览</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-100 text-slate-600">
            <tr>
              <th class="px-4 py-3 font-medium whitespace-nowrap">版本号</th>
              <th class="px-4 py-3 font-medium">版本迭代说明</th>
              <th class="px-4 py-3 font-medium whitespace-nowrap">PC端原型入口</th>
              <th class="px-4 py-3 font-medium whitespace-nowrap">独立App原型入口</th>
              <th class="px-4 py-3 font-medium whitespace-nowrap">企微H5原型入口</th>
              <th class="px-4 py-3 font-medium whitespace-nowrap">对应版本PRD文档</th>
            </tr>
          </thead>
          <tbody>
            <tr class="border-t border-slate-100 hover:bg-slate-50">
              <td class="px-4 py-3 font-medium text-slate-900 whitespace-nowrap">v1.0.0</td>
              <td class="px-4 py-3 text-slate-600">码头运营语境；专项；目标介绍/截止/状态原因（当前版持续迭代）</td>
              <td class="px-4 py-3"><a href="./versions/v1.0.0/index.html" class="text-teal-700 hover:underline">打开 PC 原型</a></td>
              <td class="px-4 py-3"><span class="text-slate-400">未生成</span></td>
              <td class="px-4 py-3"><span class="text-slate-400">未生成</span></td>
              <td class="px-4 py-3"><a href="../docs/versions/v1.0.0/prd.html" class="text-teal-700 hover:underline">打开 PRD</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p class="mt-6 text-xs text-slate-400">提示：本地可直接打开本页；推送到 GitHub Pages 后可通过仓库静态地址访问。</p>
  </div>
</body>
</html>
