<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>经营管理系统 · PRD 阅读页</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --toc-w: 260px;
      --content-max: 940px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--slate-50);
      color: var(--slate-800);
      line-height: 1.7;
    }
    .layout { display: flex; min-height: 100vh; }
    .toc {
      position: sticky;
      top: 0;
      align-self: flex-start;
      width: var(--toc-w);
      flex-shrink: 0;
      height: 100vh;
      overflow-y: auto;
      background: var(--slate-900);
      color: var(--slate-200);
      padding: 20px 14px 32px;
      border-right: 1px solid var(--slate-800);
    }
    .toc-brand {
      font-size: 12px;
      color: var(--slate-400);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .toc-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin: 0 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--slate-700);
    }
    .toc nav a {
      display: block;
      color: var(--slate-300);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 2px;
      line-height: 1.4;
    }
    .toc nav a:hover { background: var(--slate-800); color: #fff; }
    .toc nav a.active { background: var(--slate-700); color: #fff; }
    .toc nav a.l2 { padding-left: 22px; font-size: 12px; color: var(--slate-400); }
    .toc nav a.l3 { padding-left: 34px; font-size: 12px; color: var(--slate-500); }
    .main-wrap {
      flex: 1;
      min-width: 0;
      padding: 28px 24px 64px;
    }
    .main {
      max-width: var(--content-max);
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      padding: 36px 40px 48px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .status {
      color: var(--slate-500);
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }
    .status.error { color: #b91c1c; }
    #content h1 {
      font-size: 1.75rem;
      color: var(--slate-900);
      margin: 0 0 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--slate-200);
    }
    #content h2 {
      font-size: 1.35rem;
      color: var(--slate-900);
      margin: 2rem 0 0.85rem;
      padding-top: 0.5rem;
      scroll-margin-top: 16px;
    }
    #content h3 {
      font-size: 1.1rem;
      color: var(--slate-800);
      margin: 1.5rem 0 0.6rem;
      scroll-margin-top: 16px;
    }
    #content h4 {
      font-size: 1rem;
      color: var(--slate-700);
      margin: 1.25rem 0 0.5rem;
      scroll-margin-top: 16px;
    }
    #content p { margin: 0.65rem 0; }
    #content ul, #content ol { margin: 0.5rem 0 0.5rem 1.25rem; padding: 0; }
    #content li { margin: 0.25rem 0; }
    #content a { color: var(--slate-700); text-decoration: underline; text-underline-offset: 2px; }
    #content a:hover { color: var(--slate-900); }
    #content hr {
      border: none;
      border-top: 1px solid var(--slate-200);
      margin: 1.75rem 0;
    }
    #content blockquote {
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      border-left: 3px solid var(--slate-400);
      background: var(--slate-100);
      color: var(--slate-600);
      border-radius: 0 8px 8px 0;
    }
    #content blockquote p { margin: 0.35rem 0; }
    #content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin: 1rem 0;
      overflow-x: auto;
      display: block;
    }
    #content thead { background: var(--slate-100); }
    #content th, #content td {
      border: 1px solid var(--slate-200);
      padding: 0.55rem 0.75rem;
      text-align: left;
      vertical-align: top;
      color: var(--slate-700);
    }
    #content th {
      font-weight: 600;
      color: var(--slate-800);
      white-space: nowrap;
    }
    #content tbody tr:nth-child(even) { background: var(--slate-50); }
    #content code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.86em;
      background: var(--slate-100);
      color: var(--slate-700);
      padding: 0.1em 0.35em;
      border-radius: 4px;
      border: 1px solid var(--slate-200);
    }
    #content pre {
      background: var(--slate-800);
      color: var(--slate-100);
      padding: 1rem 1.15rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1rem 0;
      border: 1px solid var(--slate-700);
    }
    #content pre code {
      background: transparent;
      border: none;
      color: inherit;
      padding: 0;
      font-size: 0.85rem;
    }
    #content .mermaid {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
      overflow-x: auto;
      text-align: center;
    }
    .footer-note {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--slate-200);
      font-size: 12px;
      color: var(--slate-400);
    }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .toc {
        position: relative;
        width: 100%;
        height: auto;
        max-height: 42vh;
      }
      .main { padding: 24px 18px 36px; border-radius: 0; border-left: none; border-right: none; }
      .main-wrap { padding: 0 0 48px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="toc" id="toc">
      <div class="toc-brand">BMS · v1.0.0</div>
      <h2 class="toc-title">文档目录</h2>
      <nav id="toc-nav" aria-label="目录导航">
        <p style="font-size:12px;color:#94a3b8;padding:0 10px;">加载中…</p>
      </nav>
    </aside>
    <div class="main-wrap">
      <article class="main">
        <div id="status" class="status">正在加载 PRD…</div>
        <div id="content" hidden></div>
        <p class="footer-note" id="footer-note" hidden>本文档由 <code>prd.md</code> 渲染生成 · 经营管理系统</p>
      </article>
    </div>
  </div>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "neutral",
      securityLevel: "loose",
      flowchart: { htmlLabels: true }
    });

    function slugify(text) {
      return String(text)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^\w\u4e00-\u9fff\-]/g, "");
    }

    function buildToc(container, nav) {
      const heads = container.querySelectorAll("h1, h2, h3, h4");
      nav.innerHTML = "";
      const frag = document.createDocumentFragment();
      heads.forEach(function (h) {
        if (!h.id) h.id = slugify(h.textContent);
        const level = parseInt(h.tagName.substring(1), 10);
        if (level === 1) return;
        const a = document.createElement("a");
        a.href = "#" + h.id;
        a.textContent = h.textContent;
        a.className = "l" + level;
        frag.appendChild(a);
      });
      if (!frag.childNodes.length) {
        nav.innerHTML = '<p style="font-size:12px;color:#94a3b8;padding:0 10px;">暂无目录</p>';
        return;
      }
      nav.appendChild(frag);
    }

    async function renderMermaid(container) {
      const blocks = container.querySelectorAll("pre code.language-mermaid, pre code.lang-mermaid");
      let failCount = 0;
      for (let idx = 0; idx < blocks.length; idx++) {
        const code = blocks[idx];
        const pre = code.parentElement;
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = code.textContent;
        div.setAttribute("data-mermaid-idx", String(idx));
        pre.replaceWith(div);
        try {
          await mermaid.run({ nodes: [div] });
        } catch (err) {
          failCount++;
          const fallback = document.createElement("pre");
          fallback.className = "mermaid-fallback";
          fallback.style.cssText = "background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:8px;font-size:12px;overflow:auto;white-space:pre-wrap;";
          fallback.textContent = "流程图渲染失败（不影响正文阅读），源码：\n" + code.textContent;
          div.replaceWith(fallback);
          console.warn("Mermaid block " + idx + " failed", err);
        }
      }
      if (failCount) {
        const note = document.createElement("p");
        note.className = "footer-note";
        note.style.color = "#b45309";
        note.textContent = "部分 Mermaid 流程图未能渲染（共 " + failCount + " 处），正文与表格已正常加载。";
        container.appendChild(note);
      }
    }

    async function loadPrd() {
      const status = document.getElementById("status");
      const content = document.getElementById("content");
      const nav = document.getElementById("toc-nav");
      try {
        const res = await fetch("./prd.md", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const md = await res.text();
        marked.setOptions({ gfm: true, breaks: false });
        content.innerHTML = marked.parse(md);
        content.querySelectorAll("h1, h2, h3, h4").forEach(function (h) {
          if (!h.id) h.id = slugify(h.textContent);
        });
        buildToc(content, nav);
        status.hidden = true;
        content.hidden = false;
        document.getElementById("footer-note").hidden = false;
        await renderMermaid(content);
      } catch (err) {
        status.className = "status error";
        status.textContent = "PRD 加载失败：" + (err && err.message ? err.message : String(err)) + "。请确认同目录存在 prd.md，并通过本地/静态服务器访问。";
        nav.innerHTML = '<p style="font-size:12px;color:#94a3b8;padding:0 10px;">加载失败</p>';
      }
    }

    loadPrd();
  </script>
</body>
</html>
